name: Actor16 free contracts
on:
  push:
    branches: [research/gemini-k31-actor16-20261104]
    paths: ['experiments/k31-actor16/**', '.github/workflows/actor16-free.yml']
permissions:
  contents: read
jobs:
  free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test experiments/k31-actor16/variants.test.cjs
      - run: python3 -m unittest discover -s experiments/k31-actor16 -p 'test_*.py'
