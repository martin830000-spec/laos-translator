name: Assisted4 free synthetic preflight 20261122
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths:
      - .github/workflows/assisted4-free-preflight-20261122.yml
permissions:
  contents: read
concurrency:
  group: ko-lao-assisted4-free-preflight-r1-20261122
  cancel-in-progress: false
jobs:
  free-preflight:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline synthetic tests on identical runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/assisted4-free"
          python3 -m py_compile research/assisted4-free-20261122/preflight.py
          python3 research/assisted4-free-20261122/preflight.py > "${RUNNER_TEMP}/assisted4-free/OFFLINE_NORMAL.txt" 2>&1
          python3 -O research/assisted4-free-20261122/preflight.py > "${RUNNER_TEMP}/assisted4-free/OFFLINE_OPTIMIZED.txt" 2>&1
      - name: Authenticate existing TEST identity without new permissions
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: New-prefix synthetic GCS checks and metadata GET only
        env:
          REPORT_PATH: ${{ runner.temp }}/assisted4-free/REMOTE_REPORT.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 research/assisted4-free-20261122/preflight.py remote
      - name: Preserve non-private synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: assisted4-free-${{ github.run_id }}
          path: ${{ runner.temp }}/assisted4-free/
          if-no-files-found: error
          retention-days: 7
