name: Baseline legacy tests before Luna (offline only)
on:
  push:
    branches:
      - audit/legacy-main-pre-luna-regression-20261113
    paths:
      - .github/workflows/audit-legacy-before-luna.yml
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'martin830000-spec/laos-translator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unmodified original legacy tests with no API keys
        run: node --test tests/*.test.cjs
