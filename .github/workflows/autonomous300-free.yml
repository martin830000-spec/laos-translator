name: Autonomous300 free contracts
on:
  push:
    branches: [research/gemini-autonomous300-20261104]
    paths: ['experiments/autonomous300/**', '.github/workflows/autonomous300-free.yml']
permissions:
  contents: read
jobs:
  free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test experiments/autonomous300/variants.test.cjs
      - run: python3 -m unittest discover -s experiments/autonomous300 -p 'test_*.py'
