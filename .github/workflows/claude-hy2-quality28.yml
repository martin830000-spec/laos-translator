name: Approved Claude HY2 quality stage2 normal8 max28 encrypted TEST
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: claude-hy2-quality28-20261101-once-v1
  cancel-in-progress: false
jobs:
  approved32:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.event.issue.user.login == 'martin830000-spec' && github.event.issue.title == 'WORK_CLAUDE_HY2_QUALITY28_20261101_APPROVED_V1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 8044e681aa2a72e97b062e8cd6657463fc543a26
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Exact approval and frozen candidate check before credentials
        run: python3 -c "import runpy; d=runpy.run_path('experiments/claude-hy2-quality28/actions_bridge.py'); d['approval_guard']()"
      - name: New bounded campaign safety tests
        run: python3 -m unittest discover -s experiments/claude-hy2-quality28 -p 'test_*.py' -v
      - name: Prepare private channel
        run: python3 experiments/claude-hy2-quality28/actions_bridge.py prepare "$RUNNER_TEMP/claude-hy2-quality28"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-hy2-quality28-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-hy2-quality28/handshake.json
          retention-days: 1
      - name: Only approved conditional HY2 normal8 max28 calls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/claude-hy2-quality28/actions_bridge.py execute "$RUNNER_TEMP/claude-hy2-quality28"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: claude-hy2-quality28-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-hy2-quality28/sealed-result.json
          retention-days: 7
          if-no-files-found: warn

