name: Gemini alternative V2 offline preparation only
on:
  push:
    branches: [research/gemini-alternative-v2-20261108]
    paths: ['experiments/gemini-alternative-v2/**', '.github/workflows/gemini-alternative-v2-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node experiments/gemini-alternative-v2/test.cjs
      - run: python3 experiments/gemini-alternative-v2/test_gate.py
