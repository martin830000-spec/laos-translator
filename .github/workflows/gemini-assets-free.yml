name: GEMINI ASSETS contract checks
on:
  push:
    branches: [research/gemini-accumulated-assets-20261104]
    paths: ['experiments/gemini-assets/**', '.github/workflows/gemini-assets-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --test experiments/gemini-assets/contracts.test.cjs
      - run: python3 -m unittest discover -s experiments/gemini-assets -p 'test_*.py' -v
