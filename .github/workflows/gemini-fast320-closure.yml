name: FAST320 closure recovery (zero generation)
on:
  push:
    branches: [research/gemini-model-native500-20261107]
    paths: [experiments/gemini-fast320/recovery-request.json]
permissions:
  contents: read
  id-token: write
jobs:
  recover:
    if: github.actor == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assert paid gates closed
        run: |
          python3 - <<'PY'
          import json
          for m in ('35','36'):
              c=json.load(open('experiments/gemini-fast320/'+m+'/config.json'))
              assert c['enabled'] is False and c['max_new']==0
          PY
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4'
      - name: Read existing results and encrypt
        run: python3 experiments/gemini-fast320/recovery_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: fast320-closure-private
          path: ${{ runner.temp }}/native500-review.p7m
          retention-days: 3
          if-no-files-found: error
