name: Gemini vs Haiku four-path comparison TEST
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Offline preflight only, or 8 paid API calls'
        type: choice
        options: [dry_run, paid_8_calls]
        default: dry_run
        required: true
      approval:
        description: 'Paid only: I_APPROVE_8_COMPARE_CALLS'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: gemini-haiku-fourpath-compare
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'GEMINI_HAIKU_COMPARE_8CALLS_20261029' &&
       contains(github.event.issue.body, 'APPROVAL=I_APPROVE_8_COMPARE_CALLS') &&
       github.event.issue.user.login == 'martin830000-spec' &&
       github.run_attempt == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Offline validation
        run: |
          python3 -m py_compile experiments/gemini-haiku-compare/compare.py
          python3 experiments/gemini-haiku-compare/compare.py --dry-run
      - name: Paid comparison (explicit dispatch approval only)
        if: ${{ (github.event_name == 'issues' && github.event.issue.title == 'GEMINI_HAIKU_COMPARE_8CALLS_20261029') || (inputs.mode == 'paid_8_calls' && inputs.approval == 'I_APPROVE_8_COMPARE_CALLS') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: I_APPROVE_8_COMPARE_CALLS
          GEMINI_MODEL: gemini-3.8-flash
        run: python3 experiments/gemini-haiku-compare/compare.py
      - name: Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-haiku-compare-${{ github.run_id }}
          path: out/gemini-haiku-compare.*
          if-no-files-found: warn
          retention-days: 14
