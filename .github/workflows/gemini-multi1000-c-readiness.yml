name: Gemini multi1000 resumed closure verification (free)
on:
  push:
    branches: [research/gemini-multi1000-20261107]
    paths:
      - .github/workflows/gemini-multi1000-c-readiness.yml
      - experiments/gemini-multi1000/resume-closure.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closed-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify immutable history, closed cap, syntax and synthetic payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,hashlib,subprocess
          from pathlib import Path
          p=Path('experiments/gemini-multi1000')
          c=json.loads((p/'config.json').read_text());r=json.loads((p/'resume-closure.json').read_text());o=json.loads((p/'closure.json').read_text())
          assert c['enabled'] is False and c['max_new']==0 and c['prior_actual']==616
          assert o['actual']==172 and o['unused']==828
          assert hashlib.sha256((p/'closure.json').read_bytes()).hexdigest()==r['original_closure_sha256']
          assert r['actual']==616 and r['unused']==384 and r['new_actual']==444
          assert sum(r['phase_actual'].values())==616 and r['new_generation_enabled'] is False
          subprocess.run(['python3','-m','py_compile',str(p/'runner.py')],check=True)
          subprocess.run(['node','--check',str(p/'worker.cjs')],check=True)
          requests=[]
          for variant in ['M31_KO','M31_CDEMO','M35_R','M35_CDEMO','M36_KO','M36_SVC','M38_SVC']:
              for path in ['KF','KB','LF','LB']:
                  source='자기야, 오늘은 쉬자.' if path in ['KF','LB'] else 'ທີ່ຮັກ ມື້ນີ້ພັກຜ່ອນ.'
                  requests.append(dict(mode='build',variant=variant,path=path,input=source))
          z=subprocess.run(['node',str(p/'worker.cjs')],input='\n'.join(json.dumps(x,ensure_ascii=False) for x in requests)+'\n',text=True,capture_output=True,check=True)
          a=[json.loads(s) for s in z.stdout.splitlines() if s.strip()];assert len(a)==28
          for req,out in zip(requests,a):
              assert out['ok'] is True
              assert out['value']['payload']['contents'][0]['parts'][0]['text']==req['input']
          Path('closure-verification.json').write_text(json.dumps({'actual':616,'unused':384,'old_closure_preserved':True,'payload_checks':28,'paid_calls':0,'passed':True}))
          print('CLOSURE_PASS: 616/1000; 384 unused; paid generation disabled; 28 offline payload checks; old closure preserved.')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: multi1000-resume-closure-verification
          path: closure-verification.json
