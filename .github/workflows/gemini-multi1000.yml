name: Gemini multi1000 closed free verification
on:
  push:
    branches: [research/gemini-multi1000-20261107]
    paths: [experiments/gemini-multi1000/activation.json]
permissions:
  contents: read
jobs:
  closed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check closed authorization only
        run: |
          python3 - <<'CHECK'
          import json,pathlib
          p=pathlib.Path('experiments/gemini-multi1000')
          c=json.loads((p/'config.json').read_text());s=json.loads((p/'closure.json').read_text())
          assert not c['enabled'] and c['max_new']==0 and c['prior_actual']==172
          assert s['actual']==172 and s['unused']==828 and not s['new_generation_enabled']
          print('CLOSED 172/1000; new generation0')
          CHECK
