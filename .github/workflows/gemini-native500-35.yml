name: Gemini 35 private-GCS native500 research (no Issue handshake)
on:
  push:
    branches:
      - research/gemini-model-native500-20261107
    paths:
      - experiments/gemini35-native500/activation-gcs.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: native500-gcs-35
  cancel-in-progress: false
jobs:
  protected:
    if: github.actor == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate immutable model-specific request cap and plan
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path('experiments/gemini35-native500')
          c = json.loads((p/'config.json').read_text())
          a = json.loads((p/'activation-gcs.json').read_text())
          assert c['enabled'] is True
          assert c['model'] == 'gemini-3.5-flash-lite' and a['model'] == 'gemini-3.5-flash-lite'
          assert c['campaign'] == 'GEMINI35_MODEL_NATIVE_OPT500_20261107'
          assert type(c['prior_actual']) is int and type(c['max_new']) is int
          assert 0 <= c['prior_actual'] < 500
          assert 0 < c['max_new'] <= 500-c['prior_actual']
          assert c['plan_sha256'] == a['plan_sha256']
          assert c['run_nonce'] == a['run_nonce']
          assert c['deadline_epoch'] > time.time()
          assert not (p/'activation.json').exists()
          print('GCS research gate accepted; no generation yet')
          PY
      - name: Check configured research-only WIF principal
        env:
          PROVIDER: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          SERVICE_ACCOUNT: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
        shell: bash
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT"
          echo 'Dedicated research principal configured; public Issue handshake disabled'
      - name: Authenticate with research-only WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up Python dependencies
        run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4'
      - name: Execute private-GCS plan once
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini-native500-gcs/runner.py execute 35

      - name: Export encrypted private analysis copy
        if: always()
        run: python3 experiments/gemini-native500-gcs/review_export.py 35
      - name: Upload ciphertext only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native500-private-review-35
          path: ${{ runner.temp }}/native500-review.p7m
          retention-days: 1
          if-no-files-found: error
