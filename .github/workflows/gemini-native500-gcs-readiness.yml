name: DEEP500 existing-WIF read-only recovery
on:
  push:
    branches: [research/gemini-model-native500-20261107]
    paths: [.github/workflows/gemini-native500-gcs-readiness.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: gpt-luna-couple-tone-name-ab160-20261113
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.actor == 'martin830000-spec' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4' 'httpx==0.28.1'
      - name: Verify offline safety guards
        run: python3 -m unittest discover -s experiments/gpt-luna-couple-tone-name-ab160 -p test_guards.py
      - name: COUPLE_TONE_NAME_AB160 F STAGE
        run: python3 experiments/gpt-luna-couple-tone-name-ab160/runner.py STAGE
      - name: COUPLE_TONE_NAME_AB160 F EXECUTE
        run: python3 experiments/gpt-luna-couple-tone-name-ab160/runner.py EXECUTE
        env:
          OPENAI_API_KEY: ${{ secrets.GPT_API_KEY }}
      - name: Export encrypted private evidence
        if: always()
        run: python3 experiments/gpt-luna-couple-tone-name-ab160/runner.py EXPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couple-tone-name-ab160-F-encrypted
          path: ${{ runner.temp }}/couple-tone-name-ab160-export.p7m
          retention-days: 3
          if-no-files-found: error
