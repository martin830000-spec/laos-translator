name: GPT SCREEN160 free blocked closure
on:
  push:
    branches: [research/gemini-model-native500-20261107]
    paths: [experiments/gpt-luna-terra-screen160/closure-trigger.json]
permissions:
  contents: read
  id-token: write
concurrency:
  group: native500-gcs-35
  cancel-in-progress: false
jobs:
  readiness:
    if: github.actor == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4'
      - name: Persist and read back zero-call locked state
        run: python3 experiments/gpt-luna-terra-screen160/close_remote.py
      - uses: actions/upload-artifact@v4
        with:
          name: screen160-free-closure
          path: |
            ${{ runner.temp }}/screen160-closure.json
            ${{ runner.temp }}/screen160-synthetic.json
          retention-days: 3
