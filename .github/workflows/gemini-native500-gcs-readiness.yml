name: Gemini native500 dedicated WIF GCS readiness (no generation)
on:
  push:
    branches:
      - research/gemini-model-native500-20261107
    paths:
      - .github/workflows/gemini-native500-gcs-readiness.yml
permissions:
  contents: read
  id-token: write
jobs:
  wif-research-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate dedicated identity configuration
        env:
          PROVIDER: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          SERVICE_ACCOUNT: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
        run: |
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
          echo 'Dedicated research WIF configured; no translation API call'
      - name: Authenticate to GCP with dedicated research WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Install GCS client
        run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4'
      - name: Verify private bucket policies and non-sensitive marker write
        shell: bash
        run: |
          python3 - <<'PY'
          from google.cloud import storage
          import os
          client=storage.Client(project='gen-lang-client-0422436907')
          b=client.bucket('lao-translator-src-460077888071')
          # Bucket security settings were verified separately by the owner.
          # This identity is intentionally limited to objects under the research prefix.
          # Only non-sensitive readiness marker; never load private translation samples.
          key='research/gemini-model-native500-20261107/preflight/'+os.environ['GITHUB_RUN_ID']+'.json'
          blob=b.blob(key)
          blob.upload_from_string('{"preflight":"PASS","paid_calls":0}',
                                  content_type='application/json',
                                  if_generation_match=0,timeout=30)
          assert blob.reload() is None
          print('RESEARCH_WIF_GCS_READ_WRITE_READY; NO_API; NO_PRIVATE_CONVERSATION')
          PY

      - name: Stage frozen private research plans without generation
        run: python3 experiments/gemini-native500-gcs/stage_plan.py
# Stage revision: LAO_PRIMER_R2
