name: Gemini native500 WIF GCS readiness (no generation)
on:
  push:
    branches:
      - research/gemini-model-native500-20261107
    paths:
      - .github/workflows/gemini-native500-gcs-readiness.yml
permissions:
  contents: read
  id-token: write
jobs:
  wif-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticate with existing GitHub OIDC WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/github-actions
          service_account: lao-github-deployer@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: gen-lang-client-0422436907
      - name: Verify WIF research-branch access to known public-code release object
        shell: bash
        run: |
          set -euo pipefail
          # This is only a pre-existing engine ZIP, never any private conversation.
          # Check exact object get permissions. Do not enumerate the bucket or print data.
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          gcloud storage cp 'gs://lao-translator-src-460077888071/releases/translator_cloudrun_engine_audit_deploy_20261106.zip' "$scratch/readiness.zip" --quiet
          test -s "$scratch/readiness.zip"
          printf '%s\n' 'WIF_GCS_READ_OK; NO_GENERATION; NO_PRIVATE_SOURCE'
