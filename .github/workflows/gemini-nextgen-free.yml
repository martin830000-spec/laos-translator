name: Gemini NEXTGEN 20261103 FREE offline contracts
on:
  push:
    branches: [research/gemini-nextgen-20261103]
    paths:
      - 'experiments/gemini-nextgen/**'
      - '.github/workflows/gemini-nextgen-free.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify 16 synthetic offline contracts - no API key
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 experiments/gemini-nextgen/test_contracts.py