name: Approved Gemini NEXTGEN REAL128 private phase - no retries
on:
  push:
    branches: [research/gemini-nextgen-real128-20261103]
    paths: ['experiments/gemini-real128/NEVER_TRIGGER_WITHOUT_NEW_CAMPAIGN_AND_APPROVAL']
permissions:
  contents: write
  issues: read
concurrency:
  group: gemini-nextgen-real128-20261103-one-at-a-time
  cancel-in-progress: false
jobs:
  bounded:
    if: github.repository == 'martin830000-spec/laos-translator' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Secure private REAL128 one-time handshake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/gemini-real128/actions_bridge.py prepare "$RUNNER_TEMP/real128"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real128-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/real128/handshake.json
          retention-days: 1
      - name: Attempt-bounded, sealed-plan Gemini calls only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini-real128/actions_bridge.py execute "$RUNNER_TEMP/real128"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real128-sealed-result-${{ github.run_id }}
          path: ${{ runner.temp }}/real128/sealed-result.json
          retention-days: 7
          if-no-files-found: warn