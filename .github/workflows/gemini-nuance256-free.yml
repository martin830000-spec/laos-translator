name: Gemini NUANCE256 offline contract checks
on:
  push:
    branches: [research/gemini-nuance256-20261103]
    paths:
      - 'experiments/gemini-nuance256/**'
      - '.github/workflows/gemini-nuance256-free.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'martin830000-spec/laos-translator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline synthetic contract tests - no API key
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 experiments/gemini-nuance256/test_contracts.py
