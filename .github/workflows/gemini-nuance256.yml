name: Approved Gemini NUANCE256 private phase - no retries
on:
  push:
    branches: [research/gemini-nuance256-20261103]
    paths: ['experiments/gemini-nuance256/config.json']
permissions:
  contents: write
  issues: read
concurrency:
  group: gemini-nuance256-20261103-once
  cancel-in-progress: false
jobs:
  bounded:
    if: github.repository == 'martin830000-spec/laos-translator' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Secure private NUANCE256 phase handshake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/gemini-nuance256/actions_bridge.py prepare "$RUNNER_TEMP/nuance256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuance256-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/nuance256/handshake.json
          retention-days: 1
      - name: Attempt-bounded, sealed-plan Gemini calls only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini-nuance256/actions_bridge.py execute "$RUNNER_TEMP/nuance256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nuance256-sealed-result-${{ github.run_id }}
          path: ${{ runner.temp }}/nuance256/sealed-result.json
          retention-days: 7
          if-no-files-found: warn
