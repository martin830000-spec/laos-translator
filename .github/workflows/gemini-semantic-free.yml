name: Gemini semantic contracts - zero generation
on:
  push:
    branches: [research/gemini-semantic-first-back-20261103]
    paths: ['experiments/gemini-semantic/**', '.github/workflows/gemini-semantic-free.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline contracts without API credentials
        run: node --test experiments/gemini-semantic/contracts.test.cjs
