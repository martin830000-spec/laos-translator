name: Gemini 35 independent protected research
on:
  push:
    branches: [research/gemini-single35-36-20261107]
    paths: [experiments/gemini35-solo500/activation.json]
permissions:
  contents: write
  issues: read
concurrency:
  group: gemini35-solo500-20261107
  cancel-in-progress: false
jobs:
  protected:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check independent campaign and one-shot cap
        run: |
          python3 - <<'PYCODE'
          import json,time
          from pathlib import Path
          p=Path('experiments/gemini35-solo500');c=json.loads((p/'config.json').read_text());a=json.loads((p/'activation.json').read_text())
          assert c['enabled'] is True and 0<c['max_new']<=200 and 0<=c['prior_actual']<500 and c['prior_actual']+c['max_new']<=500
          assert c['model']=='gemini-3.5-flash-lite'
          assert c['campaign']=='GEMINI35L_AUTONOMOUS500_20261107'
          assert c['phase']==a['phase'] and c['plan_sha256']==a['digest'] and c['deadline_epoch']>time.time()
          print('Independent500 cap and fresh bound plan verified; no generation yet.')
          PYCODE
      - run: python3 -m pip install --quiet cryptography==46.0.3
      - name: Prepare sealed input handshake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 experiments/gemini35-solo500/runner.py prepare /tmp/gemini35-solo500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solo35-handshake
          path: /tmp/gemini35-solo500/handshake.json
      - name: Generate once from encrypted approved plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini35-solo500/runner.py execute /tmp/gemini35-solo500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solo35-encrypted-result
          path: /tmp/gemini35-solo500/sealed-result.json
