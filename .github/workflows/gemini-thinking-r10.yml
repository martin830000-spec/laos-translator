name: Gemini native LOW vs MINIMAL bounded wider cap
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: thinking-r10-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gemini:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.run_attempt == 1 && github.event.issue.title == 'THINKING_R10_20261030' && github.event.issue.user.login == 'martin830000-spec' && fromJSON(github.event.issue.body).engine == 'gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline guards no credentials
        run: |
          node --test experiments/four-engine-research/audit.test.mjs experiments/four-engine-research/lara.test.mjs experiments/four-engine-research/lara-style2.test.mjs experiments/four-engine-research/gemini-format.test.mjs experiments/four-engine-research/continue-r7.test.mjs experiments/four-engine-research/continue-r8.test.mjs experiments/four-engine-research/continue-r9.test.mjs experiments/four-engine-research/gemini-thinking-r10.test.mjs
          node experiments/four-engine-research/gemini-thinking-r10.mjs preflight gemini
      - name: Permanent engine-specific one-shot lock
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({...context.repo, ref:'refs/tags/thinking-r10-gemini-20261030-consumed', sha:context.sha});
      - name: Bounded direct call no retries
        env:
          RESEARCH_ENGINE: gemini
          RESEARCH_LOCK: thinking-r10-gemini-20261030
          RESULT_PUBLIC_KEY_BASE64: ${{ fromJSON(github.event.issue.body).result_public_key_base64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/four-engine-research/gemini-thinking-r10.mjs execute
      - name: Encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thinking-r10-gemini-encrypted-${{ github.run_id }}
          path: out/thinking-r10-gemini/sealed.json
          if-no-files-found: warn
          retention-days: 7
