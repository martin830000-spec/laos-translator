name: BACK100 bounded encrypted stored FIRST research
on:
  push:
    branches: [research/gemini31-back-real100-20261104]
    paths: ['__NEVER_TRIGGER_BACK100_LOCKED__']
permissions:
  contents: write
  issues: read
concurrency:
  group: gemini31-back-real100-20261104
  cancel-in-progress: false
jobs:
  bounded:
    if: github.repository == 'martin830000-spec/laos-translator' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Free frozen contracts before any generation
        run: python3 experiments/gemini31-back-real100/free_checks.py
      - name: Public one time handshake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/gemini31-back-real100/paid_bridge.py prepare "$RUNNER_TEMP/back100"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: back100-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/back100/handshake.json
          retention-days: 1
      - name: Approved BACK only one send per attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini31-back-real100/paid_bridge.py execute "$RUNNER_TEMP/back100"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: back100-result-${{ github.run_id }}
          path: ${{ runner.temp }}/back100/sealed-result.json
          retention-days: 7
          if-no-files-found: warn
