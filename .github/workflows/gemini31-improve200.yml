name: Gemini31 IMPROVE200 closed free verification
on:
  push:
    branches: [research/gemini31-improve200-20261106]
    paths: ['experiments/gemini31-improve200/activation.json']
permissions:
  contents: read
jobs:
  free-final:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Approval closed and frozen code intact
        run: |
          python3 - <<'CHECK'
          import json,hashlib,pathlib
          p=pathlib.Path('experiments/gemini31-improve200')
          a=json.loads((p/'approval.json').read_text());assert not a['authorized'] and not a['execution_enabled'] and a['max_new']==0 and a['actual_attempts']<=200
          for f,h in json.loads((p/'frozen-files.json').read_text()).items():assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==h,f
          CHECK
      - name: Free tests only
        run: |
          python3 -m unittest discover -s experiments/gemini31-improve200 -p test_controller.py
          node --test experiments/gemini31-improve200/contracts.test.cjs
