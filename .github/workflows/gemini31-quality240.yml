name: Approved Gemini fourpath tone bounded240
on:
  push:
    branches: [research/gemini31-quality240-20261105]
    paths: ['experiments/gemini31-quality240/activation.json']
permissions:
  contents: write
  issues: read
concurrency:
  group: gemini31-quality240-20261105
  cancel-in-progress: false
jobs:
  bounded:
    if: github.repository == 'martin830000-spec/laos-translator' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Free bounded controller and inherited candidate tests
        run: |
          python3 -m unittest discover -s experiments/gemini31-quality240 -p test_controller.py
          node --test experiments/gemini31-quality240/contracts.test.cjs
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Public one-use handshake
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/gemini31-quality240/bridge.py prepare "$RUNNER_TEMP/quality240"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality240-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/quality240/handshake.json
          retention-days: 1
      - name: Approved phase encrypted execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 experiments/gemini31-quality240/bridge.py execute "$RUNNER_TEMP/quality240"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality240-result-${{ github.run_id }}
          path: ${{ runner.temp }}/quality240/sealed-result.json
          retention-days: 7
          if-no-files-found: warn
