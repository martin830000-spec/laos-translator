name: Gemini31 QUALITY300 closed free verification
on:
  push:
    branches: [research/gemini31-quality300-20261105]
    paths: ['experiments/gemini31-quality300/activation.json']
permissions:
  contents: read
jobs:
  free-final:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Approval closed and frozen code intact
        run: |
          python3 - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          c=Path('experiments/gemini31-quality300')
          a=json.loads((c/'approval.json').read_text())
          assert a['authorized'] is False and a['execution_enabled'] is False and a['max_new']==0
          assert a['actual_attempts']<=300 and sum(a['actual_by_path'].values())==a['actual_attempts']
          for p,h in json.loads((c/'frozen-files.json').read_text()).items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          print('LOCKED max_new=0; frozen files verified; no generation step')
          PYCODE
      - name: Free regression tests only
        run: |
          python3 -m unittest discover -s experiments/gemini31-quality300 -p test_controller.py
          node --test experiments/gemini31-quality300/contracts.test.cjs
