name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  dd2-freeqa:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      DD2_STAGE: "FREEQA"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      DD2_RUNNER_SHA256: "96eb52d6d2be776d1810609fae2548bbb16a7d1721f5be659e546c2c188564a5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check exact SHA 10 public/CMS files and R4/SSE/Developer runner in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo '0341cd0200c6ae284e7ed185b84eade63e5bd906891c96a197d72cbe3b49f8e2  .github/dd2_bootstrap.py' | sha256sum -c -
          echo 'a0ddc9924ccf7628fb609410726071a8106dccc4e488840ff47f4cb7d8cc5af7  .github/dd2_pins29.json' | sha256sum -c -
          echo '96eb52d6d2be776d1810609fae2548bbb16a7d1721f5be659e546c2c188564a5  .github/dd2_runner.py' | sha256sum -c -
          echo '602a58e4d3fa31e42a5ab0828ff66afff089ad91c01b2607a1b5af272347b247  .github/dd2_sse.py' | sha256sum -c -
          echo '1963cb172cb195f7edf2709021909e09eb221e528f8a0fbf7d91b2a34eac782f  .github/legacy_gcs.py' | sha256sum -c -
          echo '1772c2fd3704c184470359c39832ec47cabe13528f7860a414b25d7405901792  .github/dd2_public_freeze.json' | sha256sum -c -
          echo '84ac426be531d45805f45ea6e546ac965cd84800f22911a14f142048ac7ee183  .github/dd2_input.cms.b64' | sha256sum -c -
          echo 'fe79b931f57d4ef74dc489969b7b8844f92ccd06eab1e4b2abd848491e7bddb3  .github/dd2_input_public.crt' | sha256sum -c -
          echo 'c01ebb86c5f2a6438ec7d7f0fdc98588019d18162b3de3867ff54bf937cbc567  .github/dd2_owner_output_public.crt' | sha256sum -c -
          echo 'c6a078ac9b90362ef322b0732c2b492582cf0388d9aa1be690cb7874f6cd2c0d  .github/dd2_bootstrap_public.json' | sha256sum -c -
          python3 -m py_compile .github/dd2_runner.py .github/dd2_sse.py .github/legacy_gcs.py
          python3 .github/legacy_gcs.py test
          python3 -O .github/legacy_gcs.py test
          python3 .github/dd2_sse.py
          python3 -O .github/dd2_sse.py
          python3 .github/dd2_runner.py TEST
          python3 -O .github/dd2_runner.py TEST
      - name: FREEQA 29 protected closed locks, decrypt exact frozen D source/prompts and new GCS synthetic FIRST/BACK — zero Developer generation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 .github/dd2_runner.py FREEQA | tee "$RUNNER_TEMP/dd2_freeqa_public.log"
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: dd2-freeqa-${{ github.run_id }}
          path: ${{ runner.temp }}/dd2_freeqa_public.log
          retention-days: 7
          if-no-files-found: error
