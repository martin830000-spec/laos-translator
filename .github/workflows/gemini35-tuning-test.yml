name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  r4chain-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      R4CHAIN_MODE: "FINALIZE"
      R4CHAIN_STAGE: "FINALIZE"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "9d13b162568b2806472c31bd2a6b557d7b528de3fbb849f7977be8b2b53f8529"
      OWNER_REVIEW_SHA256: "1db329514bde343f4c6e665e727c6cb904d7a2504c00ea3d5590047effc2d7f9"
      OWNER_REVIEW_EXPECTED_SHA256: "1db329514bde343f4c6e665e727c6cb904d7a2504c00ea3d5590047effc2d7f9"
      COMMON_SCRIPT_SHA256: "010ead3fadd68621f251036a618c05998f195d2f5721d1f42c5241702e4cc6b9"
      ENTRY_SCRIPT_SHA256: "1db329514bde343f4c6e665e727c6cb904d7a2504c00ea3d5590047effc2d7f9"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "1c6743bb3279f830e92159f542eecd3fc98e7c981fd7507c6212b2d985375118"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded R4CHAIN FINALIZE
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'R4CHAIN_FILES'
          import os,base64,hashlib
          from pathlib import Path
          files={'ab_input_verify.py': '', 'transport_crypto.mjs': '', 'ab_finalize.py': '', 'ab_run.py': '', 'technical_guard_v2.py': '', 'ab_common.py': '', 'chain_gate.py': '', 'r4_fixture_test.py': '', 'ab_recover.py': '', 'test_offline_v2.py': '', 'anchor_extractors.py': '', 'ab_bootstrap.py': '', 'ab_previous.py': '', 'output_public.pem': '', 'final_config.json': ''}
          hashes={'ab_input_verify.py': '3922ba0e0e853ef98372c8206da35d473a8d3c80f5ff77d69ee3cc604edec926', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'ab_finalize.py': '1db329514bde343f4c6e665e727c6cb904d7a2504c00ea3d5590047effc2d7f9', 'ab_run.py': '2498b2dbf75bbe7a170e1f00e23d2b1bb93a99ed696550fe51d2464e11c926a5', 'technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'ab_common.py': '010ead3fadd68621f251036a618c05998f195d2f5721d1f42c5241702e4cc6b9', 'chain_gate.py': '0bbafa67211bceacea697d670394fc27417277257a0294231b47463c793f9647', 'r4_fixture_test.py': 'f142c9ee3f57f042d6627ac8cddc5cdecb160fcc2853225944ec7a4b471b186b', 'ab_recover.py': '82678e11aedafcbcd4f11da887b393336694d53816ec281d7862e9db79c978c7', 'test_offline_v2.py': '0a8eafc3914d5f713f71679267752ffdeea6650aab88244c93b17fd9cb05d2e4', 'anchor_extractors.py': '1d243e3d083a8a8979fc29c053243481894de138d04527e6a05eb66852888e1c', 'ab_bootstrap.py': '55a96ba8a76ae7531baf3a5883ee7a4334b0c38fbbab2b616b5164abd175d1c7', 'ab_previous.py': '9d631f19cf2fdd8133609185e57cd7f44791c705483a309e15059ea4ac19bb55', 'output_public.pem': '1c6743bb3279f830e92159f542eecd3fc98e7c981fd7507c6212b2d985375118', 'final_config.json': '2e4937f1beee2517199876dd5053c87a93d2d330f62f602b4e9c482bc27b926c'}
          for n,v in files.items():
           b=base64.b64decode(v,validate=True); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          R4CHAIN_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/ab_finalize.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: r4chain-finalize-${{ github.run_id }}
          path: ${{ runner.temp }}/r4chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
