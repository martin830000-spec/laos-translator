name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  h64-screen64-pilot:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      H64_STAGE: "PILOT"
      ENABLE_GENERATION: "true"
      ENABLE_TUNING: "false"
      H64_INPUT_CIPHER_SHA: "85a4cabd2e746e8d37b5caab988e0f669b86d774586712ab6846e5b0d61d89b3"
      H64_RUNNER_SHA256: "604474a1add46f28fd51f0278567a7cf7758c5e0d557be62a031c7d716edc815"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Freeze SHA, clean R4 30 and SCREEN64 30 regressions
        shell: bash
        run: |
          set -euo pipefail
          echo '604474a1add46f28fd51f0278567a7cf7758c5e0d557be62a031c7d716edc815  .github/h64_paid_runner.py' | sha256sum -c -
          echo '1963cb172cb195f7edf2709021909e09eb221e528f8a0fbf7d91b2a34eac782f  .github/r5_r4_base.py' | sha256sum -c -
          echo 'ea379b9559ad2578c4ba8a046fcb7bded06bf769ee92474d26ac1bcb51004ed4  .github/pins26.json' | sha256sum -c -
          echo '8b3d44a9632c9a66f405d430ff3868cd7f395cec1bf80ddea11f86f3b593f889  .github/public_freeze_metadata.json' | sha256sum -c -
          echo '6a4e3a90f466cc795fdf8ed473649bb9f2454bc2f9b6b0d263221f87d4e3ecaf  .github/h64_input_recipient.crt' | sha256sum -c -
          echo 'a49b00e33d3e26ef02ac638f6b45125a0b38cbcecec68384556f7f5847f1f6c0  .github/h64_output_reader_public.crt' | sha256sum -c -
          echo 'a66d4ff489d9e3499014d9fd35d23abca9a73fd0be264d42a5ff3d486bd54cd8  .github/h64_private_inputs.cms.b64' | sha256sum -c -
          python3 -m py_compile .github/r5_r4_base.py .github/h64_paid_runner.py
          python3 .github/r5_r4_base.py test
          python3 -O .github/r5_r4_base.py test
          python3 .github/h64_paid_runner.py TEST
          python3 -O .github/h64_paid_runner.py TEST
      - name: PILOT approved 16 calls K1 L1 four-arm FIRST/BACK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export H64_OUTPUT_CMS="$RUNNER_TEMP/h64_pilot_output.p7m"
          python3 .github/h64_paid_runner.py PILOT
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: hydrogen64-pilot-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/h64_pilot_output.p7m
          retention-days: 7
          if-no-files-found: warn
