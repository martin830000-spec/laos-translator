name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  realdb84-resume:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      DB84_MODE: "SUBMIT_ONCE"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "true"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "b093519e11cc3737fca1c445b02d992e445b3e31ecd457fd5b116c637a54e817"
      RESUME_WORKORDER_SHA256: "65de4ff88752fad622da16f8a5f194004a4b6f3a241276530c43f60fff642e48"
      INPUT_KEY_PUBLIC_SHA256: "058f6443ec42cd3482f72997ca79938f848b9a8e1d62309c940cab55bd16f4a1"
      SUBMITTER_SCRIPT_SHA256: "775a35459cd6ad62f7474da9166873048724b770a6eb77e7905bcdf038db1d7a"
      SUBMIT_WRAPPER_SHA256: "feff82150fd9d1bafb99f1fb83de9ec65049058616e6ebe9ef24bf2f15d921a1"
      PREFLIGHT_SCRIPT_SHA256: "37c8cb969b45fa5c3569f98547de306348b4c5f3de390c0ac9a2989910e6a089"
      TRANSPORT_COMMON_SHA256: "2bc5ca8e8306a0977c17cdcb9d3f6d8fe7f0b5f5363dc57de37f1e076c7181e8"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "4176de932d755df19931c3b533a8acc7200aec9ed7358460af1bf412af6fa51e"
      INPUT_ENVELOPE_SHA256: "28447d45dc73051356f7620cbdf5a742b44de382fc3afece6cc9f7eeb9a229ed"
      EXPECTED_INPUT_HEADER_SHA256: "426bbff62e3c950cec565b8254c7746057fbaca38cbc16e54c360c7ca7e98add"
      KNOWN_OBJECTS_PUBLIC_PATH_SHA256: "41b9010cde3cf07c8205bb7269ca72c4fb538b96d6c686530207175d1f1d0645"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run reviewed DB84 SUBMIT_ONCE
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'DB84_FILES'
          import base64,hashlib,os
          from pathlib import Path
          files = {'realdb84_submit_once.py': '', 'realdb84_submit_main.py': '', 'realdb84_preflight.py': '', 'resume_transport_common.py': '', 'transport_crypto.mjs': '', 'output_public.pem': '', 'submission.envelope.json': '', 'submission_header.json': '', 'known_objects.json': ''}
          hashes = {'realdb84_submit_once.py': '775a35459cd6ad62f7474da9166873048724b770a6eb77e7905bcdf038db1d7a', 'realdb84_submit_main.py': 'feff82150fd9d1bafb99f1fb83de9ec65049058616e6ebe9ef24bf2f15d921a1', 'realdb84_preflight.py': '37c8cb969b45fa5c3569f98547de306348b4c5f3de390c0ac9a2989910e6a089', 'resume_transport_common.py': '2bc5ca8e8306a0977c17cdcb9d3f6d8fe7f0b5f5363dc57de37f1e076c7181e8', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'output_public.pem': '4176de932d755df19931c3b533a8acc7200aec9ed7358460af1bf412af6fa51e', 'submission.envelope.json': '28447d45dc73051356f7620cbdf5a742b44de382fc3afece6cc9f7eeb9a229ed', 'submission_header.json': '426bbff62e3c950cec565b8254c7746057fbaca38cbc16e54c360c7ca7e98add', 'known_objects.json': '41b9010cde3cf07c8205bb7269ca72c4fb538b96d6c686530207175d1f1d0645'}
          for name,value in files.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==hashes[name]
              p=Path(os.environ['RUNNER_TEMP'])/name
              with p.open('xb') as f:
                  f.write(raw)
                  f.flush()
                  os.fsync(f.fileno())
              p.chmod(0o600)
          DB84_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export INPUT_ENVELOPE="$RUNNER_TEMP/submission.envelope.json"
          export EXPECTED_INPUT_HEADER="$RUNNER_TEMP/submission_header.json"
          export KNOWN_OBJECTS_PUBLIC_PATH="$RUNNER_TEMP/known_objects.json"
          python3 "$RUNNER_TEMP/realdb84_submit_main.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: realdb84-resume-submit_once-${{ github.run_id }}
          path: ${{ runner.temp }}/realdb84_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
