name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  freeqa-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      FREEQA_STAGE: "BOOTSTRAP"
      R4CHAIN_MODE: "BOOTSTRAP"
      R4CHAIN_STAGE: "BOOTSTRAP"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "fe5f2d4acc2ae9c3ba164168fcea96f9e5b3bb3df3eeee152d77376f54c0d596"
      OWNER_REVIEW_SHA256: "0fa71cb3d612fe29952cca3809f914f58718a12be0457b9ebb0c7c8156a0ba22"
      OWNER_REVIEW_EXPECTED_SHA256: "0fa71cb3d612fe29952cca3809f914f58718a12be0457b9ebb0c7c8156a0ba22"
      COMMON_SCRIPT_SHA256: "657d166146e86f8b9d6cf7b847084404b7ba4735966b92ebf0a99af77a8aee9e"
      ENTRY_SCRIPT_SHA256: "0fa71cb3d612fe29952cca3809f914f58718a12be0457b9ebb0c7c8156a0ba22"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "fcdd14e09ec6499eca105a6557b0e8dc3a941bc12b2846fbeeede1ddc939dbc0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded FREEQA BOOTSTRAP
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'FREEQA_FILES'
          import os,base64,hashlib
          from pathlib import Path
          files={'scripts/freeqa_offline.py': '', 'scripts/freeqa_remote.py': '', 'scripts/ab_previous.py': '', 'scripts/anchor_extractors.py': '', 'scripts/ab_input_verify.py': '', 'scripts/r4_fixture_test.py': '', 'scripts/ab_run.py': '', 'scripts/ab_common.py': '', 'scripts/chain_gate.py': '', 'scripts/technical_guard_v2.py': '', 'scripts/test_offline_v2.py': '', 'scripts/transport_crypto.mjs': '', 'tests/test_freeqa_boundary.py': '', 'tests/test_step1_repair.py': '', 'output_public.pem': ''}
          hashes={'scripts/freeqa_offline.py': '0f9fad92a45a1ed0f998206421cbea50456c82863af8da4cd1b983950fbcdbb9', 'scripts/freeqa_remote.py': '0fa71cb3d612fe29952cca3809f914f58718a12be0457b9ebb0c7c8156a0ba22', 'scripts/ab_previous.py': '44c12c39f9b64bc72a59e17fccf6c75957e4f7ac6ae60e80c296c30d24d9ecbf', 'scripts/anchor_extractors.py': '1d243e3d083a8a8979fc29c053243481894de138d04527e6a05eb66852888e1c', 'scripts/ab_input_verify.py': 'e6933a26bfb6d64e85f94e170e5bf4f91c867019cc029a25284c98d3993ab83b', 'scripts/r4_fixture_test.py': 'f50ff50a031358deb18ccef50463798581db28feca90ffd70a73329f48e69ac4', 'scripts/ab_run.py': '72757984fdf664c06a2bc24e0899acb147b9db19acf8fad3956d847f6f4e3430', 'scripts/ab_common.py': '657d166146e86f8b9d6cf7b847084404b7ba4735966b92ebf0a99af77a8aee9e', 'scripts/chain_gate.py': '0bbafa67211bceacea697d670394fc27417277257a0294231b47463c793f9647', 'scripts/technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'scripts/test_offline_v2.py': '0a8eafc3914d5f713f71679267752ffdeea6650aab88244c93b17fd9cb05d2e4', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'tests/test_freeqa_boundary.py': '3f174f7db00f5eb15e1dbea2692d15d0e4fae705626001e00488a827e5a9ef4a', 'tests/test_step1_repair.py': '0d97f734ac432931263f2c5ce917efbb7620ecd0f4b00a2edf6f958f98b9e3bd', 'output_public.pem': 'fcdd14e09ec6499eca105a6557b0e8dc3a941bc12b2846fbeeede1ddc939dbc0'}
          for n,v in files.items():
           b=base64.b64decode(v,validate=True); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          FREEQA_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/scripts/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/scripts/freeqa_remote.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: freeqa-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/r4chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
