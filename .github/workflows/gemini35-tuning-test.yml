name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "DRY_RUN"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      REMOTE_GATE_SHA256: "db5c044a28987e48d4a08405e3b09a7913790842d50ce8cbd710a54c75aaed0c"
      RESUME_AUTHORITY_SHA256: "cfb9ff00625be3afadf39987958ef0bc48afff1c88b28c31e95c6b070dc41ecc"
      LOCAL_GATES_SHA256: "23ff5735f0d1c06c6c425fb4b26fcb68ebd4c2a2f7bc219f8d640d0e1abfcd0e"
      FREE_VALIDATION_SHA256: "46ab4cd8307b465ee314a319732aa5f9da6ee9712c3329ebbc676bb7fd13c43d"
      SCANNER_GATE_SHA256: "b362b4872c85fa2ff85ff74994458968dcb8c451089bd0bcf34c28c313d240a5"
      SOURCE_BACKUP_SHA256: "7308a563b4ede13017f183de4cfbb1253d0d0442ead3d452fe3ed1c2b5af2cb9"
      EXPECTED_REQUEST_SHA256: "dd8da043f8888ab85c03c4f9058d7bdaaba7fafc7380e175bd8dda894d129d3a"
      DRIVER_SHA256: "c992b5b09ecdbc1f5b81871414a8abdd20862ff426ae72991c12911e10843dd3"
      CORE_SHA256: "22f23493322b5ff6ce303532516549182cfeef4d3d5ff1ec96fd602f3f5d1a1c"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "6055dcde48b5be1968dbcc3270cc5054e403ee4eb4a23c29a7f6cc551a5d4b3a"
      EXPECTED_INPUT_PUBLIC_KEY_SHA256: "df1a50e47ceaf181fbe6968d9ea28d2a48638dce1793f4b76351d82158ed8ebb"
      EXPECTED_RESUME_SHA256: "c4f1b3f36219e6070cabe50dda670e9c8b10595d85f359476d8c4877179cffca"
      EXPECTED_TRANSFER_CLAIM_SHA256: "8d120acdb2fb38587168445f47dc74916c549e4b43bab0e5c5f1bad455f11aa6"
      EXPECTED_TRANSFER_READY_SHA256: "2ac272397bc30c6e4f3c80956b0d250a250f49deba2d2523df3ec9000e128858"
      INPUT_BUNDLE_SHA256: "fd00239d31365e1028f27f04c05695685455410a582ad15a8c44c397ef949844"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/v2_training_runner.py" <<'V2_REVIEWED_FILE_0_END'
          """Importable V2 one-attempt SFT core. No inference, retry, or public output.
          
          Derived from PILOT1 runner SHA256
          ddd8d4d26922de106198398ba6b9b6fc72d8cf0e60e9b860f21d053fcdea4b84.
          The separate driver owns authentication, private transport and final export.
          """
          import base64
          import datetime
          import hashlib
          import json
          import math
          from pathlib import Path
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          CAMPAIGN = "GEMINI35_SFT_V2_PILOT1_20261116"
          PROJECT = "gen-lang-client-0422436907"
          PROJECT_NUMBER = "460077888071"
          BUCKET = "ko-lao-gemini35-tuning-460077888071"
          PREFIX = "sft_v2_pilot1_20261116/"
          BOOT = PREFIX + "_recovery/20261116/"
          CONTROL = PREFIX + "_control/CREATE_ONCE.json"
          ATTEMPT = PREFIX + "_control/ATTEMPT_001.json"
          FINAL = PREFIX + "_control/FINAL_LOCK.json"
          DISPLAY = "ko-lao-gemini35lite-sft-v2-pilot1-20261116"
          MODEL = "gemini-3.5-flash-lite"
          PILOT_JOB_ID = "8799981994835443712"
          PILOT_MODEL_ID = "2845219433335488512"
          PILOT_ENDPOINT_ID = "4220752460148375552"
          INPUTS = {
              "train_v2_candidate.jsonl": (1048, 694652, "c3803019c307a484f6b5461d25ce5575901f41bceeab97d7c9f4a840b7cc01af"),
              "validation_v2_candidate.jsonl": (304, 216683, "1d60d2d87177f42485e251cffaa57a109c60ac262c0fb05de82a169aa37a43fe"),
          }
          BOOTSTRAP = {
              BOOT + "RESUME_EVENT.json": "EXPECTED_RESUME_SHA256",
              BOOT + "TRANSFER_CLAIM.json": "EXPECTED_TRANSFER_CLAIM_SHA256",
              BOOT + "INPUT_PUBLIC_KEY.json": "EXPECTED_INPUT_PUBLIC_KEY_SHA256",
              BOOT + "TRANSFER_READY.json": "EXPECTED_TRANSFER_READY_SHA256",
          }
          GATE_ENVS = ("FREE_VALIDATION_SHA256", "SOURCE_BACKUP_SHA256", "SCANNER_GATE_SHA256", "LOCAL_GATES_SHA256", "REMOTE_GATE_SHA256", "RESUME_AUTHORITY_SHA256")
          JOB_FIELDS = (
              "name,state,baseModel,tunedModelDisplayName,createTime,startTime,endTime,updateTime,"
              "supervisedTuningSpec(trainingDatasetUri,validationDatasetUri,hyperParameters(epochCount,learningRateMultiplier,adapterSize),exportLastCheckpointOnly),"
              "tunedModel(model,endpoint,checkpoints(checkpointId,epoch,step,endpoint)),"
              "tuningDataStats(supervisedTuningDataStats(tuningDatasetExampleCount,totalTuningCharacterCount,totalBillableTokenCount,tuningStepCount,"
              "userInputTokenDistribution,userOutputTokenDistribution,userMessagePerExampleDistribution,totalTruncatedExampleCount,truncatedExampleIndices,droppedExampleReasons)),"
              "experiment,gcsMetricsUri,error(code,message,details)"
          )
          META_FIELDS = "name,generation,size,crc32c,md5Hash"
          LIST_FIELDS = "items(name,generation,size,timeDeleted),nextPageToken"
          TERMINAL = {"JOB_STATE_SUCCEEDED", "JOB_STATE_FAILED", "JOB_STATE_CANCELLED", "JOB_STATE_EXPIRED"}
          ACTIVE = {"JOB_STATE_PENDING", "JOB_STATE_RUNNING", "JOB_STATE_QUEUED", "JOB_STATE_UPDATING", "JOB_STATE_CANCELLING", "JOB_STATE_PAUSED"}
          MAX_RESPONSE_BYTES = 32 * 1024 * 1024
          MAX_PAGES = 100
          REQUEST = {
              "baseModel": MODEL,
              "supervisedTuningSpec": {
                  "trainingDatasetUri": "gs://" + BUCKET + "/" + PREFIX + "train_v2_candidate.jsonl",
                  "validationDatasetUri": "gs://" + BUCKET + "/" + PREFIX + "validation_v2_candidate.jsonl",
                  "hyperParameters": {"epochCount": "2", "learningRateMultiplier": 2, "adapterSize": "ADAPTER_SIZE_FOUR"},
                  "exportLastCheckpointOnly": False,
              },
              "tunedModelDisplayName": DISPLAY,
          }
          
          
          def utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()
          
          
          def encode(obj):
              return (json.dumps(obj, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def url(base, params):
              return base + "?" + urllib.parse.urlencode(params)
          
          
          class Blocked(Exception):
              def __init__(self, reason, status=None):
                  super().__init__(reason)
                  self.reason, self.status = reason, status
          
          
          def require(ok, reason):
              if not ok:
                  raise Blocked(reason)
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def object_endpoint(name):
              return "https://storage.googleapis.com/storage/v1/b/" + BUCKET + "/o/" + urllib.parse.quote(name, safe="")
          
          
          def job_base(region):
              host = "aiplatform." + region + ".rep.googleapis.com" if region in ("us", "eu") else region + "-aiplatform.googleapis.com"
              return "https://" + host + "/v1/projects/" + PROJECT + "/locations/" + region + "/tuningJobs"
          
          
          class Client:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect)
                  self.records, self.private_raw = [], []
                  self.create_attempts = 0
                  self.gcs_blocked = False
                  self.outcome = None
                  self._create_armed = False
                  self.raw_capture_complete = True
          
              @staticmethod
              def allowed(method, endpoint, body):
                  p = urllib.parse.urlsplit(endpoint)
                  if p.scheme != "https" or p.username or p.password or p.fragment:
                      return False
                  q = urllib.parse.parse_qs(p.query, keep_blank_values=True)
                  if any(len(v) != 1 for v in q.values()):
                      return False
                  if p.netloc == "storage.googleapis.com":
                      base = "/storage/v1/b/" + BUCKET + "/o"
                      if method == "GET" and body is None:
                          if p.path == base:
                              return q.get("versions") == ["true"] and set(q).issubset({"versions", "prefix", "maxResults", "fields", "pageToken"})
                          if p.path.startswith(base + "/"):
                              return set(q).issubset({"alt", "generation", "fields"}) and (q.get("alt") == ["media"] or q.get("fields") == [META_FIELDS])
                      if method == "POST" and p.path == "/upload/storage/v1/b/" + BUCKET + "/o":
                          return q.get("uploadType") == ["media"] and q.get("ifGenerationMatch") == ["0"] and q.get("name", [""])[0].startswith(PREFIX) and q.get("fields") == [META_FIELDS] and set(q) == {"uploadType", "name", "ifGenerationMatch", "fields"} and isinstance(body, bytes)
                  for region in ("us", "eu", "us-central1"):
                      collection = urllib.parse.urlsplit(job_base(region))
                      if p.netloc != collection.netloc:
                          continue
                      if method == "POST":
                          return region == "us" and p.path == collection.path and q == {"fields": [JOB_FIELDS]} and body == encode(REQUEST)
                      if method != "GET" or body is not None:
                          continue
                      if p.path == collection.path:
                          return q.get("fields") == ["tuningJobs(" + JOB_FIELDS + "),nextPageToken"] and set(q).issubset({"fields", "pageSize", "pageToken"})
                      pattern = r"/v1/projects/(?:" + PROJECT + "|" + PROJECT_NUMBER + r")/locations/" + region + r"/tuningJobs/[A-Za-z0-9_-]+"
                      if re.fullmatch(pattern, p.path):
                          return q == {"fields": [JOB_FIELDS]}
                  return False
          
              def request(self, method, endpoint, body=None, label="", safe_json=False, expected=(200,), sensitive=False, capture=True):
                  require(self.allowed(method, endpoint, body), "REQUEST_OUTSIDE_ALLOWLIST")
                  is_storage = urllib.parse.urlsplit(endpoint).netloc == "storage.googleapis.com"
                  is_create = method == "POST" and not is_storage
                  if is_create:
                      require(label == "TUNING_CREATE" and self._create_armed and self.create_attempts == 0, "UNARMED_OR_SECOND_CREATE_DENIED")
                      self._create_armed = False
                      self.create_attempts = 1
                  elif label == "TUNING_CREATE":
                      raise Blocked("CREATE_LABEL_ENDPOINT_MISMATCH")
                  record = {"label": label, "method": method, "url": endpoint, "start_time": utc()}
                  if body is not None and not sensitive:
                      record["request_sha256"] = sha(body)
                      record["request_bytes"] = len(body)
                  if sensitive:
                      record["sensitive_payload_omitted"] = True
                  req = urllib.request.Request(endpoint, data=body, method=method, headers={"Authorization": "Bearer " + self.token, "Content-Type": "application/octet-stream" if is_storage else "application/json"})
                  try:
                      try:
                          with self.opener.open(req, timeout=45) as response:
                              code, raw, headers = response.status, response.read(MAX_RESPONSE_BYTES + 1), response.headers
                      except urllib.error.HTTPError as error:
                          code, raw, headers = error.code, error.read(MAX_RESPONSE_BYTES + 1), error.headers
                  except Exception as error:
                      self.gcs_blocked = self.gcs_blocked or is_storage
                      self.raw_capture_complete = False
                      record.update(end_time=utc(), status="UNKNOWN", exception_type=type(error).__name__)
                      self.records.append(record)
                      raise Blocked("TRANSPORT_UNKNOWN_" + label) from None
                  record.update(end_time=utc(), http_status=code, response_bytes=len(raw), request_id=headers.get("x-goog-request-id") or headers.get("x-request-id") or headers.get("x-google-request-id"))
                  if not sensitive:
                      record["response_sha256"] = sha(raw)
                  self.records.append(record)
                  is_error = code not in expected
                  credential = (self.token and self.token.encode() in raw) or b"-----BEGIN " + b"PRIVATE KEY-----" in raw or b"-----BEGIN RSA " + b"PRIVATE KEY-----" in raw
                  if credential and (not sensitive or is_error):
                      record["raw_omission"] = "ACTUAL_CREDENTIAL_CONTENT_EXCLUDED"
                      self.raw_capture_complete = False
                      self.gcs_blocked = self.gcs_blocked or is_storage
                      raise Blocked("CREDENTIAL_CONTENT_IN_RESPONSE", code)
                  # Successful dataset/key payloads are omitted. Every error body is retained
                  # regardless of DATASET_MEDIA label or capture=False, unless it is a secret.
                  if is_error or (capture and not sensitive and not label.startswith("DATASET_MEDIA_")):
                      self.private_raw.append((label, raw))
                  if len(raw) > MAX_RESPONSE_BYTES:
                      self.raw_capture_complete = False
                      self.gcs_blocked = self.gcs_blocked or is_storage
                      record["body_truncated_by_safety_limit"] = True
                      raise Blocked("RESPONSE_SIZE_LIMIT_" + label, code)
                  if is_error:
                      self.gcs_blocked = self.gcs_blocked or is_storage
                      raise Blocked("HTTP_" + label, code)
                  if safe_json:
                      try:
                          value = json.loads(raw.decode("utf-8"))
                      except (UnicodeError, ValueError):
                          record["json_parse_status"] = "INVALID"
                          raise Blocked("MALFORMED_JSON_" + label, code) from None
                      require(isinstance(value, dict), "JSON_NOT_OBJECT_" + label)
                  return raw
          
          
          def read_object(client, name, generation=None, label="OBJECT_READ", sensitive=False, capture=True):
              params = {"alt": "media"}
              if generation is not None:
                  params["generation"] = str(generation)
              return client.request("GET", url(object_endpoint(name), params), label=label, sensitive=sensitive, capture=capture)
          
          
          def metadata(client, name, label):
              value = json.loads(client.request("GET", url(object_endpoint(name), {"fields": META_FIELDS}), label=label, safe_json=True))
              require(value.get("name") == name and str(value.get("generation", "")).isdigit() and str(value.get("size", "")).isdigit(), "OBJECT_METADATA_INVALID_" + label)
              return value
          
          
          def put_new(client, name, content, label, sensitive=False, capture=True):
              require(name.startswith(PREFIX) and isinstance(content, bytes), "NEW_OBJECT_OUTSIDE_V2_SCOPE")
              endpoint = url("https://storage.googleapis.com/upload/storage/v1/b/" + BUCKET + "/o", {"uploadType": "media", "name": name, "ifGenerationMatch": "0", "fields": META_FIELDS})
              value = json.loads(client.request("POST", endpoint, content, label=label, safe_json=True, expected=(200, 201), sensitive=sensitive, capture=capture and not sensitive))
              if value.get("name") != name or not str(value.get("generation", "")).isdigit() or int(value.get("size", -1)) != len(content):
                  client.gcs_blocked = True
                  raise Blocked("NEW_OBJECT_METADATA_INVALID_" + label)
              back = read_object(client, name, value["generation"], label + "_READBACK", sensitive=sensitive, capture=capture and not sensitive)
              if back != content:
                  client.gcs_blocked = True
                  raise Blocked("GCS_READBACK_MISMATCH_" + label)
              receipt = {"uri": "gs://" + BUCKET + "/" + name, "generation": str(value["generation"]), "size_bytes": len(content), "byte_equal": True, "precondition": "ifGenerationMatch=0"}
              if not sensitive:
                  receipt.update(sha256=sha(content), crc32c=value.get("crc32c"), md5Hash=value.get("md5Hash"))
              return receipt
          
          
          def list_objects(client):
              objects, seen, tokens, token = [], set(), set(), None
              for page in range(MAX_PAGES):
                  params = {"versions": "true", "maxResults": "1000", "fields": LIST_FIELDS}
                  if token:
                      params["pageToken"] = token
                  data = json.loads(client.request("GET", url("https://storage.googleapis.com/storage/v1/b/" + BUCKET + "/o", params), label="OBJECT_LIST_" + str(page), safe_json=True))
                  incoming = data.get("items", [])
                  require(isinstance(incoming, list), "OBJECT_LIST_INVALID")
                  for item in incoming:
                      require(isinstance(item, dict) and isinstance(item.get("name"), str) and str(item.get("generation", "")).isdigit(), "OBJECT_LIST_IDENTITY_INVALID")
                      identity = (item["name"], str(item["generation"]))
                      require(identity not in seen, "REPEATED_OBJECT_VERSION")
                      seen.add(identity)
                      objects.append(item)
                  token = data.get("nextPageToken")
                  if not token:
                      return objects
                  require(isinstance(token, str) and token not in tokens, "REPEATED_OBJECT_PAGE_TOKEN")
                  tokens.add(token)
              raise Blocked("OBJECT_LIST_INCOMPLETE")
          
          
          def check_prior_control(client, objects, env):
              verified = {}
              for name, env_key in BOOTSTRAP.items():
                  expected = env.get(env_key, "")
                  require(re.fullmatch(r"[0-9a-f]{64}", expected) is not None, "MISSING_BOOTSTRAP_SHA_" + env_key)
                  found = [x for x in objects if x["name"] == name]
                  require(len(found) == 1 and not found[0].get("timeDeleted"), "BOOTSTRAP_MISSING_OR_MULTIPLE_VERSIONS")
                  item = found[0]
                  raw = read_object(client, name, item["generation"], "BOOTSTRAP_" + env_key)
                  require(sha(raw) == expected and len(raw) == int(item["size"]), "BOOTSTRAP_HASH_OR_SIZE_CHANGED")
                  verified[name] = {"generation": str(item["generation"]), "sha256": sha(raw), "size_bytes": len(raw)}
              for item in objects:
                  name = item["name"]
                  belongs = name.startswith(PREFIX) or CAMPAIGN.lower() in name.lower()
                  if not belongs or name in BOOTSTRAP:
                      continue
                  lower = name.lower()
                  if name in (CONTROL, ATTEMPT, FINAL) or any(word in lower for word in ("create_once", "create_response", "attempt", "reservation", "lock", "ledger", "/_control/")):
                      raise Blocked("EXISTING_CAMPAIGN_CONTROL_OR_ATTEMPT")
                  if name in {PREFIX + f for f in INPUTS} or name == BOOT + "_transport/input_private_key.pem":
                      continue
                  # Exact evidence names written by this campaign's core/driver. These
                  # files never grant authority; READY is additionally frozen by its SHA.
                  if re.fullmatch(re.escape(PREFIX) + r"_evidence/(?:run_[0-9]+/RAW_HTTP\.json|dry_run_[0-9]+/READY\.json)", name):
                      continue
                  raise Blocked("UNRECOGNIZED_V2_REMOTE_OBJECT")
              return verified
          
          
          def dataset_check(client):
              results = {}
              for filename, (rows, size, digest) in INPUTS.items():
                  meta = metadata(client, PREFIX + filename, "DATASET_METADATA_" + filename)
                  raw = read_object(client, PREFIX + filename, meta["generation"], "DATASET_MEDIA_" + filename)
                  require(len(raw) == size and sha(raw) == digest and int(meta["size"]) == size, "DATASET_INTEGRITY_" + filename)
                  try:
                      lines = raw.decode("utf-8").splitlines()
                      require(len(lines) == rows, "DATASET_ROW_COUNT_" + filename)
                      for line in lines:
                          row = json.loads(line)
                          require(isinstance(row, dict) and set(row) == {"systemInstruction", "contents"}, "DATASET_SCHEMA_KEYS")
                          require(isinstance(row["contents"], list) and len(row["contents"]) == 2 and [v.get("role") for v in row["contents"]] == ["user", "model"], "DATASET_ROLES")
                          for section in [row["systemInstruction"]] + row["contents"]:
                              require(isinstance(section, dict) and set(section).issubset({"role", "parts"}) and isinstance(section.get("parts"), list) and len(section["parts"]) == 1, "DATASET_SECTION_KEYS")
                              part = section["parts"][0]
                              require(isinstance(part, dict) and set(part) == {"text"} and isinstance(part["text"], str) and bool(part["text"].strip()), "DATASET_EMPTY_OR_EXTRA_PARTS")
                  except (UnicodeError, ValueError, TypeError, AttributeError):
                      raise Blocked("DATASET_UTF8_OR_JSON_FORMAT_INVALID") from None
                  results[filename] = {"uri": "gs://" + BUCKET + "/" + PREFIX + filename, "rows": rows, "size_bytes": size, "sha256": digest, "generation": str(meta["generation"]), "crc32c": meta.get("crc32c"), "md5Hash": meta.get("md5Hash")}
              return results
          
          
          def jobs_check(client, tag):
              summary = {}
              for region in ("us", "eu", "us-central1"):
                  found, names, tokens, token = [], set(), set(), None
                  for page in range(MAX_PAGES):
                      params = {"pageSize": "1000", "fields": "tuningJobs(" + JOB_FIELDS + "),nextPageToken"}
                      if token:
                          params["pageToken"] = token
                      data = json.loads(client.request("GET", url(job_base(region), params), label=tag + "_" + region + "_" + str(page), safe_json=True))
                      incoming = data.get("tuningJobs", [])
                      require(isinstance(incoming, list), "TUNING_LIST_INVALID")
                      for job in incoming:
                          require(isinstance(job, dict) and isinstance(job.get("name"), str) and isinstance(job.get("state"), str) and job["name"] not in names, "TUNING_JOB_IDENTITY_INVALID_OR_REPEATED")
                          names.add(job["name"])
                          found.append(job)
                      token = data.get("nextPageToken")
                      if not token:
                          break
                      require(isinstance(token, str) and token not in tokens, "TUNING_PAGE_TOKEN_REPEATED")
                      tokens.add(token)
                  require(not token, "TUNING_LIST_INCOMPLETE")
                  matching = []
                  for job in found:
                      spec = job.get("supervisedTuningSpec", {})
                      values = [job.get("name", ""), job.get("tunedModelDisplayName", ""), spec.get("trainingDatasetUri", ""), spec.get("validationDatasetUri", "")]
                      if any(isinstance(v, str) and any(t in v.lower() for t in (DISPLAY.lower(), CAMPAIGN.lower(), "sft_v2_pilot1_20261116")) for v in values):
                          matching.append(job)
                  active = [j for j in found if j.get("state") not in TERMINAL]
                  summary[region] = {"total_jobs": len(found), "matching_campaign_jobs": len(matching), "active_jobs": len(active), "all_pages_read": True, "pages": page + 1}
                  require(not matching, "EXISTING_CAMPAIGN_JOB")
                  require(not active, "ACTIVE_TUNING_JOB")
              return summary
          
          
          def cost_check():
              tokens = math.ceil(INPUTS["train_v2_candidate.jsonl"][1] * 1.25)
              amount = tokens * 2 * 3 / 1000000
              require(amount <= 6, "ESTIMATED_COST_OVER_LIMIT")
