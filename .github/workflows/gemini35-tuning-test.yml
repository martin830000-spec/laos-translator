name: Assisted4 BASE64 authorized research
on:
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: assisted4-g35-base64-20261122
  cancel-in-progress: false
jobs:
  authorized-research:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Materialize authenticated research bundle
        env:
          RESEARCH_DIR: ${{ runner.temp }}/assisted4-base64
        run: |
          python - <<'PYBUNDLE'
          import base64,hashlib,io,os,pathlib,zipfile
          data=base64.b64decode('')
          if hashlib.sha256(data).hexdigest()!='28a733c7e49da108486895327df8d0fc0773eb7a3230ae86dca8bfbfd6a9536b': raise RuntimeError('BUNDLE_SHA')
          p=pathlib.Path(os.environ['RESEARCH_DIR']);p.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              if z.testzip() is not None: raise RuntimeError('BUNDLE_CRC')
              z.extractall(p)
          PYBUNDLE
      - name: Offline synthetic contract checks - no API calls
        run: python "${{ runner.temp }}/assisted4-base64/test_runner.py"
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Authorized nonstreaming BASE64 MAIN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESULT_DIR: ${{ runner.temp }}/assisted4-results
        run: python "${{ runner.temp }}/assisted4-base64/runner.py" MAIN
      - name: Owner encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assisted4-base64-MAIN-encrypted
          path: ${{ runner.temp }}/assisted4-results/evidence.p7m
          if-no-files-found: error
          retention-days: 7
