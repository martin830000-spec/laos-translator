name: TEST R16 read-only storage scope check
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-tuning-test-storage-read-check
  cancel-in-progress: false
jobs:
  storage-read-check:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check research prefix existence (list only)
        shell: bash
        run: |
          set -euo pipefail
          test "$ENABLE_GENERATION" = false
          test "$ENABLE_TUNING" = false
          if gcloud storage ls --recursive 'gs://ko-lao-gemini35-tuning-460077888071/gemini35_kb_lf_r16_relation_v2_ab264_20261128/' > "$RUNNER_TEMP/r16-list.txt" 2> "$RUNNER_TEMP/r16-list.err"; then
            printf 'PREFIX_LIST_OK nonblank_lines=%s\n' "$(grep -cve '^$' "$RUNNER_TEMP/r16-list.txt" || true)"
          elif grep -Fq 'matched no objects' "$RUNNER_TEMP/r16-list.err"; then
            echo 'PREFIX_LIST_NO_MATCHING_OBJECTS'
          else
            echo 'PREFIX_LIST_FAILED'
            exit 1
          fi
          echo 'MODEL_POSTS=0 GCS_WRITES=0'
