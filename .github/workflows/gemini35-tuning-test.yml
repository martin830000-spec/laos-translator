name: Gemini 3.5 Tuning TEST Authentication

on:
  push:
    branches:
      - research/gemini35-tuning-test
    paths:
      - .github/workflows/gemini35-tuning-test.yml

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify TEST bucket access
        run: gcloud storage ls gs://ko-lao-gemini35-tuning-460077888071/

      - name: Verify tuning API access
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --write-out "tuningJobs.list HTTP %{http_code}\n" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://aiplatform.us.rep.googleapis.com/v1/projects/gen-lang-client-0422436907/locations/us/tuningJobs"

      - name: Verify synthetic dataset upload and readback
        shell: bash
        run: |
          set -euo pipefail
          object="gs://ko-lao-gemini35-tuning-460077888071/_preflight/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          printf '%s\n' '{"contents":[{"role":"user","parts":[{"text":"안녕하세요"}]},{"role":"model","parts":[{"text":"ສະບາຍດີ"}]}]}' > "$RUNNER_TEMP/sample.jsonl"
          trap 'gcloud storage rm "$object" --quiet >/dev/null 2>&1 || true' EXIT
          gcloud storage cp "$RUNNER_TEMP/sample.jsonl" "$object"
          gcloud storage cp "$object" "$RUNNER_TEMP/readback.jsonl"
          cmp "$RUNNER_TEMP/sample.jsonl" "$RUNNER_TEMP/readback.jsonl"
          echo "Dataset storage roundtrip PASS"
