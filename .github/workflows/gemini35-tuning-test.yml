name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  metadata-wif-freeqa-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: WIF Vertex GET readonly identity free preflight
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TOKEN="$(gcloud auth print-access-token)"
          trap 'unset TOKEN' EXIT
          ROOT="https://aiplatform.us.rep.googleapis.com/v1/projects/460077888071/locations/us"
          ENDPOINT_BODY="$RUNNER_TEMP/vertex_endpoint_readonly.json"
          MODEL_BODY="$RUNNER_TEMP/vertex_model_readonly.json"
          ENDPOINT_CODE="$(curl --retry 0 --connect-timeout 12 --max-time 45 -sS -o "$ENDPOINT_BODY" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$ROOT/endpoints/1638501023804817408")"
          MODEL_CODE="$(curl --retry 0 --connect-timeout 12 --max-time 45 -sS -o "$MODEL_BODY" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$ROOT/models/4774448923710324736@1")"
          unset TOKEN
          printf 'ENDPOINT_HTTP=%s MODEL_HTTP=%s\n' "$ENDPOINT_CODE" "$MODEL_CODE"
          if [[ "$ENDPOINT_CODE" != "200" || "$MODEL_CODE" != "200" ]]; then
            echo 'READONLY_VERTEX_GET_NOT_CONFIRMED'
            if [[ "$ENDPOINT_CODE" != "200" ]]; then jq -r '"ENDPOINT_REASON=" + (.error.status//"UNKNOWN")' "$ENDPOINT_BODY" || true; fi
            if [[ "$MODEL_CODE" != "200" ]]; then jq -r '"MODEL_REASON=" + (.error.status//"UNKNOWN")' "$MODEL_BODY" || true; fi
            exit 10
          fi
          python3 - "$ENDPOINT_BODY" "$MODEL_BODY" <<'PYV'
          import json,sys
          endpoint=json.load(open(sys.argv[1],encoding='utf-8'))
          model=json.load(open(sys.argv[2],encoding='utf-8'))
          expected='projects/460077888071/locations/us/models/4774448923710324736'
          expected_ep='projects/460077888071/locations/us/endpoints/1638501023804817408'
          print('ENDPOINT_NAME_MATCH='+str(endpoint.get('name')==expected_ep))
          print('MODEL_NAME='+str(model.get('name','')))
          rows=endpoint.get('deployedModels',[])
          print('DEPLOYED_MODEL_COUNT='+str(len(rows)))
          for row in rows:
            print('DEPLOYED='+str(row.get('model',''))+' VERSION='+str(row.get('modelVersionId','')))
          version_ok=any(row.get('model','').removesuffix('@1')==expected and str(row.get('modelVersionId',''))=='1' for row in rows)
          model_ok=model.get('name','').removesuffix('@1')==expected
          print('TUNED_DEPLOYMENT_MATCH='+str(version_ok))
          print('MODEL_GET_MATCH='+str(model_ok))
          if endpoint.get('name')!=expected_ep or not (version_ok and model_ok):
            raise SystemExit('READONLY_MODEL_IDENTITY_NOT_VERIFIED')
          print('READONLY_WIF_VERTEX_IDENTITY_PASS')
          PYV
