name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  dd2-final-get-only-audit:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DD2_READONLY_AUDIT: "true"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Exact readonly script and receipt SHA before auditing 29 previous locks and 2 raw model SSE responses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'c9011ae989a82708a7fb25fd482ab35c47378626b0ffb1853c0a32ec4e992cd1  .github/dd2_readonly_audit.py' | sha256sum -c -
          echo 'c5ede838ff929637f1a5312dad51357d1cc81f98e8a413100052bcfc93365032  .github/dd2_audit_receipts.json' | sha256sum -c -
          echo '96eb52d6d2be776d1810609fae2548bbb16a7d1721f5be659e546c2c188564a5  .github/dd2_runner.py' | sha256sum -c -
          echo 'a0ddc9924ccf7628fb609410726071a8106dccc4e488840ff47f4cb7d8cc5af7  .github/dd2_pins29.json' | sha256sum -c -
          python3 .github/dd2_readonly_audit.py TEST
          python3 -O .github/dd2_readonly_audit.py TEST
      - name: WIF GCS GET-only audit exact 29 old and new final lock, raw SSE text replay, parent SHA, new prefix inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DD2_OWNER_CMS="$RUNNER_TEMP/dd2_final_audit_owner.cms.p7m"
          export DD2_PUBLIC_AUDIT_RECEIPT="$RUNNER_TEMP/dd2_final_audit_public.json"
          python3 .github/dd2_readonly_audit.py
          test -s "$RUNNER_TEMP/dd2_final_audit_owner.cms.p7m"
          test -s "$RUNNER_TEMP/dd2_final_audit_public.json"
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: dd2-postclose-audit-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dd2_final_audit_owner.cms.p7m
            ${{ runner.temp }}/dd2_final_audit_public.json
          retention-days: 7
          if-no-files-found: error
