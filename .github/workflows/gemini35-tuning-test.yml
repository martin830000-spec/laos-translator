          python test_route.py
          python -O test_route.py
          python dd2_sse.py
      - name: FREEQA then authorized API comparison, no retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GENERATION: "true"
          OWNER_CMS_PATH: ${{ runner.temp }}/apiroute48_owner.p7m
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/apiroute48"
          python -O route_runner.py RUN
      - name: Preserve owner encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apiroute48-owner-cms-${{ github.run_id }}
          path: ${{ runner.temp }}/apiroute48_owner.p7m
          if-no-files-found: warn
          retention-days: 3
