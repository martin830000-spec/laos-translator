name: Gemini3.5 BASE COUPLE_CTX AB64 — existing TEST workflow A_SCREEN
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-couple-ctx-ab64-20261123
  cancel-in-progress: false
jobs:
  authorized-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "true"
      ENABLE_TUNING: "false"
      V2_MODE: "CLOSED"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Materialize encrypted user inputs and fixed approved runner (no checkout)
        env:
          BUNDLE_PART_0: ""
          BUNDLE_PART_1: ""
          BUNDLE_PART_2: ""
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYBUNDLE'
          import base64,hashlib,io,os,pathlib,zipfile
          data=base64.b64decode(os.environ['BUNDLE_PART_0']+os.environ['BUNDLE_PART_1']+os.environ['BUNDLE_PART_2'])
          if hashlib.sha256(data).hexdigest()!='e07e8c9cf2dbcf1c273b7b95b2a9e5eab5157e1af8fb6752d2ef53abf5a71c15':raise RuntimeError('BUNDLE_SHA')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'g35-couple-ctx'
          dest.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              if z.testzip() is not None:raise RuntimeError('BUNDLE_CRC')
              names=z.namelist()
              if len(names)!=8 or any('/' in n or '..' in n or n.startswith('.') for n in names):raise RuntimeError('BUNDLE_PATH')
              z.extractall(dest)
          print('BUNDLE_ENCRYPTED_INPUT_VERIFIED',len(names))
          PYBUNDLE
      - name: Compile fixed runtime, never run pay model in preflight
        run: |
          set -euo pipefail
          python -m py_compile "$RUNNER_TEMP/g35-couple-ctx/runner.py" "$RUNNER_TEMP/g35-couple-ctx/transport.py" "$RUNNER_TEMP/g35-couple-ctx/test_runner.py"
      - name: Authenticate existing TEST WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Scoped runner — A_SCREEN
        env:
          RESULT_DIR: ${{ runner.temp }}/g35-couple-ctx/result
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python "$RUNNER_TEMP/g35-couple-ctx/runner.py" A_SCREEN
      - name: Preserve CMS encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g35-couple-ctx-A_SCREEN-${{ github.run_id }}
          path: ${{ runner.temp }}/g35-couple-ctx/result/evidence.p7m
          if-no-files-found: warn
          retention-days: 7
