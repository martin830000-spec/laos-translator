name: G35 LF LB R15 GET-only recovery zero generation
'on':
  push:
    branches:
    - research/gemini35-tuning-test
    paths:
    - .github/workflows/gemini35-tuning-test.yml
permissions:
  contents: read
concurrency:
  group: g35-lf-lb-r15-ab256-20261128
  cancel-in-progress: false
jobs:
  recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test'
      && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: 'false'
      ENABLE_TUNING: 'false'
    steps:
    - name: Materialize restricted GET-only recovery
      env:
        CHUNK_0: 
      shell: bash
      run: "set -euo pipefail\numask 077\npython - <<'PYSCRIPT'\nimport base64,hashlib,os,pathlib,io,zipfile\n\
        b=base64.b64decode(os.environ[\"CHUNK_0\"])\nif hashlib.sha256(b).hexdigest()!='33dcde968d396868be88240ae22fabb83123ac7ff633a0d5b2bce453359cbf0f':raise\
        \ RuntimeError('BUNDLE_PIN')\np=pathlib.Path(os.environ['RUNNER_TEMP'])/'r15-get-only';p.mkdir(exist_ok=False)\n\
        with zipfile.ZipFile(io.BytesIO(b)) as z:\n if z.testzip() is not None or\
        \ set(z.namelist())!={'recover.py','protected_pins.json','owner_public.crt'}:raise\
        \ RuntimeError('SCOPE')\n z.extractall(p)\nPYSCRIPT\npython \"$RUNNER_TEMP/r15-get-only/recover.py\"\
        \ test\npython -O \"$RUNNER_TEMP/r15-get-only/recover.py\" test\n"
    - uses: google-github-actions/auth@v3
      with:
        project_id: gen-lang-client-0422436907
        workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
        service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@v3
    - name: Read current campaign raw bytes and closed locks
      shell: bash
      run: 'set -euo pipefail

        umask 077

        python "$RUNNER_TEMP/r15-get-only/recover.py"'
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: g35-kb-r15-get-only-${{ github.run_id }}
        path: ${{ runner.temp }}/r15-get-only/evidence/evidence.p7m
        if-no-files-found: warn
        retention-days: 7
