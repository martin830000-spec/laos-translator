name: Gemini 3.5 AB144 Resume TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v11-ab144-20261115
  cancel-in-progress: false
jobs:
  ab144-resume:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AB144_MODE: "STAGE1"
      ENABLE_GENERATION: "true"
      ENABLE_TUNING: "false"
      PACKET_SHA256: "bae7e086c9009ede56fd6462f6d65518431eaf8a4974140665a70a16a24b22b9"
      PREFLIGHT_READY_SHA256: "5d7a01d9942ea98c3b70bfb9f4ef84a5c20aa3f5d21854121a956d47d7aa2b36"
      DRY_READY_SHA256: "628021bdb79f26e831cf7ce2aeafa4407fda37d5bb574ad040ac84cae9838931"
      STAGE1_SUMMARY_SHA256: ""
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate designated TEST identity
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute fixed-budget isolated TEST stage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/ab144_runner.py" <<'AB144_EMBED_0_END'
          """Fixed-budget AB144 TEST runner. No tuning, retry, deployment, or IAM mutation."""
          import base64, collections, datetime, hashlib, json, math, os, subprocess, sys, time, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          
          CAMPAIGN='GEMINI35_SFT_V11_AB144_20261115'
          BUCKET='ko-lao-gemini35-tuning-460077888071'
          PREFIX='sft_v11_ab144_20261115/'
          RESUME=PREFIX+'_resume/20261116/'
          OLD_STOP_SHA='e255a035fc41ec71fcdf49391862ed6f29055a9694542dd8bb4f663c5b69c84e'
          PROMPT_SHA={'KF':'538b4a55a12bc87cb2d48304b98ee6576b73536f02b28072c0a794f003923255','KB':'67133169a25ec84294989b3ef9aa97fe1ea47c2c23df419c2bb71ae224cc32a8','LF':'cea5dee18f57d26ef06416b34d94858d8ed0ff2701e9d7ff5a95d07dff77c9c6','LB':'1ebb1ec560dec07465269d6b4df581a701de488b6030e43e54d50a83d8abb421'}
          API_ROOT='https://aiplatform.us.rep.googleapis.com/v1/projects/460077888071/locations/us/'
          URLS={'A':API_ROOT+'publishers/google/models/gemini-3.5-flash-lite:generateContent','B':API_ROOT+'endpoints/4220752460148375552:generateContent'}
          CONFIG={'maxOutputTokens':2048,'thinkingConfig':{'thinkingLevel':'MINIMAL'}}
          RATES={'A':{'input':0.33,'output':2.75},'B':{'input':0.495,'output':4.125}}
          CAPS={'A_FIRST':24,'B_FIRST':24,'A_BACK':48,'B_BACK':48}
          MAX_BYTES=8192
          MAX_INPUT=10240
          MAX_BILLABLE_OUTPUT=2560
          OUTPUT_RESERVATION_IS_STRESS_ESTIMATE_NOT_PROVIDER_GUARANTEE=True
          MAX_COST=2.0
          
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def enc(v):return (json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode('utf-8')
          def sha(b):return hashlib.sha256(b).hexdigest()
          def jsonwrite(p,v):p.parent.mkdir(parents=True,exist_ok=True,mode=0o700);p.write_bytes(enc(v));p.chmod(0o600)
          def query(u,q):return u+'?'+urllib.parse.urlencode(q)
          def obj(n):return 'https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o/'+urllib.parse.quote(n,safe='')
          def require(ok,code):
           if not ok:raise Stop(code)
          class Stop(Exception):pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          
          class Client:
           def __init__(self,token):self.token=token;self.opener=urllib.request.build_opener(NoRedirect);self.receipts=[];self.storage_failed=False;self.observed_reservation_ids=set();self.current_reservation_ids=set();self.paid_started_ids=set()
           def free(self,method,url,body=None,label='',missing=False):
            q=urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
            allowed=method=='GET' and url.startswith('https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o')
            allowed=allowed or (method=='POST' and url.startswith('https://storage.googleapis.com/upload/storage/v1/b/'+BUCKET+'/o?') and q.get('ifGenerationMatch')==['0'] and q.get('name',[''])[0].startswith(RESUME))
            require(allowed,'FREE_REQUEST_OUTSIDE_ALLOWLIST')
            record={'method':method,'url':url,'label':label,'started_at':now()}
            try:
             request=urllib.request.Request(url,data=body,method=method,headers={'Authorization':'Bearer '+self.token,'Content-Type':'application/octet-stream'})
             try:
              with self.opener.open(request,timeout=45) as r:status,raw=r.status,r.read()
             except urllib.error.HTTPError as e:status,raw=e.code,e.read()
            except Exception as e:
             record.update(status='UNKNOWN',exception_type=type(e).__name__,finished_at=now());self.receipts.append(record);self.storage_failed=True
             raise Stop('FREE_STORAGE_TRANSPORT_UNKNOWN') from None
            record.update(http_status=status,response_sha256=sha(raw),response_bytes=len(raw),finished_at=now());self.receipts.append(record)
            if status==404 and missing:return None
            if status not in (200,201):
             self.storage_failed=True
             raise Stop('FREE_STORAGE_HTTP_'+str(status)+'_'+label)
            return raw
           def get(self,name,missing=False):return self.free('GET',query(obj(name),{'alt':'media'}),label='GET_'+name[len(RESUME):] if name.startswith(RESUME) else 'GET_PRIOR_CONTROL',missing=missing)
           def put(self,name,body):
            require(name.startswith(RESUME),'WRITE_OUTSIDE_RESUME')
            if name.startswith(RESUME+'_requests/'):
             self.current_reservation_ids.add(name[len(RESUME+'_requests/'):-5])
            u=query('https://storage.googleapis.com/upload/storage/v1/b/'+BUCKET+'/o',{'uploadType':'media','name':name,'ifGenerationMatch':'0','fields':'name,generation,size,crc32c,md5Hash'})
            m=json.loads(self.free('POST',u,body,label='CREATE_'+name[len(RESUME):]))
            back=self.free('GET',query(obj(name),{'alt':'media','generation':m['generation']}),label='READBACK_'+name[len(RESUME):])
            require(back==body,'STORAGE_READBACK_MISMATCH')
            return {'object':name,'generation':m['generation'],'bytes':len(body),'sha256':sha(body),'byte_equal':True,'ifGenerationMatch':0}
           def listing(self,prefix):
            out=[];page_token=None
            for page in range(10):
             q={'prefix':prefix,'versions':'true','maxResults':'1000','fields':'items(name,generation,size),nextPageToken'}
             if page_token:q['pageToken']=page_token
             v=json.loads(self.free('GET',query('https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o',q),label='LIST_'+str(page)))
             out.extend(v.get('items',[]));page_token=v.get('nextPageToken')
             if not page_token:return out
            raise Stop('INCOMPLETE_STORAGE_LIST')
          
          def make_body(prompt,text):
           require(isinstance(text,str) and bool(text.strip()),'EMPTY_INPUT')
           body={'systemInstruction':{'parts':[{'text':prompt}]},'contents':[{'role':'user','parts':[{'text':text}]}],'generationConfig':CONFIG}
           raw=enc(body);require(len(raw)<=MAX_BYTES,'REQUEST_BYTE_BOUND_EXCEEDED')
           return body,raw
          
          def validate_packet(p):
           require(p['campaign_id']==CAMPAIGN and p['resume_id']=='20261116','PACKET_CAMPAIGN')
           require(p['generation_config']==CONFIG and p['budget']=={'total':144,'stage1':48,'stage2':96,'categories':CAPS,'preflight_usd_cap':2},'PACKET_CONFIG_BUDGET')
           require(set(p['prompts'])==set(PROMPT_SHA),'PROMPT_KEYS')
           for k,d in PROMPT_SHA.items():require(sha(p['prompts'][k].encode())==d,'PROMPT_SHA_'+k)
           samples=p['samples'];require(len(samples)==24 and len({x['id'] for x in samples})==24,'SAMPLE_COUNT')
           ids={x['id'] for x in samples};require(ids=={x+f'{n:02d}' for x in ('K','L') for n in range(1,13)},'SAMPLE_IDS')
           require(collections.Counter(x['language'] for x in samples)=={'ko':12,'lo':12},'LANGUAGE_BALANCE')
           require(collections.Counter((x['language'],x['length_group']) for x in samples)=={(a,b):4 for a in ['ko','lo'] for b in ['short','medium','long']},'LENGTH_BALANCE')
           require(len(p['stage1_ids'])==8 and len(set(p['stage1_ids']))==8 and sum(x.startswith('K') for x in p['stage1_ids'])==4,'STAGE1_BALANCE')
           require(set(p['stage1_ids']).issubset(ids),'STAGE1_IDS')
           require(set(p['stage2_ids'])==ids-set(p['stage1_ids']) and len(p['stage2_ids'])==16,'STAGE2_IDS')
           for s in samples:
            require((s['id'].startswith('K') and s['language']=='ko') or (s['id'].startswith('L') and s['language']=='lo'),'SOURCE_ID_LANGUAGE')
            require(s['source_type']=='SYNTHETIC_NOT_REAL_CHAT' and sha(s['text'].encode())==s['sha256'],'SOURCE_SHA_TYPE')
            make_body(p['prompts']['KF' if s['language']=='ko' else 'LF'],s['text'])
           plan=[]
           for stage in (1,2):
            for index,sid in enumerate(p['stage'+str(stage)+'_ids']):
             first_models=['A','B'] if index%2==0 else ['B','A']
             for m in first_models:plan.append({'id':sid+'_F_'+m,'sample_id':sid,'model':m,'kind':'FIRST','stage':stage,'first_id':None})
             for j,fm in enumerate(first_models):
              back_models=['B','A'] if (index+j)%2==0 else ['A','B']
              for bm in back_models:plan.append({'id':sid+'_F_'+fm+'_BACK_'+bm,'sample_id':sid,'model':bm,'kind':'BACK','stage':stage,'first_id':sid+'_F_'+fm})
           require(len(plan)==144 and len({x['id'] for x in plan})==144,'FIXED_PLAN_COUNT')
           require(collections.Counter(x['model']+'_'+x['kind'] for x in plan)==CAPS,'FIXED_PLAN_CAPS')
           require(p['plan']==plan,'FROZEN_PLAN_MISMATCH')
           return plan
          
          def reserve_cost(model,input_tokens=MAX_INPUT,output_tokens=MAX_BILLABLE_OUTPUT):return (input_tokens*RATES[model]['input']+output_tokens*RATES[model]['output'])/1000000
          
          def verify_protected(c):
           controls={PREFIX+'_control/FINAL_LOCK.json':OLD_STOP_SHA,'sft_v11_pilot1_20261115/_control/CREATE_ONCE.json':'2d39a7711a0aa76496f9b37922776785bc35e072bf4bfa28c3dc50908a77e3ea','sft_v11_pilot1_20261115/_control/ATTEMPT_001.json':'40a5cd528199867cef6b3307dad6436fbb20993cc41ec000b4d2948ada21f309','sft_v11_pilot1_20261115/_control/FINAL_LOCK.json':'1ffca4547d7db5d397cac09e4bbfcab843ae6b195c166b6c9468a5baffcb3bf6'}
           for name,digest in controls.items():require(sha(c.get(name))==digest,'PROTECTED_CONTROL_CHANGED')
           training={'train_v11.jsonl':('1794739965286591',557378),'validation_v11.jsonl':('1794739965065841',170021)}
           for name,(generation,size) in training.items():
            value=json.loads(c.free('GET',query(obj('sft_v11_pilot1_20261115/'+name),{'fields':'name,generation,size'}),label='PROTECTED_TRAINING_METADATA'))
            require(str(value.get('generation'))==generation and int(value.get('size',-1))==size,'PROTECTED_TRAINING_CHANGED')
           return {'checked_at':now(),'four_prior_control_sha256_unchanged':True,'train_validation_generation_and_size_unchanged':True,'service_change_operations_available':False}
          
          def usage_cost(value,model):
           u=value.get('usageMetadata');require(isinstance(u,dict),'USAGE_MISSING')
           def n(k):
            v=u.get(k);require(isinstance(v,int) and not isinstance(v,bool) and v>=0,'USAGE_INVALID_'+k);return v
           prompt=n('promptTokenCount');candidate=n('candidatesTokenCount');total=n('totalTokenCount')
           if 'thoughtsTokenCount' in u:thoughts=n('thoughtsTokenCount');thought_source='REPORTED'
           else:thoughts=total-prompt-candidate;thought_source='DERIVED_TOTAL_MINUS_PROMPT_MINUS_CANDIDATE'
           require(thoughts>=0 and total==prompt+candidate+thoughts,'USAGE_TOTAL_INCONSISTENT')
           require(u.get('trafficType','ON_DEMAND')=='ON_DEMAND','UNEXPECTED_TRAFFIC_PRICING')
           require(prompt<=MAX_INPUT and candidate+thoughts<=MAX_BILLABLE_OUTPUT,'USAGE_EXCEEDS_COST_RESERVATION')
           cached=u.get('cachedContentTokenCount');require(cached is None or (isinstance(cached,int) and 0<=cached<=prompt),'CACHE_USAGE_INVALID')
           return {'input_tokens':prompt,'candidate_tokens':candidate,'thought_tokens':thoughts,'thought_tokens_source':thought_source,'total_tokens':total,'cached_tokens':cached,'traffic_type':u.get('trafficType'),'input_billed_at_uncached_standard_conservatively':True,'usd_estimate':reserve_cost(model,prompt,candidate+thoughts),'rates_per_million':RATES[model]}
          
          def decrypt_input(c,work):
           key=work/'input_private_key.pem';key.write_bytes(c.get(RESUME+'_transport/input_private_key.pem'));key.chmod(0o600)
           output=work/'INPUT_PACKET.json'
           try:
            subprocess.run(['node',os.environ['CRYPTO_SCRIPT'],'decrypt',str(key),os.environ['INPUT_ENVELOPE'],str(output),os.environ['INPUT_HEADER']],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
           finally:key.unlink(missing_ok=True)
           raw=output.read_bytes();require(sha(raw)==os.environ['PACKET_SHA256'],'INPUT_PACKET_SHA')
           return json.loads(raw),raw
          
          def load_ledger(c,plan,local,out):
           known={x['id']:x for x in plan};reservations=c.listing(RESUME+'_requests/')
           c.observed_reservation_ids.update(r['name'][len(RESUME+'_requests/'):-5] for r in reservations)
           require(len({r['name'] for r in reservations})==len(reservations),'RESERVATION_VERSIONS_CHANGED')
           result_objects=c.listing(RESUME+'_results/');result_ids={x['name'][len(RESUME+'_results/'):-5] for x in result_objects}
           require(len(result_ids)==len(result_objects),'RESULT_VERSIONS_CHANGED')
           for r in reservations:
            rid=r['name'][len(RESUME+'_requests/'):-5];require(rid in known and r['name'].endswith('.json'),'UNKNOWN_RESERVATION')
            require(rid in result_ids,'UNRESOLVED_PREVIOUS_RESERVATION')
            row=json.loads(c.get(RESUME+'_results/'+rid+'.json'));require(row['request_id']==rid and row['state']!='UNKNOWN','PREVIOUS_UNKNOWN')
            require(row['model']==known[rid]['model'] and row['kind']==known[rid]['kind'],'LEDGER_PLAN_MISMATCH')
            out[rid]=row;jsonwrite(local/'results'/ (rid+'.json'),row)
           require(result_ids==set(out),'RESULT_WITHOUT_RESERVATION')
           require(len(out)<=144,'TOTAL_CAP')
           counts=collections.Counter(r['model']+'_'+r['kind'] for r in out.values())
           require(all(counts[k]<=v for k,v in CAPS.items()),'CATEGORY_CAP')
           return out
          
          def paid(c,item,text,prompt,first,packet_sha,rows,work,plan):
           rid=item['id'];body,raw=make_body(prompt,text)
           require(os.environ.get('ENABLE_GENERATION')=='true' and os.environ.get('AB144_MODE') in ('STAGE1','STAGE2'),'GENERATION_DISABLED')
           require(rid not in rows and item in plan,'DUPLICATE_OR_UNPLANNED_REQUEST')
           require(c.get(RESUME+'FINAL_LOCK.json',missing=True) is None,'FINAL_LOCK_PRESENT')
           existing=c.listing(RESUME+'_requests/');ids={x['name'][len(RESUME+'_requests/'):-5] for x in existing}
           require(len(ids)==len(existing) and ids==set(rows),'REMOTE_LEDGER_MISMATCH_BEFORE_POST')
           count=collections.Counter(r['model']+'_'+r['kind'] for r in rows.values());key=item['model']+'_'+item['kind']
           require(len(rows)<144 and count[key]<CAPS[key],'CALL_CAP')
           require(sum(x['stage']==item['stage'] for x in rows.values()) < (48 if item['stage']==1 else 96),'STAGE_CAP')
           used=sum(r['accounted_cost_usd'] for r in rows.values())
           remaining=sum(reserve_cost(x['model']) for x in plan if x['id'] not in rows)
           require(used+remaining<=MAX_COST+1e-12,'COST_ENVELOPE_EXCEEDED')
           if item['kind']=='BACK':require(first is not None and text==first['output_text'] and sha(text.encode())==first['output_sha256'],'BACK_INPUT_NOT_EXACT_FIRST')
           reservation=dict(item,campaign_id=CAMPAIGN,resume_id='20261116',reserved_at=now(),packet_sha256=packet_sha,run_id=os.environ['GITHUB_RUN_ID'],commit_sha=os.environ['GITHUB_SHA'],input_text=text,input_sha256=sha(text.encode()),prompt_sha256=sha(prompt.encode()),request_body=body,request_body_utf8_base64=base64.b64encode(raw).decode(),request_body_sha256=sha(raw),request_bytes=len(raw),endpoint=URLS[item['model']],state='RESERVED_BEFORE_SEND',conservative_debit=1,initial_origin_not_supplied_to_back=True,cost_reservation_usd=reserve_cost(item['model']))
           receipt=c.put(RESUME+'_requests/'+rid+'.json',enc(reservation));jsonwrite(work/'requests'/(rid+'.json'),reservation)
           row=dict(item,request_id=rid,campaign_id=CAMPAIGN,resume_id='20261116',reservation_receipt=receipt,input_text=text,input_sha256=sha(text.encode()),prompt_sha256=sha(prompt.encode()),request_body_sha256=sha(raw),endpoint=URLS[item['model']],state='UNKNOWN',attempt_count=1,http_status=None,response_id=None,output_text=None,output_sha256=None,started_at=now(),accounted_cost_usd=reserve_cost(item['model']),cost_is_reservation=True)
           req=urllib.request.Request(URLS[item['model']],data=raw,method='POST',headers={'Authorization':'Bearer '+c.token,'Content-Type':'application/json'})
           rows[rid]=row;c.paid_started_ids.add(rid)
           t0=time.perf_counter();stop_reason=None;response_raw=None;status=None;headers={}
           try:
            try:
             with c.opener.open(req,timeout=90) as resp:status,response_raw,headers=resp.status,resp.read(),dict(resp.headers)
            except urllib.error.HTTPError as e:status,response_raw,headers=e.code,e.read(),dict(e.headers)
            row.update(http_status=status,state='HTTP_ERROR' if status!=200 else 'RECEIVED')
           except Exception as e:row['exception_type']=type(e).__name__;stop_reason='PAID_TRANSPORT_UNKNOWN'
           row.update(completed_at=now(),api_full_completion_seconds=time.perf_counter()-t0,first_text_seconds=None,measurement='NONSTREAMING_API_REQUEST_TO_FULL_BODY_NOT_PHONE_UI')
           row['response_headers']={k:v for k,v in headers.items() if k.lower() in ('date','content-type','x-request-id','x-goog-request-id','x-google-request-id')}
           if response_raw is not None:
            row.update(raw_response_base64=base64.b64encode(response_raw).decode(),response_bytes=len(response_raw),response_sha256=sha(response_raw))
            try:
             value=json.loads(response_raw);row['raw_response_json']=value
             if status!=200:stop_reason='PAID_HTTP_'+str(status)
             else:
              cost=usage_cost(value,item['model']);row['usage']=cost;row.update(accounted_cost_usd=cost['usd_estimate'],cost_is_reservation=False,response_id=value.get('responseId'),model_version=value.get('modelVersion'))
              candidates=value.get('candidates',[]);require(len(candidates)==1,'CANDIDATE_COUNT')
              candidate=candidates[0];parts=candidate.get('content',{}).get('parts',[])
              require(all(p.get('thought') is True or 'text' in p for p in parts),'NON_TEXT_OUTPUT')
              output=''.join(p['text'] for p in parts if 'text' in p and not p.get('thought',False))
              row.update(finish_reason=candidate.get('finishReason'),output_text=output,output_sha256=sha(output.encode()),valid_translation=candidate.get('finishReason')=='STOP' and bool(output.strip()))
              row['state']='SUCCESS' if row['valid_translation'] else 'INVALID_TRANSLATION'
              if row['finish_reason']=='MAX_TOKENS' and sum(r.get('finish_reason')=='MAX_TOKENS' for r in rows.values())>=2:stop_reason='REPEATED_MAX_TOKENS'
            except Stop as e:stop_reason=str(e);row['processing_error']=stop_reason
            except Exception as e:stop_reason='PAID_RESPONSE_PARSE_FAILURE';row['processing_error_type']=type(e).__name__
           rows[rid]=row;jsonwrite(work/'results'/(rid+'.json'),row)
           try:row['result_receipt']=c.put(RESUME+'_results/'+rid+'.json',enc(row))
           except Exception:raise Stop('POST_RESULT_STORAGE_FAILED_NO_RETRY') from None
           if stop_reason:raise Stop(stop_reason)
           return row
          
          def export_encrypted(c,work,summary):
           jsonwrite(work/'RUN_SUMMARY.json',summary)
           jsonwrite(work/'FREE_HTTP_RECEIPTS.json',c.receipts if c else [])
           files=[p for p in work.rglob('*') if p.is_file() and p.name not in ('input_private_key.pem',)]
           manifest={'campaign_id':CAMPAIGN,'files':{str(p.relative_to(work)):{'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in files}}
           jsonwrite(work/'MANIFEST_SHA256.json',manifest);files.append(work/'MANIFEST_SHA256.json')
           bundle=work.parent/'private_evidence.zip'
           with zipfile.ZipFile(bundle,'x',zipfile.ZIP_DEFLATED) as z:
            for p in files:z.write(p,str(p.relative_to(work)))
           b=bundle.read_bytes();header={'campaign':CAMPAIGN,'resume_event':'20261116','purpose':'output_'+os.environ['AB144_MODE'].lower()+'_'+os.environ['GITHUB_RUN_ID'],'bundle_sha256':sha(b),'plaintext_bytes':len(b)}
           headerpath=work.parent/'output_header.json';jsonwrite(headerpath,header)
           cipher=work.parent/'ab144_encrypted_evidence.json'
           subprocess.run(['node',os.environ['CRYPTO_SCRIPT'],'encrypt',os.environ['OUTPUT_PUBLIC_KEY'],str(bundle),str(cipher),str(headerpath)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
           if c and not c.storage_failed:summary['encrypted_export_receipt']=c.put(RESUME+'_exports/'+os.environ['GITHUB_RUN_ID']+'.json',cipher.read_bytes())
           return {'encrypted_artifact_file':cipher.name,'ciphertext_sha256':sha(cipher.read_bytes()),'header':header}
          
          def main():
