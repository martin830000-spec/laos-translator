name: G35 R5 close-only final lock zero generation
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: g35-kf-r5-event-compact-ab480-20261127
  cancel-in-progress: false
jobs:
  recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - name: Materialize GET-only recovery code and public recipient
        env:
          RECOVERY_BUNDLE: ""
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64,hashlib,io,os,pathlib,zipfile
          b=base64.b64decode(os.environ['RECOVERY_BUNDLE'])
          if hashlib.sha256(b).hexdigest()!='ea22510382ffe4134f831be26514315b7c4e233830a5d489e7e360a158e10cfd':raise RuntimeError('BUNDLE_SHA')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'r5-recovery'
          p.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              if z.testzip() is not None or set(z.namelist())!={'recover.py','close_only.py','close_expected.json','protected_pins.json','owner_public.crt'}:raise RuntimeError('BUNDLE_MEMBERS')
              z.extractall(p)
          PY
          python "$RUNNER_TEMP/r5-recovery/close_only.py" test
          python -O "$RUNNER_TEMP/r5-recovery/close_only.py" test
      - name: Authenticate existing TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Configure existing gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Create only verified final lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python "$RUNNER_TEMP/r5-recovery/close_only.py"
      - name: Preserve CMS encrypted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r5-close-only-final-lock-${{ github.run_id }}
          path: ${{ runner.temp }}/r5-recovery/evidence/evidence.p7m
          if-no-files-found: error
          retention-days: 7
