name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  gcs-guard-freeqa:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCS_FREE_STAGE: "FINALIZE"
      R4CHAIN_MODE: "FINALIZE"
      V2_MODE: "CLOSED"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      WORKORDER_SHA256: "657625381c46eb1000c22c6b21aca09d866df5bfce15476cf8e81b783ebf4893"
      OWNER_REVIEW_SHA256: "e0c79e9fec78ac7190d7653f802adda4ad6f06d8197fb5effb9c5f92f9120b3d"
      OWNER_REVIEW_EXPECTED_SHA256: "e0c79e9fec78ac7190d7653f802adda4ad6f06d8197fb5effb9c5f92f9120b3d"
      COMMON_SCRIPT_SHA256: "f16c0a4c78a3ff0b87bf158f2380e03dc57f88be48c101ea7fae5ed929631ceb"
      ENTRY_SCRIPT_SHA256: "e0c79e9fec78ac7190d7653f802adda4ad6f06d8197fb5effb9c5f92f9120b3d"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "9429a5064488c3fcad464ce07ca3903bdfc4bab32ce17d9d66ae72680403e822"
    steps:
      - name: Frozen code and offline tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'FILES'
          import os,base64,gzip,hashlib
          from pathlib import Path
          files={'scripts/protected_pins.json': '', 'scripts/socket_observer.py': '', 'scripts/transport_crypto.mjs': '', 'scripts/stress_common.py': '', 'scripts/safe_transport_diag.py': '', 'scripts/free_runner.py': '', 'scripts/stress_gcs_contract.py': '', 'tests/test_free_transport.py': '', 'guard/sitecustomize.py': '', 'output_public.pem': '', 'code_pins.json': '', 'config.json': ''}
          pins={'scripts/protected_pins.json': 'bf8a15843cb3f1dec500cc295717372f6399a35f2eb3aa257bfc9adf96ecd65a', 'scripts/socket_observer.py': '638826d47805301334a1f6b53c6f0f035f793f594b7133919569e2731b7ad8b7', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'scripts/stress_common.py': 'f16c0a4c78a3ff0b87bf158f2380e03dc57f88be48c101ea7fae5ed929631ceb', 'scripts/safe_transport_diag.py': '0433cec7febb9e83688d91a5e3a1814e57f53bae969e1248cda3f0d636bac5f9', 'scripts/free_runner.py': 'e0c79e9fec78ac7190d7653f802adda4ad6f06d8197fb5effb9c5f92f9120b3d', 'scripts/stress_gcs_contract.py': 'ceedc72576869ca37f52e8b9b2d775d5e8677e124b4707f9b957971f2fe9ae06', 'tests/test_free_transport.py': '0ecedef872cedb7957ddb428674e2be993dd3111384af51e7c25cddffad32b50', 'guard/sitecustomize.py': 'c9dd3b5705ebfb842adb1b0a0f1ce30ab0a30fc635c76ceb8416e86789cf365d', 'output_public.pem': '9429a5064488c3fcad464ce07ca3903bdfc4bab32ce17d9d66ae72680403e822', 'code_pins.json': '27b5909c12294c41625de003813c13bce26e0dc5030a829a047e3b75a433eb1c', 'config.json': '3fbb7668e9c3458986384696a14c4b92a7f5733d6657737553e9a1b3f675bc18'}
          for n,v in files.items():
           b=gzip.decompress(base64.b64decode(v)); assert hashlib.sha256(b).hexdigest()==pins[n]
           p=Path(os.environ['RUNNER_TEMP'])/n; p.parent.mkdir(parents=True,exist_ok=True,mode=0o700);p.write_bytes(b);p.chmod(0o600)
          FILES
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RUNNER_TEMP/guard:$RUNNER_TEMP/scripts" python3 -m unittest discover -s "$RUNNER_TEMP/tests" -v > "$RUNNER_TEMP/offline.stdout" 2> "$RUNNER_TEMP/offline.stderr"
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded free diagnosis
        shell: bash
        run: |
          set -euo pipefail
          export CRYPTO_SCRIPT="$RUNNER_TEMP/scripts/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/scripts/free_runner.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gcs-freeqa-finalize-${{ github.run_id }}
          path: ${{ runner.temp }}/r4chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
