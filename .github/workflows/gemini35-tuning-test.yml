              require(request_bytes == enc(core.REQUEST), "CORE_CANONICAL_ENCODING_CHANGED")
              require(sha(request_bytes) == env.get("EXPECTED_REQUEST_SHA256") == local.get("request_sha256"), "REQUEST_PROOF_MISMATCH")
              return {"gate": gate, "authority": authority, "local": local, "files": {"REMOTE_GATE.json": gate_raw, "RESUME_AUTHORITY.json": authority_raw, "LOCAL_GATES.json": local_raw}, "request_bytes": request_bytes}
          
          
          def call_crypto(env, operation, *paths):
              script = local_file(env, "CRYPTO_SCRIPT", 1024 * 1024)
              require(sha(script.read_bytes()) == env.get("CRYPTO_SCRIPT_SHA256"), "CRYPTO_SCRIPT_SHA_MISMATCH")
              try:
                  response = subprocess.run(["node", str(script), operation, *map(str, paths)], stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90, check=False)
              except subprocess.TimeoutExpired as error:
                  failure = DriverBlocked("CRYPTO_" + operation.upper() + "_TIMEOUT")
                  failure.subprocess_failure = subprocess_failure("crypto_" + operation, None, error.stdout, error.stderr)
                  raise failure from None
              if response.returncode != 0:
                  failure = DriverBlocked("CRYPTO_" + operation.upper() + "_FAILED")
                  failure.subprocess_failure = subprocess_failure("crypto_" + operation, response.returncode, response.stdout, response.stderr)
                  raise failure
              value = json.loads(response.stdout)
              require(value.get("ok") is True and value.get("operation") == operation, "CRYPTO_RESULT_INVALID")
              return value
          
          
          def get_generation(receipt):
              generation = str(receipt.get("generation", ""))
              require(generation.isdigit(), "GENERATION_REQUIRED")
              return generation
          
          
          def normalized_receipt(name, receipt, *, sensitive=False):
              require(isinstance(receipt, dict), "RECEIPT_OBJECT_REQUIRED")
              require(receipt.get("byte_equal") is True and receipt.get("precondition") == "ifGenerationMatch=0", "CREATE_RECEIPT_PRECONDITION_OR_READBACK_MISSING")
              value = {"object": name, "uri": "gs://" + BUCKET + "/" + name, "generation": get_generation(receipt), "bytes": receipt.get("bytes", receipt.get("size_bytes", receipt.get("size"))), "byte_equal": True, "ifGenerationMatch": 0}
              if not sensitive and "sha256" in receipt:
                  value["sha256"] = receipt["sha256"]
                  value["crc32c"] = receipt.get("crc32c")
                  value["md5Hash"] = receipt.get("md5Hash")
              return value
          
          
          def proof_digests(env):
              return {key: env[key] for key in PROOF_ENV}
          
          
          def campaign_objects(objects):
              # The core intentionally inventories every version in the bucket. Preserve
              # unrelated V1.1/AB144 objects and restrict this driver's checks to V2.
              return [item for item in objects if isinstance(item.get("name"), str) and (item["name"].startswith(PREFIX) or CAMPAIGN.lower() in item["name"].lower())]
          
          
          def transfer_init(core, client, env, work, result, proofs):
              prior = campaign_objects(core.list_objects(client))
              require(not prior, "EXISTING_V2_NAMESPACE_TRANSFER_INIT_DENIED")
              result["fresh_jobs_before_transfer"] = core.jobs_check(client, "TRANSFER_INIT_LIST")
              claim = {"campaign_id": CAMPAIGN, "resume_event_id": RESUME_ID, "state": "TRANSFER_CLAIMED_LOCKED", "run_id": env["GITHUB_RUN_ID"], "commit_sha": env["GITHUB_SHA"], "proof_digests": proof_digests(env), "enabled": False, "max_new": 0, "next_new_authorization": 0, "authorization_added": 0, "create_attempts_reserved": 0, "created_at": core.utc()}
              claim_raw = core.encode(claim)
              result["transfer_claim_receipt"] = normalized_receipt(CLAIM, core.put_new(client, CLAIM, claim_raw, "TRANSFER_CLAIM_CREATE"))
              result["owns_namespace"] = True
              event = {"campaign_id": CAMPAIGN, "resume_event_id": RESUME_ID, "state": "RESUME_AUTHORIZED_TRANSFER_LOCKED", "authority": proofs["authority"], "authority_sha256": env["RESUME_AUTHORITY_SHA256"], "remote_gate_sha256": env["REMOTE_GATE_SHA256"], "local_gates_sha256": env["LOCAL_GATES_SHA256"], "claim_receipt": result["transfer_claim_receipt"], "enabled": False, "max_new": 0, "next_new_authorization": 0, "authorization_added": 0, "prior_records_not_overwritten": True, "prior_blocked_record_scope": "User/local/Drive record; no invented remote V2 control record", "created_at": core.utc()}
              event_raw = core.encode(event)
              result["resume_event_receipt"] = normalized_receipt(RESUME, core.put_new(client, RESUME, event_raw, "RESUME_EVENT_CREATE"))
              keypath, publicpath = work / "input_private_key.pem", work / "input_public_key.pem"
              try:
                  generated = call_crypto(env, "keygen", keypath, publicpath)
                  require(generated.get("rsa_bits") == 4096, "RSA4096_REQUIRED")
                  private = keypath.read_bytes()
                  public = publicpath.read_bytes()
                  require(private.startswith(b"-----BEGIN PRIVATE KEY-----\n") and public.startswith(b"-----BEGIN PUBLIC KEY-----\n"), "KEY_FORMAT_INVALID")
                  key_receipt = core.put_new(client, PRIVATE_KEY, private, "PRIVATE_INPUT_KEY_CREATE", sensitive=True, capture=False)
                  result["input_private_key_receipt"] = normalized_receipt(PRIVATE_KEY, key_receipt, sensitive=True)
                  del private
              finally:
                  keypath.unlink(missing_ok=True)
              result["input_public_key_pem"] = public.decode("ascii")
              result["input_public_key_sha256"] = sha(public)
              public_record = {"campaign_id": CAMPAIGN, "resume_event_id": RESUME_ID, "public_key_pem": result["input_public_key_pem"], "public_key_sha256": sha(public), "rsa_bits": 4096, "oaep_hash": "SHA256", "private_key_receipt": result["input_private_key_receipt"], "private_key_in_evidence": False}
              public_raw = core.encode(public_record)
              result["input_public_key_object_receipt"] = normalized_receipt(PUBLIC_KEY, core.put_new(client, PUBLIC_KEY, public_raw, "INPUT_PUBLIC_KEY_CREATE"))
              ready = {"campaign_id": CAMPAIGN, "resume_event_id": RESUME_ID, "state": "TRANSFER_READY_LOCKED", "run_id": env["GITHUB_RUN_ID"], "driver_sha256": result["driver_sha256"], "proof_digests": proof_digests(env), "claim_receipt": result["transfer_claim_receipt"], "resume_receipt": result["resume_event_receipt"], "public_key_receipt": result["input_public_key_object_receipt"], "private_key_receipt": result["input_private_key_receipt"], "public_key_sha256": sha(public), "enabled": False, "max_new": 0, "next_new_authorization": 0, "tuning_create_attempts": 0, "finished_at": core.utc()}
              ready_raw = core.encode(ready)
              result["transfer_ready_receipt"] = normalized_receipt(READY, core.put_new(client, READY, ready_raw, "TRANSFER_READY_CREATE"))
              result["bootstrap_hashes"] = {"EXPECTED_TRANSFER_CLAIM_SHA256": sha(claim_raw), "EXPECTED_RESUME_SHA256": sha(event_raw), "EXPECTED_INPUT_PUBLIC_KEY_SHA256": sha(public_raw), "EXPECTED_TRANSFER_READY_SHA256": sha(ready_raw)}
              result["state"] = "TRANSFER_READY_LOCKED"
              return result
          
          
          def read_bootstrap(core, client, env, result, proofs):
              objects = campaign_objects(core.list_objects(client))
              by_name = {}
              for item in objects:
                  name = item.get("name")
                  require(isinstance(name, str) and name not in by_name, "DUPLICATE_OBJECT_GENERATIONS")
                  require(not item.get("timeDeleted"), "DELETED_V2_OBJECT_VERSION")
                  by_name[name] = item
                  require(not (name.startswith(BOOT + "STOP_LOCK_") or name in {PREFIX + "_control/CREATE_ONCE.json", PREFIX + "_control/ATTEMPT_001.json", PREFIX + "_control/FINAL_LOCK.json"}), "EXISTING_ATTEMPT_OR_STOP_LOCK")
              values = {}
              for name, key in BOOT_HASH_ENV.items():
                  require(name in by_name, "BOOTSTRAP_OBJECT_MISSING")
                  require(bool(re.fullmatch(r"[0-9a-f]{64}", env.get(key, ""))), "BOOTSTRAP_SHA_ENV_MISSING")
                  raw = core.read_object(client, name, generation=get_generation(by_name[name]), label="DRIVER_BOOTSTRAP_" + Path(name).stem)
                  require(sha(raw) == env[key], "BOOTSTRAP_SHA_MISMATCH")
                  value = json.loads(raw)
                  require(value.get("campaign_id") == CAMPAIGN and value.get("resume_event_id") == RESUME_ID, "BOOTSTRAP_CAMPAIGN_MISMATCH")
                  values[name] = value
              ready = values[READY]
              require(ready.get("state") == "TRANSFER_READY_LOCKED" and ready.get("proof_digests") == proof_digests(env), "TRANSFER_READY_PROOF_MISMATCH")
              require(values[RESUME].get("authority") == proofs["authority"], "REMOTE_RESUME_AUTHORITY_CHANGED")
              public = values[PUBLIC_KEY]
              pem = public.get("public_key_pem", "").encode("ascii")
              require(public.get("rsa_bits") == 4096 and sha(pem) == public.get("public_key_sha256") == ready.get("public_key_sha256"), "REMOTE_PUBLIC_KEY_HASH_MISMATCH")
              key_receipt = ready.get("private_key_receipt", {})
              require(key_receipt.get("object") == PRIVATE_KEY and PRIVATE_KEY in by_name and get_generation(key_receipt) == get_generation(by_name[PRIVATE_KEY]), "PRIVATE_KEY_GENERATION_CHANGED")
              require(public.get("private_key_receipt") == key_receipt, "PRIVATE_KEY_RECEIPTS_DIFFER")
              for receipt_field, name in (("claim_receipt", CLAIM), ("resume_receipt", RESUME), ("public_key_receipt", PUBLIC_KEY)):
                  receipt = ready.get(receipt_field, {})
                  require(receipt.get("object") == name and get_generation(receipt) == get_generation(by_name[name]) and receipt.get("sha256") == env[BOOT_HASH_ENV[name]], "BOOTSTRAP_RECEIPT_MISMATCH")
              result["owns_namespace"] = True
              result["verified_bootstrap_hashes"] = {key: env[key] for key in BOOT_HASH_ENV.values()}
              result["input_private_key_receipt"] = key_receipt
              result["input_public_key_sha256"] = sha(pem)
              return ready, by_name
          
          
          def unpack_payload(raw, env, core):
              expected_names = set(INPUTS) | {"request.json", "MANIFEST_SHA256.json"}
              require(sha(raw) == env.get("INPUT_BUNDLE_SHA256"), "INPUT_BUNDLE_SHA_MISMATCH")
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  infos = archive.infolist()
                  require(len(infos) == 4 and {x.filename for x in infos} == expected_names, "INPUT_ZIP_EXACT_FILE_SET")
                  require(all(not x.is_dir() and not x.flag_bits & 1 and not stat.S_ISLNK(x.external_attr >> 16) and 0 <= x.file_size <= MAX_BYTES for x in infos), "INPUT_ZIP_ENTRY_UNSAFE")
                  require(archive.testzip() is None, "INPUT_ZIP_CRC")
                  content = {name: archive.read(name) for name in expected_names}
              manifest = json.loads(content["MANIFEST_SHA256.json"])
              require(isinstance(manifest, dict) and manifest.get("algorithm") == "SHA-256" and manifest.get("self_excluded") is True, "INPUT_MANIFEST_CONTRACT")
              rows = manifest.get("files", {})
              require(set(rows) == expected_names - {"MANIFEST_SHA256.json"}, "INPUT_MANIFEST_FILE_SET")
              for name, meta in rows.items():
                  require(meta.get("bytes") == len(content[name]) and meta.get("sha256") == sha(content[name]), "INPUT_MANIFEST_HASH_MISMATCH")
              for name, contract in INPUTS.items():
                  data = content[name]
                  require(len(data) == contract["bytes"] and sha(data) == contract["sha256"] and len(data.splitlines()) == contract["rows"], "APPROVED_DATA_BYTES_OR_ROWS_MISMATCH")
                  data.decode("utf-8")
              require(content["request.json"] == core.encode(core.REQUEST) and sha(content["request.json"]) == env.get("EXPECTED_REQUEST_SHA256"), "PAYLOAD_REQUEST_NOT_FROZEN_CORE_REQUEST")
              return content
          
          
          def decrypt_and_transfer(core, client, env, work, result, proofs):
              ready, objects = read_bootstrap(core, client, env, result, proofs)
              header_path = local_file(env, "INPUT_HEADER", 16 * 1024)
              header = json.loads(header_path.read_bytes())
              require(set(header) == {"campaign", "resume_event", "purpose", "bundle_sha256", "plaintext_bytes"}, "INPUT_HEADER_FIELDS")
              require(header.get("campaign") == CAMPAIGN and header.get("resume_event") == RESUME_ID and header.get("purpose") == "v2_training_inputs" and header.get("bundle_sha256") == env.get("INPUT_BUNDLE_SHA256"), "INPUT_HEADER_BINDING")
              require(type(header.get("plaintext_bytes")) is int and 0 < header["plaintext_bytes"] <= MAX_BYTES, "INPUT_HEADER_SIZE")
              envelope = local_file(env, "INPUT_ENVELOPE")
              key_path = work / "input_private_key.pem"
              plain_path = work / "input_payload.zip"
              key = core.read_object(client, PRIVATE_KEY, generation=get_generation(ready["private_key_receipt"]), label="PRIVATE_INPUT_KEY_READ", sensitive=True, capture=False)
              try:
                  require(key.startswith(b"-----BEGIN PRIVATE KEY-----\n"), "PRIVATE_KEY_FORMAT")
                  new_file(key_path, key)
                  del key
                  call_crypto(env, "decrypt", key_path, envelope, plain_path, header_path)
              finally:
                  key_path.unlink(missing_ok=True)
              raw = plain_path.read_bytes()
              require(len(raw) == header["plaintext_bytes"], "INPUT_PLAINTEXT_SIZE_MISMATCH")
              content = unpack_payload(raw, env, core)
              result["input_bundle_sha256"] = sha(raw)
              result["input_zip_crc_and_manifest"] = "PASS"
              result["dataset_transfer_receipts"] = {}
              for filename in INPUTS:
                  name = PREFIX + filename
                  if name in objects:
                      generation = get_generation(objects[name])
                      back = core.read_object(client, name, generation=generation, label="EXISTING_DATASET_COMPARE", capture=False)
                      require(back == content[filename], "EXISTING_DATASET_BYTES_DIFFER")
                      receipt = {"object": name, "uri": "gs://" + BUCKET + "/" + name, "generation": generation, "bytes": len(back), "sha256": sha(back), "byte_equal": True, "reused_identical_existing_generation": True}
                  else:
                      receipt = normalized_receipt(name, core.put_new(client, name, content[filename], "INPUT_DATASET_CREATE_" + filename, capture=False))
                      receipt["reused_identical_existing_generation"] = False
                  result["dataset_transfer_receipts"][filename] = receipt
              plain_path.unlink(missing_ok=True)
          
          
          def public_receipt(value):
              if not isinstance(value, dict):
                  return None
              out = {}
              name = value.get("object", value.get("name"))
              if isinstance(name, str) and name.startswith(PREFIX) and not re.search(r"[\x00-\x1f]", name):
                  out["object"] = name
              uri = value.get("uri")
              if isinstance(uri, str) and uri.startswith("gs://" + BUCKET + "/" + PREFIX) and not re.search(r"[\x00-\x1f]", uri):
                  out["uri"] = uri
              generation = str(value.get("generation", ""))
              if generation.isdigit():
                  out["generation"] = generation
              size = value.get("bytes", value.get("size_bytes"))
              if type(size) is int and size >= 0:
                  out["bytes"] = size
              digest = value.get("sha256")
              if isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest) and name != PRIVATE_KEY:
                  out["sha256"] = digest
              for key in ("byte_equal", "reused_identical_existing_generation"):
                  if type(value.get(key)) is bool:
                      out[key] = value[key]
              if value.get("ifGenerationMatch") == 0:
                  out["ifGenerationMatch"] = 0
              return out
          
          
          def public_summary(result, artifact=None):
              public = {"campaign_id": CAMPAIGN, "state": safe_code(result.get("state"), "STOPPED_BLOCKED"), "mode": safe_code(result.get("mode"), "CLOSED"), "enabled": False, "max_new": 0, "next_new_authorization": 0}
              if str(result.get("run_id", "")).isdigit():
                  public["run_id"] = str(result["run_id"])
              for key in ("driver_sha256", "runner_sha256", "request_sha256", "input_bundle_sha256", "input_public_key_sha256", "output_public_key_sha256"):
                  value = result.get(key)
                  if isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value):
                      public[key] = value
              for key in ("tuning_create_attempts", "generate_content_attempts", "new_generation_attempts"):
                  if type(result.get(key)) is int and 0 <= result[key] <= 1:
                      public[key] = result[key]
              for key in ("transfer_claim_receipt", "resume_event_receipt", "input_public_key_object_receipt", "input_private_key_receipt", "transfer_ready_receipt", "ready_receipt", "final_lock_receipt", "stop_lock_receipt", "private_raw_evidence_receipt"):
                  if key in result:
                      public[key] = public_receipt(result[key])
              for key in ("bootstrap_hashes", "verified_bootstrap_hashes"):
                  if isinstance(result.get(key), dict):
                      public[key] = {k: v for k, v in result[key].items() if k in BOOT_HASH_ENV.values() and isinstance(v, str) and re.fullmatch(r"[0-9a-f]{64}", v)}
              if isinstance(result.get("dataset_transfer_receipts"), dict):
                  public["dataset_transfer_receipts"] = {k: public_receipt(v) for k, v in result["dataset_transfer_receipts"].items() if k in INPUTS}
              pem = result.get("input_public_key_pem")
              if isinstance(pem, str) and re.fullmatch(r"-----BEGIN PUBLIC KEY-----\n[A-Za-z0-9+/=\n]+-----END PUBLIC KEY-----\n", pem):
                  public["input_public_key_pem"] = pem
              resource_re = r"projects/[A-Za-z0-9_-]+/locations/us/(?:tuningJobs|models|endpoints)/[A-Za-z0-9_@.-]+"
              name = result.get("tuning_job_name")
              if isinstance(name, str) and re.fullmatch(resource_re, name):
                  public["tuning_job_name"] = name
              job = result.get("last_job_response", result.get("create_response", {}))
              if isinstance(job, dict):
                  if isinstance(job.get("state"), str) and re.fullmatch(r"JOB_STATE_[A-Z_]+", job["state"]):
                      public["last_job_state"] = job["state"]
                  tuned = job.get("tunedModel", {})
                  for key in ("model", "endpoint"):
                      value = tuned.get(key) if isinstance(tuned, dict) else None
                      if isinstance(value, str) and re.fullmatch(resource_re, value):
                          public[key] = value
              if result.get("error"):
                  error = result["error"]
                  public["error_code"] = safe_code(error.get("reason") if isinstance(error, dict) else None)
                  if isinstance(error, dict) and type(error.get("http_status")) is int:
                      public["http_status"] = error["http_status"]
              for key in ("export_failed", "gcs_evidence_failed", "stop_lock_write_failed"):
                  if result.get(key) is True:
                      public[key] = True
              if artifact:
                  public["encrypted_artifact"] = {k: artifact[k] for k in ("filename", "sha256", "bytes", "header")}
              return public
          
          
          def credential_free(raw, token=""):
              if token and len(token) >= 12 and token.encode() in raw:
                  return False
              text = raw.decode("utf-8", errors="ignore").replace("\\n", "\n")
              patterns = [r"-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----[ \t\r\n]+(?:[A-Za-z0-9+/=][ \t\r\n]*){64,}", r"\bya29\.[A-Za-z0-9_.-]{20,}", r"\bBearer\s+[A-Za-z0-9._~+/-]{20,}", r"[?&]X-(?:Amz|Goog)-Signature=[a-fA-F0-9]{64,}"]
              return not any(re.search(p, text, re.I) for p in patterns)
          
          
          def subprocess_failure(operation, returncode, stdout, stderr, *, auth=False):
              failure = {"operation": operation, "returncode": returncode, "auth_stdout_omitted": auth}
              for label, content in (("stdout", stdout), ("stderr", stderr)):
                  if auth and label == "stdout":
                      continue  # Auth stdout can contain a bearer token, including on failure.
                  if content is None:
                      failure[label] = {"available": False}
                      continue
                  raw = content.encode("utf-8") if isinstance(content, str) else bytes(content)
                  if not credential_free(raw) or re.search(rb'(?i)(?:access_token|refresh_token|id_token|private_key)["\s:=]+["A-Za-z0-9_/-]{16,}', raw):
                      failure[label] = {"omitted": "POSSIBLE_CREDENTIAL_CONTENT"}
                      continue
                  kept = raw[:65536]
                  failure[label] = {"base64": base64.b64encode(kept).decode("ascii"), "bytes": len(raw), "sha256": sha(raw), "preserved_bytes": len(kept), "truncated": len(raw) > len(kept)}
              return failure
          
          
          def raw_evidence(client, result, request_bytes):
              records = list(getattr(client, "records", [])) if client else []
              rows = []
              for label, raw in (getattr(client, "private_raw", []) if client else []):
                  require(credential_free(raw, getattr(client, "token", "")), "CREDENTIAL_FOUND_IN_PRIVATE_HTTP_EVIDENCE")
                  rows.append({"label": label, "base64": base64.b64encode(raw).decode("ascii"), "bytes": len(raw), "sha256": sha(raw)})
              require(credential_free(enc(records), getattr(client, "token", "")), "CREDENTIAL_FOUND_IN_HTTP_RECEIPTS")
              return {"campaign_id": CAMPAIGN, "result": result, "records": records, "raw_responses": rows, "request_bytes_base64": base64.b64encode(request_bytes).decode("ascii"), "request_sha256": sha(request_bytes), "auth_headers_recorded": False, "input_private_key_recorded": False}
          
          
          def export_private(core, client, env, work, result, proofs):
              output_key = local_file(env, "OUTPUT_PUBLIC_KEY", 65536)
              require(sha(output_key.read_bytes()) == env.get("OUTPUT_PUBLIC_KEY_SHA256"), "OUTPUT_PUBLIC_KEY_SHA_MISMATCH")
              request_bytes = proofs.get("request_bytes", core.encode(core.REQUEST))
              if client and not getattr(client, "gcs_blocked", False):
                  try:
                      evidence = raw_evidence(client, result, request_bytes)
                      name = PREFIX + "_evidence/run_" + env["GITHUB_RUN_ID"] + "/RAW_HTTP.json"
                      receipt = core.put_new(client, name, enc(evidence), "PRIVATE_RAW_EVIDENCE_CREATE")
                      result["private_raw_evidence_receipt"] = normalized_receipt(name, receipt)
                  except Exception as error:
                      result["gcs_evidence_failed"] = True
                      result["gcs_evidence_error_type"] = type(error).__name__
                      result["state"] = "UNKNOWN_LOCKED" if result.get("tuning_create_attempts") else "STOPPED_BLOCKED"
              elif client:
                  result["gcs_evidence_not_attempted"] = "GCS_ALREADY_FAILED_NO_RETRY"
              evidence = raw_evidence(client, result, request_bytes)
              material = {"RESULT.json": enc(result), "RAW_HTTP.json": enc(evidence), "REQUEST.json": request_bytes, "HTTP_RECEIPTS.json": enc(getattr(client, "records", []) if client else []), "scripts/v2_transport_driver.py": Path(__file__).read_bytes()}
              if getattr(core, "__file__", None):
                  material["scripts/v2_training_runner.py"] = Path(core.__file__).read_bytes()
              material.update(proofs.get("files", {}))
              for raw in material.values():
                  require(credential_free(raw, getattr(client, "token", "") if client else ""), "CREDENTIAL_FOUND_IN_EXPORT")
              manifest = {"algorithm": "SHA-256", "self_excluded": True, "files": {k: {"bytes": len(v), "sha256": sha(v)} for k, v in material.items()}}
              material["MANIFEST_SHA256.json"] = enc(manifest)
              bundle = work / "private_evidence.zip"
              with zipfile.ZipFile(bundle, "x", zipfile.ZIP_DEFLATED) as archive:
                  for name, raw in material.items():
                      archive.writestr(name, raw)
              bundle.chmod(0o600)
              with zipfile.ZipFile(bundle) as archive:
                  require(archive.testzip() is None, "EXPORT_ZIP_CRC_FAILED")
                  for name, meta in manifest["files"].items():
                      raw = archive.read(name)
                      require(sha(raw) == meta["sha256"] and len(raw) == meta["bytes"], "EXPORT_MANIFEST_MISMATCH")
              data = bundle.read_bytes()
              header = {"campaign": CAMPAIGN, "resume_event": RESUME_ID, "purpose": "v2_output_" + env["V2_MODE"].lower() + "_" + env["GITHUB_RUN_ID"], "bundle_sha256": sha(data), "plaintext_bytes": len(data)}
              header_path = work / "output_header.json"
              new_file(header_path, enc(header))
              encrypted = Path(env["RUNNER_TEMP"]) / "v2_execution_encrypted.json"
              call_crypto(env, "encrypt", output_key, bundle, encrypted, header_path)
              encrypted_raw = encrypted.read_bytes()
              return {"filename": encrypted.name, "sha256": sha(encrypted_raw), "bytes": len(encrypted_raw), "header": header}
          
          
