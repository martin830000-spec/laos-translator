name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  r3-atomic-close:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    needs: v2-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      R3_MODE: "CLOSE_ONLY"
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: R3 atomically create and verify final closed lock (zero model calls)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,subprocess,json,hashlib,sys
          from datetime import datetime,timezone
          bucket='ko-lao-gemini35-tuning-460077888071'
          prefix='sft_fourpath_baseline96_r3_20261121/'
          object_name=prefix+'_control/FINAL_STATE.json'
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True,stderr=subprocess.DEVNULL,timeout=30).strip()
          head={'Authorization':'Bearer '+token,'Accept':'application/json'}
          def call(method,url,data=None,ctype=None):
           h=head.copy()
           if ctype:h['Content-Type']=ctype
           request=urllib.request.Request(url,headers=h,method=method,data=data)
           try:
            with urllib.request.urlopen(request,timeout=40) as r:return r.status,r.read(1000000)
           except urllib.error.HTTPError as e:return e.code,e.read(1000000)
           except Exception as e:raise RuntimeError('UNKNOWN_TRANSPORT_NO_RETRY_'+type(e).__name__)
          def digest(b):return hashlib.sha256(b).hexdigest()
          list_url='https://storage.googleapis.com/storage/v1/b/'+bucket+'/o?'+urllib.parse.urlencode({'prefix':prefix,'maxResults':100})
          status,raw=call('GET',list_url)
          if status!=200 or json.loads(raw).get('items'):raise RuntimeError('R3_PREFIX_COLLISION_OR_READ_FAILURE_'+str(status))
          body={
           'campaign_id':'GEMINI35_FOURPATH_BASELINE96_R3_20261121',
           'state':'STOPPED_CURRENT_MODEL_IDENTITY_NOT_VERIFIED_CLOSED_LOCKED_RESTORE_PENDING',
           'reason':'CURRENT_TUNED_DEPLOYED_MODEL_VERSION_NOT_VERIFIED_GET403',
           'enabled':False,'max_new':0,'next_new_authorization':0,
           'actual_generateContent_attempts':0,'actual_base_attempts':0,'actual_realdb84_attempts':0,
           'unused_authorization_closed':96,'model_generation_cost_usd_estimated':0,
           'checkpoint_drive_file_id':'1m3LjLAINx58lliENi5GR47V1iZvERzpV',
           'checkpoint_sha256':'85e02505cec9413816a4dfb1ae062720fbb532f1ba2cdaa159f3586272b6aa3c',
           'workorder_sha256':'d1a627872786e3cbb9076defe9ec959303e146317f54ad9fadc5338ce961d7af',
           'protected22_verified':22,'verified_github_run':44863328937,
           'technical_model_diagnostic_github_run':44863194691,
           'service_changes':0,'historical_protected_lock_mutations':0,
           'created_utc':datetime.now(timezone.utc).isoformat()
          }
          payload=(json.dumps(body,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n').encode()
          url='https://storage.googleapis.com/upload/storage/v1/b/'+bucket+'/o?'+urllib.parse.urlencode({'uploadType':'media','name':object_name,'ifGenerationMatch':'0'})
          print('R3_LOCK_SEND_STARTED '+json.dumps({'target':object_name,'bytes':len(payload),'sha256':digest(payload),'condition':'ifGenerationMatch=0','model_calls':0}),flush=True)
          status,raw=call('POST',url,payload,'application/json; charset=utf-8')
          if status not in (200,201):
           print('R3_LOCK_CREATE_REJECTED '+json.dumps({'http':status,'response_sha256':digest(raw)}))
           raise RuntimeError('R3_CREATE_ONLY_FAILED_NO_RETRY')
          resp=json.loads(raw);generation=str(resp['generation'])
          meta_url='https://storage.googleapis.com/storage/v1/b/'+bucket+'/o/'+urllib.parse.quote(object_name,safe='')
          s2,raw2=call('GET',meta_url+'?fields=name%2Csize%2Cgeneration')
          s3,raw3=call('GET',meta_url+'?'+urllib.parse.urlencode({'alt':'media','generation':generation}))
          if s2!=200 or s3!=200:raise RuntimeError('R3_READBACK_ERROR')
          meta=json.loads(raw2)
          assert meta['name']==object_name and str(meta['generation'])==generation and int(meta['size'])==len(payload)
          assert raw3==payload and json.loads(raw3)==body
          print('R3_FINAL_LOCK_VERIFIED '+json.dumps({'http_create':status,'generation':generation,'size':len(payload),'sha256':digest(raw3),'metadata_sha256':digest(raw2),'enabled':body['enabled'],'max_new':body['max_new'],'next_new_authorization':0,'unused_closed':96,'readback':'PASS','model_calls':0},sort_keys=True),flush=True)
          
          PY
