name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  realdb84-resume:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DB84_MODE: "PREFLIGHT"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "b093519e11cc3737fca1c445b02d992e445b3e31ecd457fd5b116c637a54e817"
      RESUME_WORKORDER_SHA256: "65de4ff88752fad622da16f8a5f194004a4b6f3a241276530c43f60fff642e48"
      OWNER_LOCAL_REVIEW_OK: "true"
      OWNER_LOCAL_REVIEW_SHA256: "7e1be7af1cb4ba97ca3d005afe65869739d3c9c2d4b7e9887014ca646736b256"
      BOOTSTRAP_WORK_RECOVERY_OK: "true"
      BOOTSTRAP_WORK_RECOVERY_SHA256: "e7119d2aa2007dade09459679d78c68f20dc91c8faa18b92b2eaa3a9eaad1d79"
      OWNER_LOADER_SHA256: "38b84a980320234f49a6fe31bcae11882e32d1eb4a50df87dd9b3bca1e1e95a2"
      TRANSPORT_COMMON_SHA256: "2bc5ca8e8306a0977c17cdcb9d3f6d8fe7f0b5f5363dc57de37f1e076c7181e8"
      PREFLIGHT_SCRIPT_SHA256: "37c8cb969b45fa5c3569f98547de306348b4c5f3de390c0ac9a2989910e6a089"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "4176de932d755df19931c3b533a8acc7200aec9ed7358460af1bf412af6fa51e"
      BOOTSTRAP_RECEIPTS_SHA256: "0d33124989a3b662202e78a2d90b42123269b9082cd7c3d4fba485574708d395"
      INPUT_PROBE_ENVELOPE_SHA256: "0b79fc195e47a148088bb9553fe96357dda48916fe335f2306433f7ec147dc3d"
      OWNER_ENVELOPE_SHA256: "6668b9fc8c59e3788c3cee78445b6129b018bbc0ce72b0584f7b2712aa0c8338"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run reviewed DB84 PREFLIGHT
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'DB84_FILES'
          import base64,hashlib,os
          from pathlib import Path
          files = {'realdb84_preflight.py': '', 'resume_transport_common.py': '', 'resume_owner_loader.py': '', 'transport_crypto.mjs': '', 'output_public.pem': '', 'bootstrap_receipts.json': '', 'input_probe.envelope.json': '', 'owner.envelope.json': ''}
          hashes = {'realdb84_preflight.py': '37c8cb969b45fa5c3569f98547de306348b4c5f3de390c0ac9a2989910e6a089', 'resume_transport_common.py': '2bc5ca8e8306a0977c17cdcb9d3f6d8fe7f0b5f5363dc57de37f1e076c7181e8', 'resume_owner_loader.py': '38b84a980320234f49a6fe31bcae11882e32d1eb4a50df87dd9b3bca1e1e95a2', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'output_public.pem': '4176de932d755df19931c3b533a8acc7200aec9ed7358460af1bf412af6fa51e', 'bootstrap_receipts.json': '0d33124989a3b662202e78a2d90b42123269b9082cd7c3d4fba485574708d395', 'input_probe.envelope.json': '0b79fc195e47a148088bb9553fe96357dda48916fe335f2306433f7ec147dc3d', 'owner.envelope.json': '6668b9fc8c59e3788c3cee78445b6129b018bbc0ce72b0584f7b2712aa0c8338'}
          for name,value in files.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==hashes[name]
              p=Path(os.environ['RUNNER_TEMP'])/name
              with p.open('xb') as f:
                  f.write(raw)
                  f.flush()
                  os.fsync(f.fileno())
              p.chmod(0o600)
          DB84_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export BOOTSTRAP_RECEIPTS="$RUNNER_TEMP/bootstrap_receipts.json"
          export INPUT_PROBE_ENVELOPE="$RUNNER_TEMP/input_probe.envelope.json"
          export OWNER_ENVELOPE="$RUNNER_TEMP/owner.envelope.json"
          python3 "$RUNNER_TEMP/resume_owner_loader.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: realdb84-resume-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/realdb84_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
