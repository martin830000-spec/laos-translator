name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  cause220:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      CAUSE220_MODE: "POSTSTOP_VERIFY"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "365b600d8d342ffb4f454b12a5bd1815962de698b45fa758c9a299d336af9ad2"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "9aaa94d7c34cf407d5748f9c067d9cc3549e40c8222cf62ad4ebff049c972094"
      RUNNER_SHA256: "0d2ffd3cf942838629b2f88411625b1471e390982e262f897ef19d3d3ae76702"
      POSTSTOP_SCRIPT_SHA256: "17f1a2b64ad9bc5b0868b2b839a80141cbfb06ede7fd2fe53bef9bb99b9541bd"
      DRY_READY_SHA256: "6a4b64840c60bc15d25ff5c5657b3a7505d6f2d86f689023d6d0056529001683"
      PACKET_SHA256: "cd6fe39fa026c0a07441faa6ef3d03edd790e25d1ea8f673459e062a301aa275"
      PREFLIGHT_READY_SHA256: "a7e6ce95e79af499768f46ac46b85581d90e88637be5efc5c076eb8201d68dda"
      ROUNDTRIP_VERIFIED_SHA256: "2cb213d5b45004e6a4843ef95f5b2c8783d2d9d14a6d316a725d28cac6540936"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run bounded CAUSE220 mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64, hashlib, os
          from pathlib import Path
          files = {'poststop_verify.py': '', 'transport_crypto.mjs': '', 'output_public.pem': '', 'cause220_runner.py': '', 'INPUT_ENVELOPE.json': '', 'INPUT_HEADER.json': '', 'ROUNDTRIP_VERIFIED.json': ''}
          hashes = {'poststop_verify.py': '17f1a2b64ad9bc5b0868b2b839a80141cbfb06ede7fd2fe53bef9bb99b9541bd', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'output_public.pem': '9aaa94d7c34cf407d5748f9c067d9cc3549e40c8222cf62ad4ebff049c972094', 'cause220_runner.py': '0d2ffd3cf942838629b2f88411625b1471e390982e262f897ef19d3d3ae76702', 'INPUT_ENVELOPE.json': '3a49d837431b3cbee312a83e965a6bf4ada55e4e6ee8f8318363e0996cfb170a', 'INPUT_HEADER.json': '9db5cc13124e1e70e3fee5845de30d6594525a86326321d01ac24d63348a87e6', 'ROUNDTRIP_VERIFIED.json': '2cb213d5b45004e6a4843ef95f5b2c8783d2d9d14a6d316a725d28cac6540936'}
          for name, value in files.items():
              raw = base64.b64decode(value, validate=True)
              assert hashlib.sha256(raw).hexdigest() == hashes[name]
              p = Path(os.environ['RUNNER_TEMP']) / name
              with p.open('xb') as f: f.write(raw)
              p.chmod(0o600)
          PYCODE
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export INPUT_ENVELOPE="$RUNNER_TEMP/INPUT_ENVELOPE.json"
          export INPUT_HEADER="$RUNNER_TEMP/INPUT_HEADER.json"
          export ROUNDTRIP_VERIFIED="$RUNNER_TEMP/ROUNDTRIP_VERIFIED.json"
          python3 "$RUNNER_TEMP/poststop_verify.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cause220-poststop_verify-${{ github.run_id }}
          path: ${{ runner.temp }}/cause220_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
