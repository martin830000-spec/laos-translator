name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  stream24-main:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      S24_STAGE: "MAIN"
      ENABLE_GENERATION: "true"
      ENABLE_TUNING: "false"
      S24_EXPECTED_CIPHER_SHA: "e5192c75242445eeb780ff77be5f0cf022d961e08f7b971f9f4c374e07ab614c"
      S24_EXPECTED_BOOT_GENERATION: "1795268781658217"
      S24_EXPECTED_BOOT_SHA: "c8d1ac82a0e8a2bf16cddcd33e91458bc7f83bf01e43e326fef15dbfef7fceba"
      S24_EXPECTED_KEY_GENERATION: "1795268781206295"
      S24_EXPECTED_KEY_SHA: "f0c644566867e9c3b59093139fc8487a1d77474452b937e6f4c758739370b28f"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: SHA and repeat normal/optimized SSE safety tests before exact MAIN continuation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'ac76ad213cce6eb672685c3017c8226d3e8a2f5e2f5081526f1a283049f36e6f  .github/s24_runner.py' | sha256sum -c -
          echo '1963cb172cb195f7edf2709021909e09eb221e528f8a0fbf7d91b2a34eac782f  .github/s24_gcs_base.py' | sha256sum -c -
          echo '64e1bec21b9f78e1d2194a32455cb1b54f72898f38ff76069421efc9296a8057  .github/PUBLIC_FREEZE.json' | sha256sum -c -
          echo 'f1be1ba589f2aaf2649750ccaea23a3ba14b73441de47767a007f82527e56f01  .github/PINS28.json' | sha256sum -c -
          echo '86e3edab142f09dffde902c8bc0994d1703073387852cc9a7684c8daa3e18550  .github/PRIVATE_FREEZE.cms.b64' | sha256sum -c -
          echo '9a4cf8658d56c3e90ff53e268f729212864a4e626a59a68b745d3280eedf6696  .github/OUTPUT_OWNER_PUBLIC.crt' | sha256sum -c -
          python3 .github/s24_runner.py TEST
          python3 -O .github/s24_runner.py TEST
      - name: Authorized remaining STREAM24 MAIN up to 20 slots from frozen plan, no retries
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export S24_OUTPUT_CMS="$RUNNER_TEMP/stream24_main_owner.cms.p7m"
          python3 .github/s24_runner.py MAIN
          test -s "$RUNNER_TEMP/stream24_main_owner.cms.p7m"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: stream24-main-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/stream24_main_owner.cms.p7m
          retention-days: 7
          if-no-files-found: warn
