name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  r2-postclose-suffix-free-audit:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      R2_SUFFIX_ONLY: "true"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify missing stage status and 165-object inventory with strict remaining GCS budget
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo '3d0c943188071ee3bed950585a61cbc99b16bfa64ece5be2948fa7d945ad9228  .github/r2_final_suffix_audit.py' | sha256sum -c -
          echo '23f9518050f7d44fd47bebb87f4b4663821437c067ec0b94253a846bac96b8f1  .github/r2_postclose_audit_public.json' | sha256sum -c -
          python3 .github/r2_final_suffix_audit.py TEST
          python3 -O .github/r2_final_suffix_audit.py TEST
          export R2_SUFFIX_OUTPUT="$RUNNER_TEMP/r2_suffix_public_receipt.json"
          python3 .github/r2_final_suffix_audit.py
          test -s "$RUNNER_TEMP/r2_suffix_public_receipt.json"
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: hydrogen64-r2-final-readonly-suffix-${{ github.run_id }}
          path: ${{ runner.temp }}/r2_suffix_public_receipt.json
          retention-days: 7
          if-no-files-found: error
