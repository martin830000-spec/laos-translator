name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  ab1712-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      AB1712_MODE: "RUN"
      AB1712_STAGE: "S1D"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "09e4115f313f43e53e4dab053de40452137b626d14e9ad3a78e21a3cae68328b"
      OWNER_REVIEW_SHA256: "7db1dbaebb1b863ccb4b30bb86be50cc661ffe4ce42892262d097c30c710d7f9"
      OWNER_REVIEW_EXPECTED_SHA256: "7db1dbaebb1b863ccb4b30bb86be50cc661ffe4ce42892262d097c30c710d7f9"
      COMMON_SCRIPT_SHA256: "b53e2b20040945d1913a04f8a2cb9fbe28ae3915bac1052283e3960f58b82ed9"
      ENTRY_SCRIPT_SHA256: "7db1dbaebb1b863ccb4b30bb86be50cc661ffe4ce42892262d097c30c710d7f9"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "20405157aaed5afdd427d51a9bd5e4ca8882d0a93a61a3797a6a86375b67931d"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded AB1712 S1D
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'AB1712_FILES'
          import os,base64,hashlib
          from pathlib import Path
          files={'ab_input_verify.py': '', 'transport_crypto.mjs': '', 'ab_finalize.py': '', 'ab_run.py': '', 'ab_common.py': '', 'ab_bootstrap.py': '', 'ab_previous.py': '', 'output_public.pem': '', 'run_config.json': ''}
          hashes={'ab_input_verify.py': 'f1bba5b59b3e5ad079a226c8a336799d80d6e1f3853d2a4fe55fc169be2c1229', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'ab_finalize.py': '67aeab11e5e4bd9576c10afbc6ed51f0997fe7276317fa52f65f302e3225be39', 'ab_run.py': '7db1dbaebb1b863ccb4b30bb86be50cc661ffe4ce42892262d097c30c710d7f9', 'ab_common.py': 'b53e2b20040945d1913a04f8a2cb9fbe28ae3915bac1052283e3960f58b82ed9', 'ab_bootstrap.py': '9cde117e9121840e50e3e46bc295e690fc70aefacd2599253a708e034a55b221', 'ab_previous.py': 'b4f32a03dce916085a25821e4fb117dfe0d6f8cc4aaf56e87771e62a3e04ff39', 'output_public.pem': '20405157aaed5afdd427d51a9bd5e4ca8882d0a93a61a3797a6a86375b67931d', 'run_config.json': '6b80d537edca0afcb2b8ce6a5d52d21d3bf0384f1a028f6a84a068c32277967b'}
          for n,v in files.items():
           b=base64.b64decode(v,validate=True); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          AB1712_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/ab_run.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ab1712-s1d-${{ github.run_id }}
          path: ${{ runner.temp }}/ab1712_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
