name: G35 D2R fixed FIRST BACK AB128 existing TEST CLOSE
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: g35-d2r-back-ab128-20261125
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Materialize CMS-only input and frozen runner
        env:
          BUNDLE_PART_0: ""
          BUNDLE_PART_1: ""
          BUNDLE_PART_2: ""
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PYBUNDLE'
          import base64,hashlib,io,os,pathlib,zipfile
          blob=base64.b64decode(os.environ["BUNDLE_PART_0"]+os.environ["BUNDLE_PART_1"]+os.environ["BUNDLE_PART_2"])
          if hashlib.sha256(blob).hexdigest()!='28a0b8024792e371b49b1cd8570abbaaeb37fd09ad3adaff53dd977beadaab8a':raise RuntimeError('BUNDLE_TAMPER')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'g35-d2r-back-ab128'
          dest.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              if z.testzip() is not None:raise RuntimeError('BUNDLE_CRC')
              names=z.namelist()
              if len(names)!=10 or any('/' in x or '..' in x or x.startswith('.') for x in names):raise RuntimeError('BUNDLE_MEMBER_SCOPE')
              z.extractall(dest)
          print('BUNDLE_OK_CMS_ONLY',len(names))
          PYBUNDLE
      - name: Compile and check no paid calls in free phase
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$RUNNER_TEMP/g35-d2r-back-ab128/runner.py" "$RUNNER_TEMP/g35-d2r-back-ab128/transport.py" "$RUNNER_TEMP/g35-d2r-back-ab128/test_runner.py"
          test "${ENABLE_GENERATION}" = "false"
      - name: Authenticate existing TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Configure existing gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run frozen scoped CLOSE gate
        env:
          RESULT_DIR: ${{ runner.temp }}/g35-d2r-back-ab128/evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python "$RUNNER_TEMP/g35-d2r-back-ab128/runner.py" CLOSE
      - name: Upload encrypted owner evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g35-d2r-back-ab128-CLOSE-${{ github.run_id }}
          path: ${{ runner.temp }}/g35-d2r-back-ab128/evidence/evidence.p7m
          if-no-files-found: warn
          retention-days: 7
