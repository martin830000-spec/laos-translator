name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  r3chain-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      R3CHAIN_MODE: "RUN"
      R3CHAIN_STAGE: "A03"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "30ce1f934c60bd8481f8cdfc98811aa42d7dfb828ffbcd6cbfa0d4a6bf8f1244"
      OWNER_REVIEW_SHA256: "e96ba0c5ea5b7b1265cd7e06fc5ee4f1064cd79960933bb650088d4c25f4bb00"
      OWNER_REVIEW_EXPECTED_SHA256: "e96ba0c5ea5b7b1265cd7e06fc5ee4f1064cd79960933bb650088d4c25f4bb00"
      COMMON_SCRIPT_SHA256: "8ed88794ea060d069de352940ab60cbe8216e1857086ca79951a340e11bb0624"
      ENTRY_SCRIPT_SHA256: "e96ba0c5ea5b7b1265cd7e06fc5ee4f1064cd79960933bb650088d4c25f4bb00"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "ebbc4d875dd37dbadcac37eafe5b35be1e6b317d77481c7ba1630d8e3e4819d5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded R3CHAIN A03
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'R3CHAIN_FILES'
          import os,base64,hashlib
          from pathlib import Path
          files={'ab_input_verify.py': '', 'transport_crypto.mjs': '', 'ab_finalize.py': '', 'ab_run.py': '', 'ab_common.py': '', 'ab_bootstrap.py': '', 'ab_previous.py': '', 'output_public.pem': '', 'run_config.json': ''}
          hashes={'ab_input_verify.py': '291e0212e96484e8096171205831f1144de342bcd09635ab8a02d8c8d3005cbb', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'ab_finalize.py': 'd4461943fe4c6014cd03c519a6a12517e4638cc7c883df603275422e4810a27d', 'ab_run.py': 'e96ba0c5ea5b7b1265cd7e06fc5ee4f1064cd79960933bb650088d4c25f4bb00', 'ab_common.py': '8ed88794ea060d069de352940ab60cbe8216e1857086ca79951a340e11bb0624', 'ab_bootstrap.py': '9e69c4e6f52162e7f12b7f4624eb286c28b0b7e28bcc0a71ebbd66f79bf11fd5', 'ab_previous.py': 'fb9235ff3215c2547a79dda779bd4714fc1ab79e4b101415d433d6169953c3b4', 'output_public.pem': 'ebbc4d875dd37dbadcac37eafe5b35be1e6b317d77481c7ba1630d8e3e4819d5', 'run_config.json': 'e1dfe7746bba52dc3d7d8b9276a6c5bff471a0f5850011b6c3996f9e883c3b67'}
          for n,v in files.items():
           b=base64.b64decode(v,validate=True); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          R3CHAIN_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/ab_run.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: r3chain-a03-${{ github.run_id }}
          path: ${{ runner.temp }}/r3chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
