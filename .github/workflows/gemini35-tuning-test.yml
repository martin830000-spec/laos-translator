name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  r2-dev-recovery-readonly:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      R2_RECOVER_DEV: "true"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: SHA and zero-generation tests then 32 recorded DEV GCS payloads GET-only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'd86a313f2049cc2ce2dd9d90592d24b60b0b133949fc0193f98fca9804f39b63  .github/r2_dev_readonly_recover.py' | sha256sum -c -
          echo '8ed2af7e2e69913e61654ee3a9c18cae4ee03699a00f449335c6a521dcb8d9c4  .github/r2_paid_runner.py' | sha256sum -c -
          echo '80afd411fad6c798146a75131b25a41fa2152451bca485de8b4eb18ecc8a6b22  .github/pins27.json' | sha256sum -c -
          python3 .github/r2_dev_readonly_recover.py TEST
          python3 -O .github/r2_dev_readonly_recover.py TEST
          export R2_RECOVERY_OUTPUT="$RUNNER_TEMP/r2_dev_recovered.cms.p7m"
          export R2_PUBLIC_RECOVERY_RECEIPT="$RUNNER_TEMP/r2_dev_recovery_public.json"
          python3 .github/r2_dev_readonly_recover.py
          test -s "$RUNNER_TEMP/r2_dev_recovered.cms.p7m"
          test -s "$RUNNER_TEMP/r2_dev_recovery_public.json"
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: hydrogen64-r2-dev-recovered-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2_dev_recovered.cms.p7m
            ${{ runner.temp }}/r2_dev_recovery_public.json
          retention-days: 7
          if-no-files-found: error
