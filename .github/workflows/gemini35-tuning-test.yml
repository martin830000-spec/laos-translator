      - name: Independent GET-only audit, no model key or generation
        env:
          ENABLE_GENERATION: "false"
          OWNER_CMS_PATH: ${{ runner.temp }}/apiroute48_owner.p7m
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/apiroute48"
          python -O audit_only.py
      - name: Preserve owner encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apiroute48-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/apiroute48_owner.p7m
          if-no-files-found: warn
          retention-days: 3
