name: TEST public JOSE library synthetic-only review
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-tuning-test-jose-synthetic
  cancel-in-progress: false
jobs:
  synthetic-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - name: Obtain public dependency wheels and check exact versions and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$ENABLE_GENERATION" = false
          test "$ENABLE_TUNING" = false
          python -m venv "$RUNNER_TEMP/jose-review-venv"
          V="$RUNNER_TEMP/jose-review-venv/bin/python"
          mkdir -p "$RUNNER_TEMP/public-jose-wheelhouse"
          "$V" -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --index-url https://pypi.org/simple --dest "$RUNNER_TEMP/public-jose-wheelhouse" jwcrypto==1.6.2 cryptography==46.0.4 typing_extensions==4.16.0 cffi==2.0.0 pycparser==3.0
          "$V" - <<'PY'
          import pathlib, hashlib, json, os, urllib.request, zipfile, email
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          wheelhouse=base/'public-jose-wheelhouse'
          pins={'jwcrypto':'1.6.2','cryptography':'46.0.4','typing-extensions':'4.16.0','cffi':'2.0.0','pycparser':'3.0'}
          seen=set(); lines=[]
          for f in sorted(wheelhouse.glob('*.whl')):
              with zipfile.ZipFile(f) as z:
                  files=[n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
                  if len(files)!=1: raise RuntimeError('WHEEL_METADATA')
                  meta=email.message_from_bytes(z.read(files[0]))
              name=meta['Name'].lower().replace('_','-'); version=meta['Version']
              if name in seen or pins.get(name)!=version: raise RuntimeError('VERSION_PIN')
              seen.add(name)
              digest=hashlib.sha256(f.read_bytes()).hexdigest()
              with urllib.request.urlopen('https://pypi.org/pypi/'+name+'/'+version+'/json',timeout=20) as r:
                  published=json.load(r)
              matching=[u for u in published['urls'] if u['filename']==f.name and not u.get('yanked')]
              if len(matching)!=1 or matching[0]['digests']['sha256']!=digest: raise RuntimeError('PYPI_HASH_MISMATCH')
              if name=='jwcrypto' and digest!='3fb14515fd2ee51cb35842154d358cc15138219c1e829e97ab510066e74dc464': raise RuntimeError('INDEPENDENT_JWCRYPTO_PIN')
              lines.append(name+'=='+version+' --hash=sha256:'+digest)
              print('PUBLIC_WHEEL_PIN',name,version,f.name,digest,flush=True)
          if seen!=set(pins): raise RuntimeError('INCOMPLETE_WHEEL_SET')
          (base/'jose-requirements.txt').write_text('\n'.join(lines)+'\n')
          PY
          "$V" -m pip install --disable-pip-version-check --no-index --find-links "$RUNNER_TEMP/public-jose-wheelhouse" --require-hashes -r "$RUNNER_TEMP/jose-requirements.txt"
          "$V" -m pip check
      - name: Run exact non-sensitive review adapter with ephemeral synthetic keys
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          V="$RUNNER_TEMP/jose-review-venv/bin/python"
          mkdir -p "$RUNNER_TEMP/jose-review"
          cd "$RUNNER_TEMP/jose-review"
          "$V" - <<'PY'
          import base64, hashlib, io, pathlib, zipfile
          # This archive contains only the two public generic review Python source files.
          raw=base64.b64decode('',validate=True)
          if hashlib.sha256(raw).hexdigest()!='e5c3eb56948385d2a2743302d39681a92571a80c69563f7fe8ca40dbf8c7dcb4': raise RuntimeError('REVIEW_ARCHIVE_PIN')
          pins={'input_jwe_review.py':'b297e65b021d64f6d55abe9297f3dfe1244976f6a3fb4c06549991b32cb009e8','test_input_jwe_review.py':'6da13222cd9de5a27413418d33aee9b42f11b3832ac25114aefbaac50980e1e6'}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if set(z.namelist())!=set(pins) or z.testzip() is not None: raise RuntimeError('REVIEW_ARCHIVE_INVALID')
              for n,h in pins.items():
                  b=z.read(n)
                  if hashlib.sha256(b).hexdigest()!=h: raise RuntimeError('SOURCE_PIN')
                  pathlib.Path(n).write_bytes(b)
          print('REVIEW_SOURCE_PINS_OK')
          PY
          "$V" test_input_jwe_review.py
          "$V" -O test_input_jwe_review.py
          echo 'SYNTHETIC_ONLY MODEL_POSTS=0 GCS_WRITES=0 NO_CLOUD_AUTH'
      - name: Return only already-public verified dependency wheels
        uses: actions/upload-artifact@v4
        with:
          name: public-jose-dependency-wheels
          path: ${{ runner.temp }}/public-jose-wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1
