name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  r3-free-readonly:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      V2_MODE: "CLOSED"
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: R3 free read-only model identity and R3 duplicate inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import subprocess, urllib.request, urllib.parse, urllib.error, json, hashlib, datetime
          assert __import__('os').environ.get('ENABLE_GENERATION')=='false'
          def check(u, method='GET', body=None):
              tok=subprocess.check_output(['gcloud','auth','print-access-token'],text=True,stderr=subprocess.DEVNULL,timeout=25).strip()
              headers={'Authorization':'Bearer '+tok,'Accept':'application/json'}
              if body is not None: headers['Content-Type']='application/json'
              assert method=='GET' or (method=='POST' and u.endswith(':testIamPermissions'))
              q=urllib.request.Request(u,headers=headers,method=method,data=body)
              try:
                  with urllib.request.urlopen(q,timeout=25) as r: status=r.status;raw=r.read(500000)
              except urllib.error.HTTPError as e:status=e.code;raw=e.read(500000)
              except Exception as e:
                  print('R3_DIAG '+json.dumps({'endpoint':u.split('/v1/')[-1].split(':')[0],'transport':type(e).__name__}));return
              try:j=json.loads(raw)
              except Exception:j={}
              row={'http':status,'raw_sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              if status==200:
                  if 'tuningJobs/' in u:row.update(state=j.get('state'),baseModel=j.get('baseModel'),tuned=j.get('tunedModel'))
                  elif '/endpoints/' in u and method=='GET':row.update(name=j.get('name'),deployedModels=[{'model':m.get('model'),'modelVersionId':m.get('modelVersionId')} for m in j.get('deployedModels',[])])
                  elif ':testIamPermissions' in u:row['permissions']=j.get('permissions',[])
                  elif '/models/' in u:row['name']=j.get('name')
                  elif 'storage.googleapis.com' in u:row['items_count']=len(j.get('items',[]));row['names']=[x.get('name') for x in j.get('items',[])[:3]]
              else:
                  e=j.get('error',{})
                  row.update(status=e.get('status'),permission='aiplatform.endpoints.get' if b'aiplatform.endpoints.get' in raw else '',reason=e.get('details',[{}])[0].get('reason','') if isinstance(e.get('details'),list) and e.get('details') else '')
              print('R3_DIAG '+json.dumps({'target':u.split('/v1/')[-1].split('?')[0],**row},ensure_ascii=False,sort_keys=True))
          r='https://aiplatform.us.rep.googleapis.com/v1/projects/460077888071/locations/us/'
          check(r+'tuningJobs/8093374250175430656')
          check(r+'endpoints/1638501023804817408')
          check(r+'models/4774448923710324736@1')
          check(r+'endpoints/1638501023804817408:testIamPermissions','POST',json.dumps({'permissions':['aiplatform.endpoints.get','aiplatform.endpoints.predict']}).encode())
          p='https://storage.googleapis.com/storage/v1/b/ko-lao-gemini35-tuning-460077888071/o?'+urllib.parse.urlencode({'prefix':'sft_fourpath_baseline96_r3_20261121/','maxResults':100})
          check(p)
          PY
