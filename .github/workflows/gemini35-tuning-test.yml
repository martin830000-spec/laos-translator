name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  realdb84-repeat448:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      REPEAT448_MODE: "RUN"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "a200f71c761fd76cdde722a01aa0c05c80ea92bbc32251a6a506ae8277062093"
      OWNER_REVIEW_SHA256: "b442ee412a90bd6bf4c523a3bc98dfccb5adcc181ab9ab1a2200315564cd6815"
      OWNER_REVIEW_EXPECTED_SHA256: "b442ee412a90bd6bf4c523a3bc98dfccb5adcc181ab9ab1a2200315564cd6815"
      OFFLINE_CORE_SHA256: "4f58174a14a15924f687d4db379e2061dafbf5948a5f3e7eb0cdeea19cdb74b5"
      RUNNER_MAIN_SHA256: "937b9b72d8dd6fb9b7723a4205db3a9ab5d4a81ba55ba44b470c6510badba00a"
      RUNNER_ENGINE_SHA256: "1f99cc802c570575bdb567ff123c16d34648910cbf7acdc2854149d410afe53b"
      COMMON_SCRIPT_SHA256: "dbd412801b4769fa0f95747930548add9c69da2c9f94ad2b9df6e11bdf2e9820"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "db1167e0f1da92f62180a8825de7a28578c257ed75da10f1f8f117bd2b6ab118"
      KNOWN_FREE_OBJECTS_SHA256: "4883c00aa67d4ca45253fbb82b8764b9805d81ba84fe6e719502900af2bce333"
      GENERATION_BUNDLE_RECEIPT_SHA256: "6a03a53a4add417c5d1fe66a4adef724bad49b452cca25deeeec75a2173bad13"
      INPUT_VERIFIED_RECEIPT_SHA256: "b57f4ebe641e0866d50c4badea15d49a6a0f0c11ab260ea5732353e81508b882"
      RUN_GATES_SHA256: "da83b3cc8832a5cb6924c3864288ad246d7bb17a0759541464ef61d50504db13"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run reviewed REPEAT448 RUN
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'REPEAT448_FILES'
          import base64,hashlib,os
          from pathlib import Path
          files = {'repeat448_engine.py': '', 'repeat448_generate.py': '', 'repeat448_common.py': '', 'transport_crypto.mjs': '', 'offline_core.py': '', 'output_public.pem': '', 'known_free_objects.json': '', 'generation_bundle_receipt.json': '', 'input_verified_receipt.json': '', 'run_gates.json': ''}
          hashes = {'repeat448_engine.py': '1f99cc802c570575bdb567ff123c16d34648910cbf7acdc2854149d410afe53b', 'repeat448_generate.py': '937b9b72d8dd6fb9b7723a4205db3a9ab5d4a81ba55ba44b470c6510badba00a', 'repeat448_common.py': 'dbd412801b4769fa0f95747930548add9c69da2c9f94ad2b9df6e11bdf2e9820', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'offline_core.py': '4f58174a14a15924f687d4db379e2061dafbf5948a5f3e7eb0cdeea19cdb74b5', 'output_public.pem': 'db1167e0f1da92f62180a8825de7a28578c257ed75da10f1f8f117bd2b6ab118', 'known_free_objects.json': '4883c00aa67d4ca45253fbb82b8764b9805d81ba84fe6e719502900af2bce333', 'generation_bundle_receipt.json': '6a03a53a4add417c5d1fe66a4adef724bad49b452cca25deeeec75a2173bad13', 'input_verified_receipt.json': 'b57f4ebe641e0866d50c4badea15d49a6a0f0c11ab260ea5732353e81508b882', 'run_gates.json': 'da83b3cc8832a5cb6924c3864288ad246d7bb17a0759541464ef61d50504db13'}
          for name,value in files.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==hashes[name]
              p=Path(os.environ['RUNNER_TEMP'])/name
              with p.open('xb') as f:
                  f.write(raw)
                  f.flush()
                  os.fsync(f.fileno())
              p.chmod(0o600)
          REPEAT448_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export KNOWN_FREE_OBJECTS="$RUNNER_TEMP/known_free_objects.json"
          export GENERATION_BUNDLE_RECEIPT="$RUNNER_TEMP/generation_bundle_receipt.json"
          export INPUT_VERIFIED_RECEIPT="$RUNNER_TEMP/input_verified_receipt.json"
          export RUN_GATES="$RUNNER_TEMP/run_gates.json"
          python3 "$RUNNER_TEMP/repeat448_generate.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: realdb84-repeat448-run-${{ github.run_id }}
          path: ${{ runner.temp }}/repeat448_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
