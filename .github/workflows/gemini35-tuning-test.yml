name: Gemini 3.5 V2 Recovery Readonly Preflight
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      REMOTE_PREFLIGHT_MODE: "PREFLIGHT"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.REMOTE_PREFLIGHT_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.REMOTE_PREFLIGHT_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.REMOTE_PREFLIGHT_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Read remote campaign evidence without creation capability
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/remote_preflight.py" <<'V2_RECOVERY_EMBED_0_END'
          """Read-only V2 remote preflight; every authenticated cloud request is GET.
          
          Derived from the verified PILOT1 one-request transport and AB144 private export.
          This module cannot create tuning jobs, upload GCS objects, or call inference.
          Only an encrypted evidence envelope is suitable for a public Actions artifact.
          """
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          CAMPAIGN = "GEMINI35_SFT_V2_PILOT1_20261116"
          PROJECT = "gen-lang-client-0422436907"
          PROJECT_NUMBER = "460077888071"
          BUCKET = "ko-lao-gemini35-tuning-460077888071"
          PREFIX = "sft_v2_pilot1_20261116/"
          DISPLAY = "ko-lao-gemini35lite-sft-v2-pilot1-20261116"
          PILOT_JOB = "projects/460077888071/locations/us/tuningJobs/8799981994835443712"
          PILOT_MODEL = "projects/460077888071/locations/us/models/2845219433335488512@1"
          PILOT_ENDPOINT = "projects/460077888071/locations/us/endpoints/4220752460148375552"
          PROTECTED_CONTROLS = {
              "sft_v11_pilot1_20261115/_control/CREATE_ONCE.json": "2d39a7711a0aa76496f9b37922776785bc35e072bf4bfa28c3dc50908a77e3ea",
              "sft_v11_pilot1_20261115/_control/ATTEMPT_001.json": "40a5cd528199867cef6b3307dad6436fbb20993cc41ec000b4d2948ada21f309",
              "sft_v11_pilot1_20261115/_control/FINAL_LOCK.json": "1ffca4547d7db5d397cac09e4bbfcab843ae6b195c166b6c9468a5baffcb3bf6",
              "sft_v11_ab144_20261115/_control/FINAL_LOCK.json": "e255a035fc41ec71fcdf49391862ed6f29055a9694542dd8bb4f663c5b69c84e",
              "sft_v11_ab144_20261115/_resume/20261116/FINAL_LOCK.json": "498ad8863738962f8a985136b69d0d041376de0cf3920dcb2cf2ee6bf139be11",
          }
          JOB_FIELDS = (
              "name,state,baseModel,tunedModelDisplayName,createTime,startTime,endTime,updateTime,"
              "supervisedTuningSpec(trainingDatasetUri,validationDatasetUri,"
              "hyperParameters(epochCount,learningRateMultiplier,adapterSize),exportLastCheckpointOnly),"
              "tunedModel(model,endpoint,checkpoints(checkpointId,epoch,step,endpoint)),error(code,message,details)"
          )
          OBJECT_LIST_FIELDS = "items(name,generation,size,timeDeleted,crc32c),nextPageToken"
          OBJECT_META_FIELDS = "name,generation,size,crc32c,md5Hash,timeDeleted"
          TERMINAL = {"JOB_STATE_SUCCEEDED", "JOB_STATE_FAILED", "JOB_STATE_CANCELLED", "JOB_STATE_EXPIRED"}
          MAX_RESPONSE_BYTES = 32 * 1024 * 1024
          MAX_PAGES = 100
          REMOTE_BUDGET_SECONDS = 12 * 60
          COUNTER_KEYS = {
              "actual_post_attempts", "actual_create_attempts", "actual_tuning_create_attempts",
              "tuning_create_attempts", "actual_tuning_create_requests", "tuningJobs_create_attempts",
          }
          
          
          def utc():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()
          
          
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          
          
          def encode(value):
              return (json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          
          
          def query(endpoint, params):
              return endpoint + "?" + urllib.parse.urlencode(params)
          
          
          def object_url(name):
              return "https://storage.googleapis.com/storage/v1/b/" + BUCKET + "/o/" + urllib.parse.quote(name, safe="")
          
          
          def job_collection(region):
              host = "aiplatform." + region + ".rep.googleapis.com" if region in ("us", "eu") else region + "-aiplatform.googleapis.com"
              return "https://" + host + "/v1/projects/" + PROJECT + "/locations/" + region + "/tuningJobs"
          
          
          class Blocked(Exception):
              def __init__(self, reason, status=None):
                  super().__init__(reason)
                  self.reason, self.status = reason, status
          
          
          def require(condition, code):
              if not condition:
                  raise Blocked(code)
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          class Client:
              """Single-send GET client; raw responses stay in private in-memory evidence."""
              def __init__(self, token, deadline=None):
                  self._token = token
                  self.opener = urllib.request.build_opener(NoRedirect)
                  self.records, self.private_raw = [], []
                  self.deadline = time.monotonic() + REMOTE_BUDGET_SECONDS if deadline is None else deadline
                  self.allowed_objects = set(PROTECTED_CONTROLS)
                  self.allowed_jobs = {PILOT_JOB}
                  self.raw_capture_complete = True
          
              def allowlisted(self, method, endpoint, body):
                  if method != "GET" or body is not None:
                      return False
                  p = urllib.parse.urlsplit(endpoint)
                  if p.scheme != "https" or p.username or p.password or p.fragment:
                      return False
                  q = urllib.parse.parse_qs(p.query, keep_blank_values=True)
                  if any(len(values) != 1 for values in q.values()):
                      return False
                  if p.netloc == "storage.googleapis.com":
                      base = "/storage/v1/b/" + BUCKET + "/o"
                      if p.path == base:
                          return q.get("versions") == ["true"] and q.get("maxResults") == ["1000"] and q.get("fields") == [OBJECT_LIST_FIELDS] and set(q).issubset({"versions", "maxResults", "fields", "pageToken"})
                      if p.path.startswith(base + "/"):
                          name = urllib.parse.unquote(p.path[len(base) + 1:])
                          if name not in self.allowed_objects:
                              return False
                          if q == {"fields": [OBJECT_META_FIELDS]}:
                              return True
                          return set(q) == {"alt", "generation"} and q["alt"] == ["media"] and q["generation"][0].isdigit()
                  for region in ("us", "eu", "us-central1"):
                      collection = urllib.parse.urlsplit(job_collection(region))
                      if p.netloc != collection.netloc:
                          continue
                      if p.path == collection.path:
                          return q.get("pageSize") == ["1000"] and q.get("fields") == ["tuningJobs(" + JOB_FIELDS + "),nextPageToken"] and set(q).issubset({"pageSize", "fields", "pageToken"})
                      name = p.path.removeprefix("/v1/")
                      if p.path.startswith("/v1/") and name in self.allowed_jobs and q == {"fields": [JOB_FIELDS]}:
                          expected = r"projects/(?:" + PROJECT + "|" + PROJECT_NUMBER + r")/locations/" + region + r"/tuningJobs/[A-Za-z0-9_-]+"
                          return re.fullmatch(expected, name) is not None
                  return False
          
              def request(self, method, endpoint, body=None, label=""):
                  require(self.allowlisted(method, endpoint, body), "READ_ONLY_ALLOWLIST_DENIED")
                  require(time.monotonic() < self.deadline, "REMOTE_READ_DEADLINE_REACHED")
                  record = {"sequence": len(self.records) + 1, "label": label, "method": method, "started_at": utc()}
                  request = urllib.request.Request(endpoint, method="GET", headers={"Authorization": "Bearer " + self._token})
                  try:
                      try:
                          with self.opener.open(request, timeout=35) as response:
                              status, raw, headers = response.status, response.read(MAX_RESPONSE_BYTES + 1), response.headers
                      except urllib.error.HTTPError as error:
                          status, raw, headers = error.code, error.read(MAX_RESPONSE_BYTES + 1), error.headers
                  except Exception as error:
                      record.update(ended_at=utc(), http_status="UNKNOWN", exception_type=type(error).__name__)
                      self.records.append(record)
                      self.raw_capture_complete = False
                      raise Blocked("READ_TRANSPORT_UNKNOWN_" + label) from None
                  record.update(ended_at=utc(), http_status=status, response_bytes=len(raw), response_sha256=sha(raw),
                                request_id=headers.get("x-goog-request-id") or headers.get("x-request-id") or headers.get("x-google-request-id"))
                  self.records.append(record)
                  # Never archive credentials, including a hypothetical reflected current token.
                  private_pem = b"-----BEGIN " + b"PRIVATE KEY-----"
                  rsa_private_pem = b"-----BEGIN RSA " + b"PRIVATE KEY-----"
                  if (self._token and self._token.encode() in raw) or private_pem in raw or rsa_private_pem in raw:
                      self.raw_capture_complete = False
                      record["raw_omission"] = "ACTUAL_CREDENTIAL_CONTENT_EXCLUDED"
                      raise Blocked("CREDENTIAL_CONTENT_IN_RESPONSE", status)
                  self.private_raw.append({"sequence": record["sequence"], "label": label, "raw": raw})
                  if len(raw) > MAX_RESPONSE_BYTES:
                      self.raw_capture_complete = False
                      record["body_truncated_by_safety_limit"] = True
                      raise Blocked("READ_RESPONSE_SIZE_LIMIT_" + label, status)
                  if status != 200:
                      # Full bytes, including error.message and details, are already retained.
                      raise Blocked("READ_HTTP_ERROR_" + label, status)
                  return raw
          
              def get_json(self, endpoint, label):
                  raw = self.request("GET", endpoint, label=label)
                  try:
                      value = json.loads(raw.decode("utf-8"))
                  except (UnicodeError, ValueError):
                      raise Blocked("READ_JSON_INVALID_" + label) from None
                  require(isinstance(value, dict), "READ_JSON_NOT_OBJECT_" + label)
                  return value
          
          
          def guard_identity(env):
              expected = {
                  "GITHUB_REPOSITORY": "martin830000-spec/laos-translator",
                  "GITHUB_REF": "refs/heads/research/gemini35-tuning-test",
                  "GITHUB_EVENT_NAME": "push",
                  "GITHUB_RUN_ATTEMPT": "1",
                  "GITHUB_WORKFLOW_REF": "martin830000-spec/laos-translator/.github/workflows/gemini35-tuning-test.yml@refs/heads/research/gemini35-tuning-test",
                  "REMOTE_PREFLIGHT_MODE": "PREFLIGHT",
                  "ENABLE_TUNING": "false",
                  "ENABLE_GENERATION": "false",
              }
              require(all(env.get(k) == v for k, v in expected.items()), "IDENTITY_OR_DISABLED_GUARD")
              require(re.fullmatch(r"[0-9]+", env.get("GITHUB_RUN_ID", "")) is not None and re.fullmatch(r"[0-9a-f]{40}", env.get("GITHUB_SHA", "")) is not None, "INVALID_EXECUTION_IDENTITY")
          
          
          def list_objects(client):
              objects, seen, token = [], set(), None
              for page in range(MAX_PAGES):
                  params = {"versions": "true", "maxResults": "1000", "fields": OBJECT_LIST_FIELDS}
                  if token:
                      params["pageToken"] = token
                  value = client.get_json(query("https://storage.googleapis.com/storage/v1/b/" + BUCKET + "/o", params), "GCS_VERSIONS_PAGE_" + str(page + 1))
                  items = value.get("items", [])
                  require(isinstance(items, list), "GCS_LIST_INVALID")
                  for item in items:
                      require(isinstance(item, dict) and isinstance(item.get("name"), str) and str(item.get("generation", "")).isdigit(), "GCS_OBJECT_IDENTITY_INVALID")
                      identity = (item["name"], str(item["generation"]))
                      require(identity not in seen, "GCS_OBJECT_VERSION_REPEATED")
                      seen.add(identity)
                      objects.append(item)
                  token = value.get("nextPageToken")
                  if not token:
                      return objects, page + 1
                  require(isinstance(token, str) and ("PAGE", token) not in seen, "GCS_PAGE_TOKEN_REPEATED_OR_INVALID")
                  seen.add(("PAGE", token))
              raise Blocked("GCS_LIST_INCOMPLETE_AT_PAGE_LIMIT")
          
          
          def read_version(client, item, label):
              name, generation = item["name"], str(item["generation"])
              client.allowed_objects.add(name)
              raw = client.request("GET", query(object_url(name), {"alt": "media", "generation": generation}), label=label)
              require(str(item.get("size", "")).isdigit() and len(raw) == int(item["size"]), "GCS_VERSION_SIZE_MISMATCH")
              return raw
          
          
          def is_v2_object(name):
              lower = name.lower()
              return name.startswith(PREFIX) or CAMPAIGN.lower() in lower or "sft_v2_pilot1_20261116" in lower
          
          
          def classify_object(name):
              lower = name.lower()
              if "private_key" in lower or lower.endswith((".pem", ".key")) or "credential" in lower or "access_token" in lower:
                  return "SECRET_MATERIAL_NOT_READ"
              if lower.endswith(("train_v2_candidate.jsonl", "validation_v2_candidate.jsonl")):
                  return "FROZEN_DATASET_METADATA_ONLY"
              return "CONTROL_OR_EVIDENCE_READ_REQUIRED"
          
          
          def walk_attempt_signals(value, name, signals, inherited=True):
              if isinstance(value, dict):
                  stated = value.get("campaign_id", value.get("campaign"))
                  if stated is not None and stated != CAMPAIGN:
                      return
                  in_campaign = inherited or stated == CAMPAIGN
                  if in_campaign:
                      for key in COUNTER_KEYS:
                          if key in value:
                              count = value[key]
                              if isinstance(count, int) and not isinstance(count, bool) and count >= 0:
                                  signals["counters"].append({"object": name, "key": key, "count": count, "explicit_campaign": stated == CAMPAIGN})
                              else:
                                  signals["unknown"].append({"object": name, "reason": "INVALID_ATTEMPT_COUNTER"})
                      state = value.get("state")
                      if isinstance(state, str) and ("UNKNOWN" in state or "RESERVED" in state or "RESERVATION" in state):
                          signals["unknown"].append({"object": name, "reason": "RESERVATION_OR_UNKNOWN_STATE", "state": state})
                      if value.get("actual_send_entered") is True:
                          signals["positive"].append({"object": name, "reason": "ACTUAL_SEND_ENTERED_TRUE"})
                      if value.get("label") == "TUNING_CREATE" and any(k in value for k in ("http_status", "status", "response_sha256", "started_at", "start_time")):
                          signals["positive"].append({"object": name, "reason": "ACTUAL_TUNING_CREATE_RECEIPT"})
                  for child in value.values():
                      walk_attempt_signals(child, name, signals, in_campaign)
              elif isinstance(value, list):
                  for child in value:
                      walk_attempt_signals(child, name, signals, inherited)
          
          
          def read_v2_records(client, objects, result):
              relevant = [x for x in objects if is_v2_object(x["name"])]
              receipts, signals = [], {"counters": [], "positive": [], "unknown": []}
              result["v2_objects"] = receipts
              result["v2_attempt_signals"] = signals
              for index, item in enumerate(relevant):
                  name, kind = item["name"], classify_object(item["name"])
                  receipt = {"name": name, "generation": str(item["generation"]), "size_bytes": int(item.get("size", -1)), "crc32c": item.get("crc32c"), "time_deleted": item.get("timeDeleted"), "kind": kind}
                  receipts.append(receipt)
                  if kind != "CONTROL_OR_EVIDENCE_READ_REQUIRED":
                      receipt["content_read"] = False
                      receipt["scope_note"] = "Not an attempt ledger; secrets are never fetched and dataset validation belongs to a later gate."
                      continue
                  raw = read_version(client, item, "V2_PRIVATE_RECORD_" + str(index + 1))
                  receipt.update(content_read=True, sha256=sha(raw))
                  lower = name.lower()
                  if any(x in lower for x in ("create_once", "attempt", "reservation")):
                      signals["unknown"].append({"object": name, "reason": "IMMUTABLE_ATTEMPT_OR_CREATE_RESERVATION_OBJECT_EXISTS"})
                  try:
                      value = json.loads(raw.decode("utf-8"))
                  except (UnicodeError, ValueError):
                      signals["unknown"].append({"object": name, "reason": "OPAQUE_OR_NON_JSON_EVIDENCE_CANNOT_RECONCILE_ATTEMPTS"})
                      continue
                  if isinstance(value, dict) and "ciphertext_b64" in value:
                      signals["unknown"].append({"object": name, "reason": "ENCRYPTED_PRIOR_EVIDENCE_NOT_DECRYPTED"})
                  walk_attempt_signals(value, name, signals)
              result["v2_record_read_complete"] = True
              result["v2_remote_object_versions"] = len(relevant)
              result["no_v2_control"] = not any(x["kind"] == "CONTROL_OR_EVIDENCE_READ_REQUIRED" for x in receipts)
          
          
          def matches_v2(job):
              spec = job.get("supervisedTuningSpec", {})
              values = [job.get("name", ""), job.get("tunedModelDisplayName", ""), spec.get("trainingDatasetUri", ""), spec.get("validationDatasetUri", "")]
              tokens = (DISPLAY.lower(), CAMPAIGN.lower(), "sft_v2_pilot1_20261116")
              return any(any(token in value.lower() for token in tokens) for value in values if isinstance(value, str))
          
          
          def jobs_check(client, result):
              summaries, matching = {}, []
              result["regions"] = summaries
              result["v2_jobs"] = matching
              for region in ("us", "eu", "us-central1"):
                  jobs, tokens, token = [], set(), None
                  summary = {"all_pages_read": False, "total_jobs": None, "active_jobs": None}
                  summaries[region] = summary
                  for page in range(MAX_PAGES):
                      params = {"pageSize": "1000", "fields": "tuningJobs(" + JOB_FIELDS + "),nextPageToken"}
                      if token:
                          params["pageToken"] = token
                      data = client.get_json(query(job_collection(region), params), "JOBS_" + region + "_PAGE_" + str(page + 1))
                      incoming = data.get("tuningJobs", [])
                      require(isinstance(incoming, list), "JOB_LIST_INVALID")
                      for job in incoming:
                          require(isinstance(job, dict) and isinstance(job.get("name"), str) and isinstance(job.get("state"), str), "JOB_LIST_ENTRY_INVALID")
                          require(job["name"] not in {j["name"] for j in jobs}, "JOB_RESOURCE_REPEATED")
                          jobs.append(job)
                      token = data.get("nextPageToken")
                      if not token:
                          break
                      require(isinstance(token, str) and token not in tokens, "JOB_PAGE_TOKEN_REPEATED_OR_INVALID")
                      tokens.add(token)
                  require(not token, "JOB_LIST_INCOMPLETE_AT_PAGE_LIMIT")
                  summary.update(all_pages_read=True, pages=page + 1, total_jobs=len(jobs), active_jobs=sum(j["state"] not in TERMINAL for j in jobs))
                  for job in jobs:
                      if matches_v2(job):
                          name = job["name"]
                          client.allowed_jobs.add(name)
                          host = urllib.parse.urlsplit(job_collection(region)).netloc
                          actual = client.get_json(query("https://" + host + "/v1/" + name, {"fields": JOB_FIELDS}), "EXISTING_V2_JOB_" + str(len(matching) + 1))
                          require(actual.get("name") == name, "EXISTING_JOB_IDENTITY_MISMATCH")
                          matching.append(actual)
              result["jobs_read_complete"] = True
              result["no_v2_job"] = not matching
              result["active_jobs_in_queried_regions"] = sum(v["active_jobs"] for v in summaries.values())
              result["quota_scope"] = {"regions_actually_queried": list(summaries), "actual_quota_limit_queried": False, "limit_not_assumed_from_empty_job_list": True}
          
          
          def verify_protected(client, result):
              pilot = client.get_json(query("https://aiplatform.us.rep.googleapis.com/v1/" + PILOT_JOB, {"fields": JOB_FIELDS}), "PROTECTED_V11_JOB")
              result["protected_pilot_job"] = pilot
              require(pilot.get("name") == PILOT_JOB and pilot.get("state") == "JOB_STATE_SUCCEEDED" and pilot.get("baseModel") == "gemini-3.5-flash-lite" and pilot.get("tunedModel", {}).get("model") == PILOT_MODEL and pilot.get("tunedModel", {}).get("endpoint") == PILOT_ENDPOINT, "PROTECTED_PILOT_CONTRACT_CHANGED")
              result["protected_controls"] = {}
              for index, (name, expected) in enumerate(PROTECTED_CONTROLS.items()):
                  meta = client.get_json(query(object_url(name), {"fields": OBJECT_META_FIELDS}), "PROTECTED_CONTROL_METADATA_" + str(index + 1))
                  require(meta.get("name") == name and str(meta.get("generation", "")).isdigit(), "PROTECTED_CONTROL_METADATA_INVALID")
                  raw = read_version(client, meta, "PROTECTED_CONTROL_BODY_" + str(index + 1))
                  receipt = {"name": name, "generation": str(meta["generation"]), "sha256": sha(raw), "size_bytes": len(raw), "expected_sha256": expected, "sha256_unchanged": sha(raw) == expected}
                  result["protected_controls"][name] = receipt
                  require(receipt["sha256_unchanged"], "PROTECTED_CONTROL_SHA_CHANGED")
              result["protected_resource_reads_complete"] = True
          
          
          def classify_attempt_status(result):
              complete = result.get("gcs_inventory_complete") and result.get("v2_record_read_complete") and result.get("jobs_read_complete") and result.get("protected_resource_reads_complete")
              result["audit_complete"] = bool(complete)
              result["actual_prior_create_attempts"] = None
              if not complete:
                  result.update(v2_attempt_status="UNKNOWN_INCOMPLETE_READS", eligibility="BLOCKED_PENDING_COMPLETE_READS")
                  return
              signals = result["v2_attempt_signals"]
              positives = [v for v in signals["counters"] if v["count"] > 0]
              if result["v2_jobs"] or positives or signals["positive"]:
                  result.update(state="PREFLIGHT_READ_COMPLETE_PRIOR_SEND_OR_JOB_FOUND", v2_attempt_status="PRIOR_SEND_OR_JOB_EXISTS", eligibility="FORBID_NEW_CREATE")
                  return
              if signals["unknown"]:
                  result.update(state="PREFLIGHT_READ_COMPLETE_ATTEMPT_AMBIGUITY", v2_attempt_status="RESERVATION_OR_UNKNOWN_PRIOR_SEND", eligibility="FORBID_NEW_CREATE")
                  return
              zeros = [v for v in signals["counters"] if v["count"] == 0 and v["explicit_campaign"]]
              if zeros:
                  result.update(state="PREFLIGHT_READ_COMPLETE_ZERO_REPORTED", v2_attempt_status="ZERO_REPORTED_IN_READ_REMOTE_LEDGER", actual_prior_create_attempts=0, eligibility="REQUIRES_HISTORY_RECONCILIATION")
              else:
                  result.update(state="PREFLIGHT_READ_COMPLETE_NO_V2_REMOTE_RECORD", v2_attempt_status="VERIFIED_ABSENCE_OF_PRIOR_SEND_EVIDENCE_IN_READ_SCOPE", eligibility="REQUIRES_HISTORY_RECONCILIATION")
              if result["active_jobs_in_queried_regions"]:
                  result["eligibility"] = "FORBID_CREATE_WHILE_ACTIVE_JOB_EXISTS"
          
          
          def base_result(env):
              return {"campaign_id": CAMPAIGN, "state": "STOPPED_BLOCKED", "run_id": env.get("GITHUB_RUN_ID"), "commit_sha": env.get("GITHUB_SHA"), "started_at": utc(),
                      "enabled": False, "max_new": 0, "next_new_authorization": 0, "tuning_create_attempts_this_run": 0, "generation_attempts_this_run": 0,
                      "remote_writes_this_run": 0, "http_retries": 0, "gcs_inventory_complete": False, "v2_record_read_complete": False, "jobs_read_complete": False,
                      "protected_resource_reads_complete": False, "audit_complete": False, "actual_prior_create_attempts": None,
                      "v2_attempt_status": "NOT_YET_QUERIED", "eligibility": "NO_CREATE_CAPABILITY_IN_THIS_SCRIPT"}
          
          
          def run(client, env, result=None):
              result = base_result(env) if result is None else result
              if env.get("REMOTE_PREFLIGHT_MODE") == "CLOSED":
                  result.update(state="CLOSED_NO_ACTION", finished_at=utc())
                  return result
              guard_identity(env)
              objects, pages = list_objects(client)
              result.update(gcs_inventory_complete=True, gcs_inventory_pages=pages, gcs_object_versions=len(objects))
              read_v2_records(client, objects, result)
              jobs_check(client, result)
              verify_protected(client, result)
              classify_attempt_status(result)
              result.update(finished_at=utc(), http_get_requests=len(client.records), raw_capture_complete=client.raw_capture_complete)
              return result
          
          
          def private_export(client, result, env):
              require(bool(env.get("RUNNER_TEMP")) and bool(env.get("CRYPTO_SCRIPT")) and bool(env.get("OUTPUT_PUBLIC_KEY")), "EXPORT_ENV_MISSING")
              root = Path(env["RUNNER_TEMP"])
              private = Path(tempfile.mkdtemp(prefix="v2_remote_preflight_private_", dir=root))
              os.chmod(private, 0o700)
              files = {"RESULT.json": encode(result), "HTTP_RECEIPTS.json": encode(client.records if client else [])}
              raw_index = []
              for item in client.private_raw if client else []:
                  name = "raw/" + str(item["sequence"]).zfill(5) + ".bin"
                  files[name] = item["raw"]
                  raw_index.append({"file": name, "sequence": item["sequence"], "label": item["label"], "bytes": len(item["raw"]), "sha256": sha(item["raw"])})
              files["RAW_RESPONSE_INDEX.json"] = encode(raw_index)
              manifest = {"campaign_id": CAMPAIGN, "files": {name: {"bytes": len(raw), "sha256": sha(raw)} for name, raw in files.items()}}
              files["MANIFEST_SHA256.json"] = encode(manifest)
              bundle = private / "private_evidence.zip"
              with zipfile.ZipFile(bundle, "x", zipfile.ZIP_DEFLATED) as z:
                  for name, raw in files.items():
                      z.writestr(name, raw)
              os.chmod(bundle, 0o600)
              raw = bundle.read_bytes()
              header = {"campaign": CAMPAIGN, "resume_event": "recovery_20261116", "purpose": "remote_readonly_preflight_" + str(env.get("GITHUB_RUN_ID", "unknown")), "bundle_sha256": sha(raw), "plaintext_bytes": len(raw)}
              header_file = private / "header.json"
              header_file.write_bytes(encode(header))
              os.chmod(header_file, 0o600)
              encrypted = root / "v2_remote_preflight_encrypted.json"
              result_process = subprocess.run(["node", env["CRYPTO_SCRIPT"], "encrypt", env["OUTPUT_PUBLIC_KEY"], str(bundle), str(encrypted), str(header_file)], stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
              require(result_process.returncode == 0 and encrypted.is_file(), "LOCAL_ENCRYPTED_EXPORT_FAILED")
              return {"encrypted_artifact_file": encrypted.name, "ciphertext_sha256": sha(encrypted.read_bytes()), "header": header}
          
          
          def public_summary(result, artifact=None):
              public = {"status": result["state"], "run_id": result.get("run_id"), "v2_attempt_status": result.get("v2_attempt_status"),
                        "audit_complete": result.get("audit_complete", False), "actual_prior_create_attempts": result.get("actual_prior_create_attempts"),
                        "job_count": len(result["v2_jobs"]) if result.get("jobs_read_complete") else None,
                        "eligibility": result.get("eligibility"), "tuning_create_attempts_this_run": 0, "generation_attempts_this_run": 0, "remote_writes_this_run": 0}
              if artifact:
                  public["encrypted_artifact"] = artifact
              if result.get("export_failed"):
                  public["export_failed"] = True
              if result.get("error"):
                  public["error_code"] = result["error"]["reason"]
                  public["http_status"] = result["error"].get("http_status")
              return public
          
          
          def main(env=None):
              env = dict(os.environ) if env is None else dict(env)
              result, client, artifact = base_result(env), None, None
              if env.get("REMOTE_PREFLIGHT_MODE") == "CLOSED":
                  result.update(state="CLOSED_NO_ACTION")
                  print("V2_PREFLIGHT_PUBLIC_RESULT=" + json.dumps(public_summary(result), separators=(",", ":")))
                  return 0
              try:
                  guard_identity(env)
                  result["script_sha256"] = sha(Path(__file__).read_bytes())
                  result["output_public_key_sha256"] = sha(Path(env["OUTPUT_PUBLIC_KEY"]).read_bytes())
                  token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True, stderr=subprocess.PIPE, timeout=30).strip()
                  require(bool(token), "EMPTY_ACCESS_TOKEN")
                  client = Client(token)
                  del token
                  run(client, env, result)
              except Blocked as error:
                  result.update(state="STOPPED_BLOCKED", error={"reason": error.reason, "http_status": error.status})
                  if not result.get("audit_complete"):
                      result.update(v2_attempt_status="UNKNOWN_INCOMPLETE_READS", eligibility="BLOCKED_PENDING_COMPLETE_READS", actual_prior_create_attempts=None)
              except Exception as error:
                  result.update(state="STOPPED_BLOCKED", error={"reason": "LOCAL_OR_AUTH_EXCEPTION", "exception_type": type(error).__name__},
                                v2_attempt_status="UNKNOWN_INCOMPLETE_READS", eligibility="BLOCKED_PENDING_COMPLETE_READS", actual_prior_create_attempts=None)
              result["finished_at"] = utc()
              result["http_get_requests"] = len(client.records) if client else 0
              result["raw_capture_complete"] = client.raw_capture_complete if client else True
              try:
                  artifact = private_export(client, result, env)
              except Exception as error:
                  result.update(state="STOPPED_BLOCKED", export_failed=True, export_error_type=type(error).__name__)
              print("V2_PREFLIGHT_PUBLIC_RESULT=" + json.dumps(public_summary(result, artifact), ensure_ascii=True, separators=(",", ":")))
              return 1 if result["state"] == "STOPPED_BLOCKED" else 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
