          hashes={'scripts/stress_remote.py': '2faf872bf417112277b84c2aa0eab653217f96486c2db6fe3c490721d8418f65', 'scripts/stress_runner.py': '0724190513f1f93060b3b72deb2197f64bf4d7d127477de86231caaa19df290e', 'scripts/fixed_source.py': '00ef867f07f33b21e72ee3808c86cb3f8d9e3c31afbf4cc9a3a4ecaa1514bcab', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'scripts/stress_common.py': 'c8de9fb4ac5ff03d43edf15192273fd0582ec66de8621fc15ca29dd51546fb9a', 'scripts/stress_offline.py': 'afa88bf8aac833beb7acb06efa12acf549a26389abfe17aeaef7b602fce1b2cc', 'scripts/script_status.py': '78db76894a57ce67a976608d982383d0273beebbd72b2077dcdd49ef94892704', 'scripts/stress_gcs_contract.py': 'ceedc72576869ca37f52e8b9b2d775d5e8677e124b4707f9b957971f2fe9ae06', 'scripts/technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'tests/test_plan_deep.py': '45c574d13179c15b0379630444dd816c89c5e462c62fc75fbb13b2ffba8542dc', 'tests/test_delivery_expiry.py': '7ae681f9ecf6b2676386ccddd11346793b388350e5cdb17f9100ca2a001dffa7', 'tests/test_new_parent_contract.py': 'c204d73b4e34f63dfbe6313d8489436381aadb4832aae4c578f857c1e3bef908', 'tests/test_stress_runner.py': 'ba0f53789a12c1b684c7092b0883a289b9b36024889c4fd3d409944438da554d', 'guard/sitecustomize.py': 'c9dd3b5705ebfb842adb1b0a0f1ce30ab0a30fc635c76ceb8416e86789cf365d', 'frozen/FIXED_FIRST24_METADATA.json': 'ff6f7de1efb6236397779fa1e0bb94c7dbfb8c9dc889f5b529ca71c51ccdc853', 'frozen/PROMPTS.json': '4b55c35fe5adda278c08fb2fb34b2ee96f52dd3ee90bbf4595394b437b669362', 'frozen/HELDOUT24_METADATA.json': 'fe45306f9af74142664077324e445a4815859478b063e5e30a25a0098492f557', 'frozen/SLOT_PLAN336.json': 'cd33a9ebef33f8405aab25311f866fd4e9d1e6453332b69cde31bb3a612c78ba', 'frozen/FIXED_FIRST_PANEL24.json': '79fbacc3b9260eb7bead9c350010c6fe22da7a3467b019f08d6c80d90f785bb0', 'package/GEMINI35_BACK_REFERENT336_PREP_20261120.zip': '639ef5a36caf2783cfae192d33523f3d132359beb671a2cff917856