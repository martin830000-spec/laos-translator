name: Gemini 3.5 AB144 TEST Preflight
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v11-ab144-20261115
  cancel-in-progress: false
jobs:
  ab144-preflight:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    env:
      AB144_MODE: "PREFLIGHT"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate designated TEST identity
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up Google Cloud CLI
        if: ${{ env.AB144_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Free AB144 contract check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/ab144_preflight.py" <<'AB144_PY'
          """AB144 free contract preflight: no generation or tuning-create capability."""
          import base64, datetime, hashlib, json, os, re, subprocess, sys, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          
          CAMPAIGN='GEMINI35_SFT_V11_AB144_20261115'
          PROJECT='gen-lang-client-0422436907'
          BUCKET='ko-lao-gemini35-tuning-460077888071'
          PREFIX='sft_v11_ab144_20261115/'
          PILOT_PREFIX='sft_v11_pilot1_20261115/'
          JOB='projects/460077888071/locations/us/tuningJobs/8799981994835443712'
          MODEL='projects/460077888071/locations/us/models/2845219433335488512@1'
          ENDPOINT='projects/460077888071/locations/us/endpoints/4220752460148375552'
          PERMISSIONS=['aiplatform.endpoints.predict','aiplatform.endpoints.get','aiplatform.models.get','aiplatform.tuningJobs.get']
          IAM_URL='https://cloudresourcemanager.googleapis.com/v1/projects/'+PROJECT+':testIamPermissions'
          FIELDS='name,state,baseModel,tunedModelDisplayName,createTime,startTime,endTime,updateTime,supervisedTuningSpec(trainingDatasetUri,validationDatasetUri,hyperParameters(epochCount,adapterSize,learningRateMultiplier)),tunedModel(model,endpoint),tuningDataStats(supervisedTuningDataStats(tuningDatasetExampleCount,totalTuningCharacterCount,totalBillableTokenCount,tuningStepCount,totalTruncatedExampleCount)),error(code)'
          OLD_CONTROLS={'CREATE_ONCE.json':'2d39a7711a0aa76496f9b37922776785bc35e072bf4bfa28c3dc50908a77e3ea','ATTEMPT_001.json':'40a5cd528199867cef6b3307dad6436fbb20993cc41ec000b4d2948ada21f309','FINAL_LOCK.json':'1ffca4547d7db5d397cac09e4bbfcab843ae6b195c166b6c9468a5baffcb3bf6'}
          INPUTS={'train_v11.jsonl':{'generation':'1794739965286591','size':557378,'sha256':'a07c2c4a74d598daf9b515bbea5b2a37db37e51ba9433d94046b01a8666a9dba'},'validation_v11.jsonl':{'generation':'1794739965065841','size':170021,'sha256':'cbe45fccdbdf10f7515be08d3e94ab114c7cf6ec642737bdebf05156a86ff9f2'}}
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def enc(x):return (json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=True)+'\n').encode()
          def sha(b):return hashlib.sha256(b).hexdigest()
          def url(s,q):return s+'?'+urllib.parse.urlencode(q)
          def obj(name):return 'https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o/'+urllib.parse.quote(name,safe='')
          class Stop(Exception):pass
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          class Client:
           def __init__(self,token):self.token=token;self.opener=urllib.request.build_opener(NoRedirect);self.records=[];self.gcs_failed=False
           def request(self,method,endpoint,body=None,label='',safe_json=True):
            permitted=(method=='GET' and (endpoint.startswith('https://aiplatform.us.rep.googleapis.com/v1/'+JOB+'?') or endpoint.startswith('https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o')))
            permitted=permitted or (method=='POST' and endpoint==IAM_URL)
            permitted=permitted or (method=='POST' and endpoint.startswith('https://storage.googleapis.com/upload/storage/v1/b/'+BUCKET+'/o?') and urllib.parse.parse_qs(urllib.parse.urlsplit(endpoint).query).get('ifGenerationMatch')==['0'] and urllib.parse.parse_qs(urllib.parse.urlsplit(endpoint).query).get('name',[''])[0].startswith(PREFIX))
            if not permitted:raise Stop('REQUEST_OUTSIDE_FREE_PREFLIGHT_ALLOWLIST')
            started=now();req=urllib.request.Request(endpoint,data=body,method=method,headers={'Authorization':'Bearer '+self.token,'Content-Type':'application/json'})
            try:
             with self.opener.open(req,timeout=45) as r:status,raw=r.status,r.read()
            except urllib.error.HTTPError as e:status,raw=e.code,e.read()
            except Exception as e:
             self.gcs_failed=endpoint.startswith('https://storage.googleapis.com/')
             self.records.append({'label':label,'method':method,'url':endpoint,'started_at':started,'ended_at':now(),'status':'UNKNOWN','exception_type':type(e).__name__})
             raise Stop('TRANSPORT_UNKNOWN_'+label) from None
            record={'label':label,'method':method,'url':endpoint,'started_at':started,'ended_at':now(),'http_status':status,'response_bytes':len(raw),'response_sha256':sha(raw)}
            if body is not None:record['request_sha256']=sha(body)
            self.records.append(record)
            if status not in (200,201):
             if endpoint.startswith('https://storage.googleapis.com/'):self.gcs_failed=True
             raise Stop('HTTP_'+str(status)+'_'+label)
            if safe_json:
             value=json.loads(raw)
             if any(word in raw for word in (b'"userDatasetExamples"',b'"access_token"',b'"id_token"')):raise Stop('UNEXPECTED_SENSITIVE_FIELD')
             record['raw_response_base64']=base64.b64encode(raw).decode()
            return raw
           def put_new(self,name,body,label):
            e=url('https://storage.googleapis.com/upload/storage/v1/b/'+BUCKET+'/o',{'uploadType':'media','name':name,'ifGenerationMatch':'0','fields':'name,generation,size,crc32c,md5Hash'})
            meta=json.loads(self.request('POST',e,body,label))
            back=self.request('GET',url(obj(name),{'alt':'media','generation':meta['generation']}),label=label+'_READBACK')
            if back!=body:self.gcs_failed=True;raise Stop('READBACK_MISMATCH_'+label)
            return {'uri':'gs://'+BUCKET+'/'+name,'generation':meta['generation'],'size_bytes':len(body),'sha256':sha(body),'byte_equal':True,'ifGenerationMatch':0}
          
          def main():
           if os.environ.get('AB144_MODE')=='CLOSED':print('AB144_CLOSED_NO_ACTION');return
           result={'campaign_id':CAMPAIGN,'state':'STOPPED_BLOCKED','enabled':False,'max_new':0,'next_new_authorization':0,'authorized_generation_cap':144,'actual_generation_attempts':0,'actual_tuning_create_attempts':0,'paid_judge_attempts':0,'unspent_generation_authorization_locked':144,'started_at':now(),'runner_sha256':sha(Path(__file__).read_bytes()),'run_id':os.environ.get('GITHUB_RUN_ID'),'commit_sha':os.environ.get('GITHUB_SHA')}
           c=None;existing=False
           try:
            expected='martin830000-spec/laos-translator/.github/workflows/gemini35-tuning-test.yml@refs/heads/research/gemini35-tuning-test'
            if os.environ.get('GITHUB_REPOSITORY')!='martin830000-spec/laos-translator' or os.environ.get('GITHUB_REF')!='refs/heads/research/gemini35-tuning-test' or os.environ.get('GITHUB_EVENT_NAME')!='push' or os.environ.get('GITHUB_RUN_ATTEMPT')!='1' or os.environ.get('GITHUB_WORKFLOW_REF')!=expected or os.environ.get('AB144_MODE')!='PREFLIGHT' or os.environ.get('ENABLE_GENERATION')!='false' or os.environ.get('ENABLE_TUNING')!='false':raise Stop('IDENTITY_OR_DISABLED_GUARD')
            token=subprocess.check_output(['gcloud','auth','print-access-token'],stderr=subprocess.PIPE,text=True).strip()
            if not token:raise Stop('EMPTY_ACCESS_TOKEN')
            c=Client(token)
            j=json.loads(c.request('GET',url('https://aiplatform.us.rep.googleapis.com/v1/'+JOB,{'fields':FIELDS}),label='PILOT1_FINAL_JOB_GET'))
            result['pilot1_actual_final_job']=j
            spec=j.get('supervisedTuningSpec',{})
            if j.get('name')!=JOB or j.get('state')!='JOB_STATE_SUCCEEDED' or j.get('baseModel')!='gemini-3.5-flash-lite' or j.get('tunedModel',{}).get('model')!=MODEL or j.get('tunedModel',{}).get('endpoint')!=ENDPOINT or str(spec.get('hyperParameters',{}).get('epochCount'))!='2' or spec.get('trainingDatasetUri')!='gs://'+BUCKET+'/'+PILOT_PREFIX+'train_v11.jsonl' or spec.get('validationDatasetUri')!='gs://'+BUCKET+'/'+PILOT_PREFIX+'validation_v11.jsonl':raise Stop('PILOT1_FINAL_CONTRACT_MISMATCH')
            result['prior_pilot_controls']={}
            for name,digest in OLD_CONTROLS.items():
             b=c.request('GET',url(obj(PILOT_PREFIX+'_control/'+name),{'alt':'media'}),label='PRIOR_PILOT_CONTROL_'+name)
             if sha(b)!=digest:raise Stop('PRIOR_PILOT_CONTROL_CHANGED')
             result['prior_pilot_controls'][name]={'sha256':sha(b),'bytes':len(b),'unchanged':True}
            result['training_objects']={}
            for name,expected_meta in INPUTS.items():
             m=json.loads(c.request('GET',url(obj(PILOT_PREFIX+name),{'fields':'name,generation,size,crc32c,md5Hash'}),label='TRAINING_METADATA_'+name))
             if m['generation']!=expected_meta['generation'] or int(m['size'])!=expected_meta['size']:raise Stop('TRAINING_OBJECT_GENERATION_CHANGED')
             result['training_objects'][name]=dict(m,prior_verified_sha256=expected_meta['sha256'],immutable_generation_unchanged=True)
            names=[];page_token=None
            for page in range(10):
             query={'versions':'true','maxResults':'1000','fields':'items(name,generation),nextPageToken'}
             if page_token:query['pageToken']=page_token
             listing=json.loads(c.request('GET',url('https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o',query),label='CAMPAIGN_EXISTENCE_LIST_'+str(page),safe_json=False))
             names.extend(o['name'] for o in listing.get('items',[]));page_token=listing.get('nextPageToken')
             if not page_token:break
            if page_token:raise Stop('BUCKET_LIST_INCOMPLETE')
            existing=any(n.startswith(PREFIX) or CAMPAIGN.lower() in n.lower() for n in names)
            result['existing_ab144_objects_found']=existing
            if existing:raise Stop('EXISTING_AB144_STATE_DO_NOT_OVERWRITE')
            permissions=json.loads(c.request('POST',IAM_URL,enc({'permissions':PERMISSIONS}),label='FREE_TEST_IAM_PERMISSIONS'))
            result['project_permission_probe']={'requested':PERMISSIONS,'returned':permissions.get('permissions',[]),'method':'projects.testIamPermissions','changes_iam':False,'generates_content':False}
            if 'aiplatform.endpoints.predict' not in permissions.get('permissions',[]):raise Stop('REQUIRED_PROJECT_INFERENCE_PERMISSION_NOT_GRANTED')
            result['state']='PREFLIGHT_READY_LOCKED'
           except Stop as e:result['stop_reason']=str(e)
           except Exception as e:result['stop_reason']='LOCAL_OR_AUTH_EXCEPTION';result['exception_type']=type(e).__name__
           result['finished_at']=now()
           if c:
            result['http_receipts']=c.records
            if not existing and not c.gcs_failed:
             try:
              object_name=PREFIX+('_control/FINAL_LOCK.json' if result['state']=='STOPPED_BLOCKED' else '_evidence/pref_'+result['run_id']+'/READY.json')
              result['new_campaign_control_receipt']=c.put_new(object_name,enc(result),'NEW_AB144_STATE_CREATE')
             except Exception as e:result['state']='STOPPED_BLOCKED';result['storage_error_type']=type(e).__name__
           print('AB144_PREFLIGHT_RESULT='+json.dumps(result,separators=(',',':'),ensure_ascii=True))
           if result['state']=='STOPPED_BLOCKED':sys.exit(1)
          if __name__=='__main__':main()
          AB144_PY
          python "$RUNNER_TEMP/ab144_preflight.py"
