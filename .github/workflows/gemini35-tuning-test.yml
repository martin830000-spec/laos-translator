name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  compare288:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      COMPARE288_MODE: "STAGE2"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "b2168fae0b01f26beca7c9f01a5015f76a75df606f52bd9e4fb20a994517853e"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "06283327db0c358e3e316fae1c755e7b417d695f4cac06f336ad205f965704a6"
      RUNNER_SHA256: "4128543723807d20652cfd27e49042fb8f686716132776653d416f4569d9be0a"
      DRY_READY_SHA256: "fed8468648a2e1ab78bddf3604a0d2dc5873774dbc4632c7fb6a3e47de45c25b"
      PACKET_SHA256: "0255db9259564cd0fe0d8c44717fed1d62365a8f0472f0dfbfe1fb09403c832a"
      PREFLIGHT_READY_SHA256: "d285874c79385082ad32c1d494cee694d06a989d29aa8202fad08536a3e7455f"
      PREVIOUS_STAGE_SUMMARY_SHA256: "248db45dda355645781170f6517d9d6d83e4a54008412a851d7ea921a5990975"
      ROUNDTRIP_VERIFIED_SHA256: "b19c6e2501872490e9468a1c4f3e1b2d1fa66af110476e2823219ca3830f137b"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run bounded COMPARE288 mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64, hashlib, os
          from pathlib import Path
          files = {'compare288_runner.py': '', 'transport_crypto.mjs': '', 'output_public.pem': '', 'INPUT_ENVELOPE.json': '', 'INPUT_HEADER.json': '', 'ROUNDTRIP_VERIFIED.json': '', 'STAGE_GATE.json': ''}
          hashes = {'compare288_runner.py': '4128543723807d20652cfd27e49042fb8f686716132776653d416f4569d9be0a', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'output_public.pem': '06283327db0c358e3e316fae1c755e7b417d695f4cac06f336ad205f965704a6', 'INPUT_ENVELOPE.json': 'c2730497443f19bcab1763c60c52ade219319d460d38cc02b998bce9631697ec', 'INPUT_HEADER.json': '5c541418e9a09d1550fb958d63e8c06176fa91b66834bf39123ca24de071cc46', 'ROUNDTRIP_VERIFIED.json': 'b19c6e2501872490e9468a1c4f3e1b2d1fa66af110476e2823219ca3830f137b', 'STAGE_GATE.json': '6cc7b634c5210aa66a29d4e58208094b3aee01c7b432168539305e0fa1e24567'}
          for name, value in files.items():
              raw = base64.b64decode(value, validate=True)
              assert hashlib.sha256(raw).hexdigest() == hashes[name]
              p = Path(os.environ['RUNNER_TEMP']) / name
              with p.open('xb') as f: f.write(raw)
              p.chmod(0o600)
          PYCODE
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export INPUT_ENVELOPE="$RUNNER_TEMP/INPUT_ENVELOPE.json"
          export INPUT_HEADER="$RUNNER_TEMP/INPUT_HEADER.json"
          export ROUNDTRIP_VERIFIED="$RUNNER_TEMP/ROUNDTRIP_VERIFIED.json"
          export STAGE_GATE="$RUNNER_TEMP/STAGE_GATE.json"
          python3 "$RUNNER_TEMP/compare288_runner.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compare288-stage2-${{ github.run_id }}
          path: ${{ runner.temp }}/compare288_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
