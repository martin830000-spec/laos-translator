name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  r3-pincheck:
    if: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read-only full twenty-two pin comparison
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json,base64,zlib,urllib.request,urllib.error,urllib.parse,subprocess,hashlib,sys
          b64=''
          pins=json.loads(zlib.decompress(base64.b64decode(b64)))
          assert len(pins)==22
          token=subprocess.check_output(['gcloud','auth','print-access-token'],text=True,stderr=subprocess.DEVNULL,timeout=30).strip()
          bucket='ko-lao-gemini35-tuning-460077888071'
          prefix='sft_fourpath_baseline96_r3_20261121/'
          def get(u):
           req=urllib.request.Request(u,headers={'Authorization':'Bearer '+token},method='GET')
           try:
            with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read(1000000)
           except urllib.error.HTTPError as e:return e.code,e.read(1000000)
          def inv():
           u='https://storage.googleapis.com/storage/v1/b/'+bucket+'/o?'+urllib.parse.urlencode({'prefix':prefix,'maxResults':200})
           code,b=get(u);return code,len(json.loads(b).get('items',[])) if code==200 else -1
          def pinscan(label):
           checked=0;good=0;bad=[]
           for name,gen,sz,digest in pins:
            checked+=1;base='https://storage.googleapis.com/storage/v1/b/'+bucket+'/o/'+urllib.parse.quote(name,safe='')
            status,raw=get(base+'?fields=name%2Csize%2Cgeneration')
            if status!=200:bad.append([checked,'metadata',status]);continue
            try:
             m=json.loads(raw)
             if (m.get('name'),str(m.get('generation')),int(m.get('size')))!=(name,str(gen),sz):bad.append([checked,'pin_mismatch']);continue
            except Exception:bad.append([checked,'meta_parse']);continue
            status,raw=get(base+'?'+urllib.parse.urlencode({'alt':'media','generation':gen}))
            if status!=200:bad.append([checked,'body',status]);continue
            try:
             j=json.loads(raw)
             ok=len(raw)==sz and hashlib.sha256(raw).hexdigest()==digest and j.get('enabled') is False and j.get('max_new')==0 and j.get('next_new_authorization')==0
             if ok:good+=1
             else:bad.append([checked,'body_or_closed_mismatch'])
            except Exception:bad.append([checked,'body_parse'])
           print('R3_PIN_SCAN '+json.dumps({'stage':label,'checked':checked,'matched':good,'errors':bad},sort_keys=True))
           return good==22
          before=inv();print('R3_PREFIX_START '+json.dumps({'status':before[0],'count':before[1]}))
          initial=pinscan('START');final=pinscan('END')
          after=inv();print('R3_PREFIX_END '+json.dumps({'status':after[0],'count':after[1]}))
          print('R3_REMOTE_READONLY_VERDICT '+json.dumps({'all22_start':initial,'all22_end':final,'new_prefix_empty':before==(200,0) and after==(200,0),'generation_api_posts':0}))
          sys.exit(0 if initial and final and before==(200,0) and after==(200,0) else 2)
          PY
