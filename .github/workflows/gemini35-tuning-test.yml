name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  lex1-stress48:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      STRESS48_STAGE: "FINALIZE"
      R4CHAIN_MODE: "FINALIZE"
      R4CHAIN_STAGE: "FINALIZE"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "140db0891aa99ef8ca25c2e76b21b18e0a46c6977bd945c0cc0b66028cf434b8"
      OWNER_REVIEW_SHA256: "2d6dcb11311665f0f769c4de19c82ca52335bcf89f801c240d353606bb39106b"
      OWNER_REVIEW_EXPECTED_SHA256: "2d6dcb11311665f0f769c4de19c82ca52335bcf89f801c240d353606bb39106b"
      COMMON_SCRIPT_SHA256: "6277620c2923f23afce726b9ff213bf18d66bc963c7b53749b57bb22778d7fb8"
      ENTRY_SCRIPT_SHA256: "2d6dcb11311665f0f769c4de19c82ca52335bcf89f801c240d353606bb39106b"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "71425f4ab240ff5fc615a4542b444214342e31bb8f7df059a9ec468cf6acc04b"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded LEX1 STRESS48 FINALIZE
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'FREEQA_FILES'
          import os,base64,hashlib,gzip
          from pathlib import Path
          files={'scripts/stress_gcs_contract.py': '', 'scripts/stress_common.py': '', 'scripts/stress_remote.py': '', 'scripts/stress_runner.py': '', 'scripts/stress_offline.py': '', 'scripts/technical_guard_v2.py': '', 'scripts/script_status.py': '', 'scripts/transport_crypto.mjs': '', 'tests/test_stress_runner.py': '', 'guard/sitecustomize.py': '', 'qa/PLANNED_96_SLOTS.json': '', 'qa/MODEL_AND_SETTINGS.json': '', 'qa/SOURCE_PROVENANCE.json': '', 'qa/DEVELOPMENT_CASES.json': '', 'qa/PROMPTS.json': '', 'package/KO_LAO_LAO_SCRIPT_PILOT_QA_V31_20261119.zip': '', 'package/verify_stress48.py': '', 'package/test_verify_contract.py': '', 'package/STRESS48_FROZEN_METADATA.json': '', 'code_pins.json': '', 'output_public.pem': '', 'stress_config.json': ''}
          hashes={'scripts/stress_gcs_contract.py': '8464e1081b7b1aafb692bd07633688c95635c6fd2c782d7c1586ce94e34ab28f', 'scripts/stress_common.py': '6277620c2923f23afce726b9ff213bf18d66bc963c7b53749b57bb22778d7fb8', 'scripts/stress_remote.py': '2d6dcb11311665f0f769c4de19c82ca52335bcf89f801c240d353606bb39106b', 'scripts/stress_runner.py': '62bb6d578e73fa8b3f86f1164ff304b57a717210ffc1bbd94fc67030a7c22cd9', 'scripts/stress_offline.py': '3287af5710ea600478fe4043a9fa31c5a28c52dded2470d690b97b7bfa2dfd45', 'scripts/technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'scripts/script_status.py': '78db76894a57ce67a976608d982383d0273beebbd72b2077dcdd49ef94892704', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'tests/test_stress_runner.py': 'a4a5ac9ae6d17f84696de2e62eb5d35b98adc0c19ecca8fdb3a9214a11ad2f11', 'guard/sitecustomize.py': 'c9dd3b5705ebfb842adb1b0a0f1ce30ab0a30fc635c76ceb8416e86789cf365d', 'qa/PLANNED_96_SLOTS.json': '82513222d445078877782b36a65cb805d3226901f16f7c6ab966dfb714d4e8c0', 'qa/MODEL_AND_SETTINGS.json': 'ddc5eca3bd932c314efde24ec0c6ed4137c94be49ac3448b533212e7986df57e', 'qa/SOURCE_PROVENANCE.json': 'e5b9205e86e4edc6fda362bd455b6b7e798cc90c44dc37b84c6d94dd117c76e9', 'qa/DEVELOPMENT_CASES.json': '72390e5072a3ca9384bb7c34a38ce4ff675f8c1c88f065726435fc175074cff5', 'qa/PROMPTS.json': '50b8396165377b908750c5b97404a1643858d7695a2f12d6839027a6306c8fe8', 'package/KO_LAO_LAO_SCRIPT_PILOT_QA_V31_20261119.zip': 'b74f8c1786509a08af692bed37bf62cf6cb3fac594e02c56449657222a09637c', 'package/verify_stress48.py': 'a1d5b222d64c0f66842b3c518b8f422ae9ac1dfe66f16c0c9ecd16fb87ff1795', 'package/test_verify_contract.py': '6ccbecf88c2ce71eacfbb8f2343b76f02d0a0c148a509af6ce4c6ca894ac159d', 'package/STRESS48_FROZEN_METADATA.json': '3e77053e3ae42896dacc89b9f4215b423843870b719b0fb61e8d081225d11db5', 'code_pins.json': '8bf499fff2d26a479e35a0ed2d750bb743378c4d248b27c34af10ea75381056d', 'output_public.pem': '71425f4ab240ff5fc615a4542b444214342e31bb8f7df059a9ec468cf6acc04b', 'stress_config.json': '3f951c1b76f90a78c80926fa518dda1e87759f4ff421405a7914033227e9c099'}
          for n,v in files.items():
           b=gzip.decompress(base64.b64decode(v,validate=True)); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          FREEQA_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/scripts/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/scripts/stress_remote.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: lex1-stress48-finalize-${{ github.run_id }}
          path: ${{ runner.temp }}/r4chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
