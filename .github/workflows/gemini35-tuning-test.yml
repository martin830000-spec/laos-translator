name: TEST R16 recipient object metadata check
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-tuning-test-recipient-metadata
  cancel-in-progress: false
jobs:
  metadata-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Compare current object metadata only (no object body access)
        shell: bash
        run: |
          set -euo pipefail
          test "$ENABLE_GENERATION" = false
          test "$ENABLE_TUNING" = false
          python - <<'PY'
          import json,subprocess
          bucket='gs://ko-lao-gemini35-tuning-460077888071/'
          name='gemini4_hydrogen_developer_direct2_20261122/_control/INPUT_PRIVATE_RSA_3072.pem'
          p=subprocess.run(['gcloud','storage','objects','describe',bucket+name,'--format=json'],capture_output=True,timeout=45)
          if p.returncode:
              print('RECIPIENT_METADATA_LOOKUP_FAILED',flush=True)
              raise SystemExit(1)
          m=json.loads(p.stdout)
          print('RECIPIENT_METADATA_PRESENT=true')
          print('GENERATION_MATCH='+str(str(m.get('generation'))=='1795301886515458').lower())
          print('GENERATION_FIELD_PRESENT='+str('generation' in m).lower())
          print('SIZE_METADATA='+str(m.get('size','unavailable')))
          print('CUSTOM_METADATA_PRESENT='+str(bool(m.get('metadata') or m.get('custom_metadata'))).lower())
          print('OBJECT_BODY_READS=0 MODEL_POSTS=0 GCS_WRITES=0')
          if str(m.get('generation'))!='1795301886515458':raise SystemExit(1)
          PY
