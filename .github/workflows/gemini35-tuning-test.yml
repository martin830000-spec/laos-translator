name: Gemini 3.5 BASE LB AB108 — existing TEST workflow FREE_PREFLIGHT
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-base-lb-ab108-20261122
  cancel-in-progress: false
jobs:
  authorized-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Materialize existing immutable runner and CMS encrypted inputs (no checkout)
        env:
          RESEARCH_DIR: ${{ runner.temp }}/gemini35-lb-ab108
        run: |
          python - <<'PYBUNDLE'
          import base64,hashlib,io,os,pathlib,zipfile
          buf=base64.b64decode('')
          assert hashlib.sha256(buf).hexdigest() == '2da6fce65875f13caf67dd8ee45496ab9b8bd939daaf368d1fd74dfc2f83820d', 'BUNDLE_SHA_MISMATCH'
          dst=pathlib.Path(os.environ['RESEARCH_DIR']);dst.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(buf)) as z:
              assert z.testzip() is None, 'BUNDLE_CRC_MISMATCH'
              names=z.namelist()
              assert len(names) == 8 and all('/' not in n and '..' not in n for n in names), 'BUNDLE_PATH_INVALID'
              z.extractall(dst)
          print('ENC_SOURCE_BUNDLE_VERIFIED',len(names))
          PYBUNDLE
      - name: Compile immutable runner and transport (no network calls)
        run: |
          python -m py_compile "$RUNNER_TEMP/gemini35-lb-ab108/runner.py" "$RUNNER_TEMP/gemini35-lb-ab108/transport.py" "$RUNNER_TEMP/gemini35-lb-ab108/test_runner.py"
      - name: Authenticate existing WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        uses: google-github-actions/setup-gcloud@v3
      - name: Existing guarded runner — FREE_PREFLIGHT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESULT_DIR: ${{ runner.temp }}/gemini35-ab108-results
        run: python "$RUNNER_TEMP/gemini35-lb-ab108/runner.py" FREE_PREFLIGHT
      - name: Preserve encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini35-lb-ab108-FREE_PREFLIGHT-encrypted
          path: ${{ runner.temp }}/gemini35-ab108-results/evidence.p7m
          if-no-files-found: error
          retention-days: 7
