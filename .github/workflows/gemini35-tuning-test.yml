name: Assisted4 R2 existing API key metadata only
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: ko-lao-assisted4-free-preflight-r2-20261122
  cancel-in-progress: false
jobs:
  existing-key-readonly:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Existing Gemini key models GET only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_GENERATION: "false"
          REPORT_PATH: ${{ runner.temp }}/assisted4-key/API_KEY_MODEL_GET.json
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${RUNNER_TEMP}/assisted4-key"
          python3 -m py_compile research/assisted4-r2-free-20261122/api_key_metadata.py
          python3 research/assisted4-r2-free-20261122/api_key_metadata.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: assisted4-key-${{ github.run_id }}
          path: ${{ runner.temp }}/assisted4-key/
          if-no-files-found: error
          retention-days: 7
