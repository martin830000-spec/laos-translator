name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7

  stream24-closed-readonly-audit:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      S24_READONLY_AUDIT: "true"
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      S24_FINAL_GENERATION: "1795269519312777"
      S24_FINAL_SHA: "dd957980525dff13f2ee4871f0c9ca85578054e61da4c22f2144d66eece8c4e3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Immutable 28 old locks, 24 SSE raw responses & request/result triples, offline SSE replay, exact GCS inventory — GET only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo '7eac9851633a25dd4449e161df3409d8931c50f72aeaff3e0ae824913f30edbb  .github/s24_readonly_audit.py' | sha256sum -c -
          echo 'ac76ad213cce6eb672685c3017c8226d3e8a2f5e2f5081526f1a283049f36e6f  .github/s24_runner.py' | sha256sum -c -
          echo 'f1be1ba589f2aaf2649750ccaea23a3ba14b73441de47767a007f82527e56f01  .github/PINS28.json' | sha256sum -c -
          python3 .github/s24_readonly_audit.py TEST
          python3 -O .github/s24_readonly_audit.py TEST
          export S24_OUTPUT_CMS="$RUNNER_TEMP/stream24_full_raw_audit_owner.cms.p7m"
          export S24_AUDIT_PUBLIC_PATH="$RUNNER_TEMP/stream24_audit_public.json"
          python3 .github/s24_readonly_audit.py
          test -s "$RUNNER_TEMP/stream24_full_raw_audit_owner.cms.p7m"
          test -s "$RUNNER_TEMP/stream24_audit_public.json"
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: stream24-postclose-audit-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stream24_full_raw_audit_owner.cms.p7m
            ${{ runner.temp }}/stream24_audit_public.json
          retention-days: 7
          if-no-files-found: error
