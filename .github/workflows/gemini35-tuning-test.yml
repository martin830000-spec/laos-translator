name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  link8-research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      LINK8_STAGE: "BOOTSTRAP"
      R4CHAIN_MODE: "BOOTSTRAP"
      R4CHAIN_STAGE: "BOOTSTRAP"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "e40196b99332096005acb93b72a2107bb33890a87945264dd41d1e127cdcfc6b"
      OWNER_REVIEW_SHA256: "34fa2dad3e18fe1386f807b90dc72760b31940e0f7e607f40723569204fefeaf"
      OWNER_REVIEW_EXPECTED_SHA256: "34fa2dad3e18fe1386f807b90dc72760b31940e0f7e607f40723569204fefeaf"
      COMMON_SCRIPT_SHA256: "230a8a0465c5c80bc31393b9601195d1b660e86921321125ce4083eeaaf53374"
      ENTRY_SCRIPT_SHA256: "34fa2dad3e18fe1386f807b90dc72760b31940e0f7e607f40723569204fefeaf"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "f77b853f18274c513d01476042107a59b9f0f6c250fd6abae6ebc3e776456f31"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded LINK8 BOOTSTRAP
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'FREEQA_FILES'
          import os,base64,hashlib
          from pathlib import Path
          files={'scripts/freeqa_offline.py': '', 'scripts/freeqa_remote.py': '', 'scripts/link8_previous.py': '', 'scripts/ab_previous.py': '', 'scripts/anchor_extractors.py': '', 'scripts/ab_input_verify.py': '', 'scripts/link8_remote.py': '', 'scripts/link8_runner.py': '', 'scripts/r4_fixture_test.py': '', 'scripts/ab_run.py': '', 'scripts/link8_common.py': '', 'scripts/ab_common.py': '', 'scripts/chain_gate.py': '', 'scripts/technical_guard_v2.py': '', 'scripts/test_offline_v2.py': '', 'scripts/transport_crypto.mjs': '', 'tests/test_link8_runner.py': '', 'tests/test_freeqa_boundary.py': '', 'tests/test_metadata_integrity.py': '', 'tests/test_step1_repair.py': '', 'tests/test_link8_plan.py': '', 'patch/ab_input_verify_hardened.py': '', 'patch/STEP2_METADATA_VALIDATOR.patch': '', 'plan/LINK8_PLAN_SHA256.txt': 'NzI2NWYwYjAxMTEyYjEyODk3NDlmNzg4MTc5NDA1MDlhYmM0N2VlZTZkNmZkMDFkOTA0NmJlMGNhZjBhNTBkOCAgTElOSzhfRlJPWkVOX1BMQU4uanNvbgo=', 'plan/LINK8_FROZEN_PLAN.json': '', 'code_pins.json': '', 'output_public.pem': ''}
          hashes={'scripts/freeqa_offline.py': '36b193eef63b80a2abe30eb023af39f160cc2bdd08ac9b66b0cceb60062ce5d9', 'scripts/freeqa_remote.py': '0fa71cb3d612fe29952cca3809f914f58718a12be0457b9ebb0c7c8156a0ba22', 'scripts/link8_previous.py': '20618c334302a49e457b2a5744fec36cc625cc2db95f0d2d4152be001d85de93', 'scripts/ab_previous.py': '44c12c39f9b64bc72a59e17fccf6c75957e4f7ac6ae60e80c296c30d24d9ecbf', 'scripts/anchor_extractors.py': '1d243e3d083a8a8979fc29c053243481894de138d04527e6a05eb66852888e1c', 'scripts/ab_input_verify.py': '29da23185aeb87f8d6b38c43b807cbd0cf3fcfc313400a856e52c3854e71a6e5', 'scripts/link8_remote.py': '34fa2dad3e18fe1386f807b90dc72760b31940e0f7e607f40723569204fefeaf', 'scripts/link8_runner.py': '6e2b41ac9e29cae1ce2a635d0e6026c4a9e711e32f2621f5f6d7160b92bc7cd1', 'scripts/r4_fixture_test.py': 'f50ff50a031358deb18ccef50463798581db28feca90ffd70a73329f48e69ac4', 'scripts/ab_run.py': '72757984fdf664c06a2bc24e0899acb147b9db19acf8fad3956d847f6f4e3430', 'scripts/link8_common.py': '230a8a0465c5c80bc31393b9601195d1b660e86921321125ce4083eeaaf53374', 'scripts/ab_common.py': '657d166146e86f8b9d6cf7b847084404b7ba4735966b92ebf0a99af77a8aee9e', 'scripts/chain_gate.py': '0bbafa67211bceacea697d670394fc27417277257a0294231b47463c793f9647', 'scripts/technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'scripts/test_offline_v2.py': '0a8eafc3914d5f713f71679267752ffdeea6650aab88244c93b17fd9cb05d2e4', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'tests/test_link8_runner.py': '31c7ea1142e9de17236c90f56fe7c7afcb7ab3a5714fcab2f14a7a99a1e13fcf', 'tests/test_freeqa_boundary.py': 'a25497424283b40003739a7a96b45f4df47ec86b5a07e4129ecfe0c013f540e4', 'tests/test_metadata_integrity.py': '2cef372f6243b113e6a1fc76593ccea15d96a39b678f163c1f2ccf26290d4ab6', 'tests/test_step1_repair.py': '7c406ddc0b765e9b8c4acbf7d82e9851f00966f4ba3cb16f9085dd4321c968c4', 'tests/test_link8_plan.py': '8960d985ee8f2e