name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  lex1-synth48:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      SYNTH48_STAGE: "A2"
      R4CHAIN_MODE: "RUN"
      R4CHAIN_STAGE: "A2"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "921f4b33a0a1c63fd2ab4510b1a1f74cd54d6edc29824571c407d04afe63aa49"
      OWNER_REVIEW_SHA256: "f94f6e499935f3dfbc48c9c308b8b7231aaae4be1127443b814351c627bd35de"
      OWNER_REVIEW_EXPECTED_SHA256: "f94f6e499935f3dfbc48c9c308b8b7231aaae4be1127443b814351c627bd35de"
      COMMON_SCRIPT_SHA256: "fc20ed4edbca22db27bd4ff493c06dbd27b82f4c9fb19795ddf4c5eff5a5f531"
      ENTRY_SCRIPT_SHA256: "f94f6e499935f3dfbc48c9c308b8b7231aaae4be1127443b814351c627bd35de"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "be103c4815c775467586270d1661d9550494d53f22866fd551e8b5ce257884bb"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Bounded LEX1 SYNTH48 A2
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'FREEQA_FILES'
          import os,base64,hashlib,gzip
          from pathlib import Path
          files={'scripts/stress_gcs_contract.py': '', 'scripts/stress_common.py': '', 'scripts/stress_remote.py': '', 'scripts/stress_runner.py': '', 'scripts/stress_offline.py': '', 'scripts/technical_guard_v2.py': '', 'scripts/script_status.py': '', 'scripts/transport_crypto.mjs': '', 'tests/test_stress_runner.py': '', 'guard/sitecustomize.py': '', 'qa/PLANNED_96_SLOTS.json': '', 'qa/MODEL_AND_SETTINGS.json': '', 'qa/SOURCE_PROVENANCE.json': '', 'qa/DEVELOPMENT_CASES.json': '', 'qa/PROMPTS.json': '', 'package/KO_LAO_LAO_SCRIPT_PILOT_QA_V31_20261119.zip': '', 'package/EMPTY_AB48_SCORECARD.csv': '', 'package/test_verify_synth48.py': '', 'package/KO_LAO_LEX1_NEXT48_OFFLINE_REVIEW_20261119.zip': '', 'package/verify_synth48.py': '', 'review/NEXT_48_FROZEN_SLOTS.json': '', 'code_pins.json': '', 'output_public.pem': '', 'stress_config.json': ''}
          hashes={'scripts/stress_gcs_contract.py': '8464e1081b7b1aafb692bd07633688c95635c6fd2c782d7c1586ce94e34ab28f', 'scripts/stress_common.py': 'fc20ed4edbca22db27bd4ff493c06dbd27b82f4c9fb19795ddf4c5eff5a5f531', 'scripts/stress_remote.py': 'f94f6e499935f3dfbc48c9c308b8b7231aaae4be1127443b814351c627bd35de', 'scripts/stress_runner.py': '6d4ee333e5781c1031371dfac656aad5917ed906d9cfaf6d1cbe20716215a5d0', 'scripts/stress_offline.py': '084bf89b6893958cad37e3d00c5c04346b47b895402df365d7ad41fbe2b4aa3b', 'scripts/technical_guard_v2.py': 'b0cd8cb24d68d2635b29bb189a001f94102816e9b5020f4ea83776125266b1fe', 'scripts/script_status.py': '78db76894a57ce67a976608d982383d0273beebbd72b2077dcdd49ef94892704', 'scripts/transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'tests/test_stress_runner.py': '6e0a76f445fb5943f79947cfac6f8209e7f6ca4761052eafd7a80738604ab332', 'guard/sitecustomize.py': 'c9dd3b5705ebfb842adb1b0a0f1ce30ab0a30fc635c76ceb8416e86789cf365d', 'qa/PLANNED_96_SLOTS.json': '82513222d445078877782b36a65cb805d3226901f16f7c6ab966dfb714d4e8c0', 'qa/MODEL_AND_SETTINGS.json': 'ddc5eca3bd932c314efde24ec0c6ed4137c94be49ac3448b533212e7986df57e', 'qa/SOURCE_PROVENANCE.json': 'e5b9205e86e4edc6fda362bd455b6b7e798cc90c44dc37b84c6d94dd117c76e9', 'qa/DEVELOPMENT_CASES.json': '72390e5072a3ca9384bb7c34a38ce4ff675f8c1c88f065726435fc175074cff5', 'qa/PROMPTS.json': '50b8396165377b908750c5b97404a1643858d7695a2f12d6839027a6306c8fe8', 'package/KO_LAO_LAO_SCRIPT_PILOT_QA_V31_20261119.zip': 'b74f8c1786509a08af692bed37bf62cf6cb3fac594e02c56449657222a09637c', 'package/EMPTY_AB48_SCORECARD.csv': 'caf75f91c015d6bb2e60c67b2551225799c36052912c56cfdfd3cbda8219a61f', 'package/test_verify_synth48.py': '269eee3e0ab66ff4337ddb2152a79840d79f5c00d42c894e8546621e54a5699f', 'package/KO_LAO_LEX1_NEXT48_OFFLINE_REVIEW_20261119.zip': '254c026af96d90d2cc3f016a384ab96c6df8a57908f14c1f258124c15a83ca12', 'package/verify_synth48.py': 'e88d228b606388f2a4bdfe706a155c1d1fe51b010b191f7f94a0e0fed6a73448', 'review/NEXT_48_FROZEN_SLOTS.json': 'f5ff1a7df51fdebb293d0b74f70e91a25c7625579d6fa8ff37bb665d226fac2a', 'code_pins.json': '551dc6116e998cc776d45e49dfa37898f19478e7d5036ca54e1341c8906a98e9', 'output_public.pem': 'be103c4815c775467586270d1661d9550494d53f22866fd551e8b5ce257884bb', 'stress_config.json': '3a6f53ce6997b9dff6368ed01230fc0c0be4c77976308add9c603b64db0bf259'}
          for n,v in files.items():
           b=gzip.decompress(base64.b64decode(v,validate=True)); assert hashlib.sha256(b).hexdigest()==hashes[n]
           p=Path(os.environ['RUNNER_TEMP'])/n
           p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
           with p.open('xb') as f:f.write(b);f.flush();os.fsync(f.fileno())
           p.chmod(0o600)
          FREEQA_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/scripts/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          python3 "$RUNNER_TEMP/scripts/stress_remote.py"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: lex1-synth48-a2-${{ github.run_id }}
          path: ${{ runner.temp }}/r4chain_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
