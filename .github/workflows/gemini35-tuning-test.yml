name: Gemini 3.5 V2 Final Evidence Read Only
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-finalize-read-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "FINALIZE_READ_ONLY"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      COLLECTOR: ${{ runner.temp }}/closeout_readonly.py
      CRYPTO_SCRIPT: ${{ runner.temp }}/transport_crypto.mjs
      OUTPUT_PUBLIC_KEY: ${{ runner.temp }}/closeout_public.pem
      COLLECTOR_SHA256: "19d11ed520567e513a71cf00ceac8137e3a4ffa92081bbfac8d0e95182ef3ca5"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "991dd5041c7f258d9039232e63eb9af54cdd49d98ab47b66eb1da1d38d410239"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Recover existing evidence with GET only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64, os
          from pathlib import Path
          files = {'closeout_readonly.py': '', 'transport_crypto.mjs': '', 'closeout_public.pem': ''}
          for name, value in files.items():
              path = Path(os.environ['RUNNER_TEMP']) / name
              with path.open('xb') as handle:
                  handle.write(base64.b64decode(value, validate=True))
              path.chmod(0o600)
          PYCODE
          python3 "$COLLECTOR"
      - name: Preserve only encrypted evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-closeout-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_closeout_encrypted.json
          if-no-files-found: error
          retention-days: 7
