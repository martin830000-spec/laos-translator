name: Gemini 3.5 V2 Recovery Controlled TEST
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: gemini35-sft-v2-pilot1-20261116
  cancel-in-progress: false
jobs:
  v2-recovery:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
    steps:
      - name: Check out designated TEST branch
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate existing TEST identity
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI path
        if: ${{ env.V2_MODE != 'CLOSED' }}
        uses: google-github-actions/setup-gcloud@v3
      - name: Execute reviewed bounded TEST mode
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          echo 'V2_CLOSED_NO_ACTION enabled=false max_new=0 next_new_authorization=0'
      - name: Preserve encrypted evidence only
        if: ${{ always() && env.V2_MODE != 'CLOSED' }}
        uses: actions/upload-artifact@v4
        with:
          name: v2-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/v2_execution_encrypted.json
          if-no-files-found: error
          retention-days: 7
  realdb84-repeat448:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      REPEAT448_MODE: "FINALIZE"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "false"
      WORKORDER_SHA256: "a200f71c761fd76cdde722a01aa0c05c80ea92bbc32251a6a506ae8277062093"
      OWNER_REVIEW_SHA256: "b442ee412a90bd6bf4c523a3bc98dfccb5adcc181ab9ab1a2200315564cd6815"
      OWNER_REVIEW_EXPECTED_SHA256: "b442ee412a90bd6bf4c523a3bc98dfccb5adcc181ab9ab1a2200315564cd6815"
      INPUT_KEY_PUBLIC_SHA256: "d0ceed0d2d48d75380ddaf4de095e17e4826ce172e3399da19da26ffbbb5a093"
      FINALIZE_SCRIPT_SHA256: "45d942ddb99ca4bac258caafc4905d61b0e6e28bd81d8142280f1cdaa0d8bf94"
      COMMON_SCRIPT_SHA256: "dbd412801b4769fa0f95747930548add9c69da2c9f94ad2b9df6e11bdf2e9820"
      CRYPTO_SCRIPT_SHA256: "3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c"
      OUTPUT_PUBLIC_KEY_SHA256: "db1167e0f1da92f62180a8825de7a28578c257ed75da10f1f8f117bd2b6ab118"
      INPUT_KEY_RECEIPT_SHA256: "f9f8759b11170f8b27b4a20e5847aa3bd4bd03e79ec0c9ad2cec853a2cfac6dc"
      FINALIZATION_ENVELOPE_SHA256: "181e584d29c23d7a088fb2f7665f758f352cc64aed300b8fdf36105bd3fdde08"
      EXPECTED_FINALIZATION_HEADER_SHA256: "e6ceadaa2de7d82e52c7ef5d202b0e1310b5c7104ab45bed659095e9b869d0a0"
    steps:
      - name: Check out designated TEST branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate unchanged TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Set up existing Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run reviewed REPEAT448 FINALIZE
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'REPEAT448_FILES'
          import base64,hashlib,os
          from pathlib import Path
          files = {'repeat448_finalize.py': '', 'repeat448_common.py': '', 'transport_crypto.mjs': '', 'output_public.pem': '', 'input_key_receipt.json': '', 'finalization.envelope.json': '', 'finalization_header.json': ''}
          hashes = {'repeat448_finalize.py': '45d942ddb99ca4bac258caafc4905d61b0e6e28bd81d8142280f1cdaa0d8bf94', 'repeat448_common.py': 'dbd412801b4769fa0f95747930548add9c69da2c9f94ad2b9df6e11bdf2e9820', 'transport_crypto.mjs': '3f6cc19ff109dc64ac6dfcd43eac82eb7d83b1f0df9ab201a77c1c7cd71eef9c', 'output_public.pem': 'db1167e0f1da92f62180a8825de7a28578c257ed75da10f1f8f117bd2b6ab118', 'input_key_receipt.json': 'f9f8759b11170f8b27b4a20e5847aa3bd4bd03e79ec0c9ad2cec853a2cfac6dc', 'finalization.envelope.json': '181e584d29c23d7a088fb2f7665f758f352cc64aed300b8fdf36105bd3fdde08', 'finalization_header.json': 'e6ceadaa2de7d82e52c7ef5d202b0e1310b5c7104ab45bed659095e9b869d0a0'}
          for name,value in files.items():
              raw=base64.b64decode(value,validate=True)
              assert hashlib.sha256(raw).hexdigest()==hashes[name]
              p=Path(os.environ['RUNNER_TEMP'])/name
              with p.open('xb') as f:
                  f.write(raw)
                  f.flush()
                  os.fsync(f.fileno())
              p.chmod(0o600)
          REPEAT448_FILES
          export CRYPTO_SCRIPT="$RUNNER_TEMP/transport_crypto.mjs"
          export OUTPUT_PUBLIC_KEY="$RUNNER_TEMP/output_public.pem"
          export INPUT_KEY_RECEIPT="$RUNNER_TEMP/input_key_receipt.json"
          export FINALIZATION_ENVELOPE="$RUNNER_TEMP/finalization.envelope.json"
          export EXPECTED_FINALIZATION_HEADER="$RUNNER_TEMP/finalization_header.json"
          python3 "$RUNNER_TEMP/repeat448_finalize.py"
      - name: Preserve encrypted evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: realdb84-repeat448-finalize-${{ github.run_id }}
          path: ${{ runner.temp }}/repeat448_encrypted_evidence.json
          if-no-files-found: error
          retention-days: 7
