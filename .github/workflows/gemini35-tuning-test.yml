    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      FMT1_STAGE: "B2"
      R4CHAIN_MODE: "RUN"
      R4CHAIN_STAGE: "B2"
      V2_MODE: "CLOSED"
      ENABLE_TUNING: "false"
      ENABLE_GENERATION: "true"
      WORKORDER_SHA256: "7a25c78cb5ee1f625034172a1228dfde782bba75e2a8b7fa486c94ef3c4a827d"
      OWNER_REVIEW_SHA256: "5fd7b77ea573b21157949804bf35e625e1d06ce09f2cb50bfdbd3904681d61d9"
