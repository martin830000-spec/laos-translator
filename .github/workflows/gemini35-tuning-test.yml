name: G35 contrast lexical fewshot32 existing TEST FREE_PREFLIGHT
"on":
  push:
    branches: [research/gemini35-tuning-test]
    paths: [.github/workflows/gemini35-tuning-test.yml]
permissions:
  contents: read
concurrency:
  group: g35-contrast32-20261124
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/gemini35-tuning-test' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    env:
      ENABLE_GENERATION: "false"
      ENABLE_TUNING: "false"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Materialize CMS-only input and frozen runner
        env:
          BUNDLE_PART_0: ""
          BUNDLE_PART_1: ""
          BUNDLE_PART_2: ""
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PYBUNDLE'
          import base64,hashlib,io,os,pathlib,zipfile
          blob=base64.b64decode(os.environ["BUNDLE_PART_0"]+os.environ["BUNDLE_PART_1"]+os.environ["BUNDLE_PART_2"])
          if hashlib.sha256(blob).hexdigest()!='d9a1bd358f10d6aa8215e18d8d1ef21eea0956514e22b1c5beb1bf620e1ed4d2':raise RuntimeError('BUNDLE_TAMPER')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'g35-contrast32'
          dest.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              if z.testzip() is not None:raise RuntimeError('BUNDLE_CRC')
              names=z.namelist()
              if len(names)!=9 or any('/' in x or '..' in x or x.startswith('.') for x in names):raise RuntimeError('BUNDLE_MEMBER_SCOPE')
              z.extractall(dest)
          print('BUNDLE_OK_CMS_ONLY',len(names))
          PYBUNDLE
      - name: Compile and check no paid calls in free phase
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$RUNNER_TEMP/g35-contrast32/runner.py" "$RUNNER_TEMP/g35-contrast32/transport.py" "$RUNNER_TEMP/g35-contrast32/test_runner.py"
          test "${ENABLE_GENERATION}" = "false"
      - name: Authenticate existing TEST identity
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini35-tuning
          service_account: lao-tuning-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - name: Configure existing gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Run frozen scoped FREE_PREFLIGHT gate
        env:
          RESULT_DIR: ${{ runner.temp }}/g35-contrast32/evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python "$RUNNER_TEMP/g35-contrast32/runner.py" FREE_PREFLIGHT
      - name: Upload encrypted owner evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g35-contrast32-FREE_PREFLIGHT-${{ github.run_id }}
          path: ${{ runner.temp }}/g35-contrast32/evidence/evidence.p7m
          if-no-files-found: warn
          retention-days: 7
