name: Luna LF VARIANCE320 isolated research
on:
  push:
    branches: [research/gemini-model-native500-20261107]
    paths: [.github/workflows/gpt-luna-lf-variance320.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: gpt-luna-lf-variance320-20261110
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/gemini-research
          service_account: gemini-research-runner@gen-lang-client-0422436907.iam.gserviceaccount.com
      - run: python3 -m pip install --quiet 'google-cloud-storage>=3,<4' 'httpx==0.28.1'
      - run: python3 experiments/gpt-luna-lf-variance320/preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: variance320-preflight
          path: ${{ runner.temp }}/variance320-preflight.json
          retention-days: 3
          if-no-files-found: error
