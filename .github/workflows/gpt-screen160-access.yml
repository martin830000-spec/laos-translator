name: SCREEN160 free key-binding access check
on:
  push:
    branches: [research/gemini-model-native500-20261107]
    paths: [experiments/gpt-luna-terra-screen160/access-trigger.json]
permissions:
  contents: read
jobs:
  access:
    if: github.actor == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: GET model metadata only
        env:
          OPENAI_API_KEY: ${{ secrets.GPT_API_KEY }}
        run: python3 experiments/gpt-luna-terra-screen160/access_probe.py
