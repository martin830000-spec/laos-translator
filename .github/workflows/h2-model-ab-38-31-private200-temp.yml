name: R8 Gemini 3.8 versus 3.1 private 200-case offline tests
on:
  push:
    branches:
      - 'test/h2-private-realdb200-gemini38-vs31-r1'
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/h2-model-ab-38-31-private200.test.cjs
      - name: Headless Chrome loads diagnostic without network calls
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --no-first-run --virtual-time-budget=1200 --dump-dom "file://$PWD/diagnostic-h2-simple-ab-20261017.html" > /tmp/h2-model200-dom.html 2>/tmp/h2-model200-errors.log
          grep -Fq '3.1 Flash-Lite' /tmp/h2-model200-dom.html
          grep -Fq '200건 실사용 모델 비교' /tmp/h2-model200-dom.html
          if grep -Eiq 'Uncaught (ReferenceError|TypeError|SyntaxError)|Uncaught SyntaxError:' /tmp/h2-model200-errors.log; then cat /tmp/h2-model200-errors.log; exit 1; fi
