name: Haiku R12 source-only actor scope D one-shot TEST
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: haiku-r12-actor-one-shot
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.issue.title == 'HAIKU_R12_ACTOR_SCOPE_D_20261028_ONE_SHOT' &&
      contains(github.event.issue.body, 'APPROVAL=HAIKU_R12_ACTOR_SCOPE_D_MAX_0P240USD') &&
      github.event.issue.user.login == 'martin830000-spec' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free offline R12 preflight
        run: |
          python3 -m py_compile experiments/haiku-actor-r12/actor-r12.py
          python3 experiments/haiku-actor-r12/actor-r12.py --offline
      - name: Approved single Haiku 5.5 actor scope D comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_R12_ACTOR_SCOPE_D_MAX_0P240USD
        run: python3 experiments/haiku-actor-r12/actor-r12.py
      - name: Preserve public synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-actor-r12-${{ github.run_number }}
          path: out/haiku-actor-r12.json
          retention-days: 14
          if-no-files-found: warn
