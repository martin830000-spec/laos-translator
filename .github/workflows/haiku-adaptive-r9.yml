name: Haiku R9 adaptive thinking one-shot TEST
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: haiku-r9-adaptive-one-shot
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.issue.title == 'HAIKU_R9_ADAPTIVE_20261028_ONE_SHOT' &&
      contains(github.event.issue.body, 'APPROVAL=HAIKU_R9_ADAPTIVE_MAX_0P288USD') &&
      github.event.issue.user.login == 'martin830000-spec' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free offline R9 preflight
        run: |
          python3 -m py_compile experiments/haiku-adaptive-r9/adaptive-r9.py
          python3 experiments/haiku-adaptive-r9/adaptive-r9.py --offline
      - name: Approved single Haiku 5.5 adaptive-thinking experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_R9_ADAPTIVE_MAX_0P288USD
        run: python3 experiments/haiku-adaptive-r9/adaptive-r9.py
      - name: Preserve public synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-adaptive-r9-${{ github.run_number }}
          path: out/haiku-adaptive-r9.json
          retention-days: 14
          if-no-files-found: warn
