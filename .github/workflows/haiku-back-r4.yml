name: Haiku 5.5 independent back R4 - bounded test

# User-approved total $5: automatically follows ONE successful R3 campaign.
# Never on push, PR, or schedule.
on:
  workflow_run:
    workflows: ["Haiku T2 R3 seven-arm guarded quality exploration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: haiku-back-r4-only
  cancel-in-progress: false

jobs:
  reverse-comparison:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.id == 40663852916 &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == 'martin830000-spec/laos-translator' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free static verification
        run: |
          python3 -m py_compile experiments/haiku-back-r4/back-r4.py
          python3 experiments/haiku-back-r4/back-r4.py --offline
      - name: User-approved bounded independent Haiku reverse comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_BACK_R4_MAX_0P4USD
        run: python3 experiments/haiku-back-r4/back-r4.py
      - name: Save only synthetic diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-back-r4-${{ github.run_number }}
          path: out/haiku-back-r4.json
          retention-days: 14
          if-no-files-found: warn
