name: Haiku 5.5 independent back R4 - bounded test

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: haiku-back-r4-only
  cancel-in-progress: false

jobs:
  reverse-comparison:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.issue.number == 11 &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'haiku-back-r4-once'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free static verification
        run: |
          python3 -m py_compile experiments/haiku-back-r4/back-r4.py
          python3 experiments/haiku-back-r4/back-r4.py --offline
      - name: Paid, bounded, five-arm reverse comparison (Haiku only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_BACK_R4_MAX_0P4USD
        run: python3 experiments/haiku-back-r4/back-r4.py
      - name: Save synthetic-only diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-back-r4-${{ github.run_number }}
          path: out/haiku-back-r4.json
          retention-days: 14
          if-no-files-found: warn
