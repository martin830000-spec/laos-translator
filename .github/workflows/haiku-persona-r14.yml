name: Haiku R14 persona ablation one-shot TEST
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: haiku-r14-persona-one-shot
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.issue.title == 'HAIKU_R14_PERSONA_ABLATION_20261028_ONE_SHOT' &&
      contains(github.event.issue.body, 'APPROVAL=HAIKU_R14_PERSONA_ABLATION_MAX_0P192USD') &&
      github.event.issue.user.login == 'martin830000-spec' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free offline R14 preflight
        run: |
          python3 -m py_compile experiments/haiku-persona-r14/persona-r14.py
          python3 experiments/haiku-persona-r14/persona-r14.py --offline
      - name: Approved single Haiku 5.5 persona ablation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_R14_PERSONA_ABLATION_MAX_0P192USD
        run: python3 experiments/haiku-persona-r14/persona-r14.py
      - name: Preserve public synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-persona-r14-${{ github.run_number }}
          path: out/haiku-persona-r14.json
          retention-days: 14
          if-no-files-found: warn
