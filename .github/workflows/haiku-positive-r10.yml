name: Haiku R10 positive Lao constraint one-shot TEST
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: haiku-r10-positive-one-shot
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'martin830000-spec/laos-translator' &&
      github.event.issue.title == 'HAIKU_R10_POSITIVE_20261028_ONE_SHOT' &&
      contains(github.event.issue.body, 'APPROVAL=HAIKU_R10_POSITIVE_MAX_0P192USD') &&
      github.event.issue.user.login == 'martin830000-spec' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Free offline R10 preflight
        run: |
          python3 -m py_compile experiments/haiku-positive-r10/positive-r10.py
          python3 experiments/haiku-positive-r10/positive-r10.py --offline
      - name: Approved single Haiku 5.5 R10 minimal modification comparison
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAID_APPROVAL: HAIKU_R10_POSITIVE_MAX_0P192USD
        run: python3 experiments/haiku-positive-r10/positive-r10.py
      - name: Preserve public synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haiku-positive-r10-${{ github.run_number }}
          path: out/haiku-positive-r10.json
          retention-days: 14
          if-no-files-found: warn
