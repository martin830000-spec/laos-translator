name: Haiku round2 offline only
on:
  push:
    paths:
      - 'experiments/haiku-round2/**'
      - '.github/workflows/haiku-round2-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 experiments/haiku-round2/runner.py
      - run: python3 -m unittest discover -s experiments/haiku-round2 -p 'test_*.py' -v
