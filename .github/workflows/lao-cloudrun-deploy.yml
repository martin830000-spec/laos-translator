# Read-only GitHub -> Google Cloud Run OIDC connectivity check.
# This workflow intentionally has NO build, deploy, traffic, or Firestore write commands.
name: Lao Cloud Run OIDC Connection Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lao-cloudrun-deploy.yml
      - cloudrun/requests/*

permissions:
  contents: read
  id-token: write

concurrency:
  group: lao-cloudrun-oidc-connection-check
  cancel-in-progress: false

jobs:
  auth-and-readonly:
    name: Authenticate and inspect existing relays (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/github-actions
          service_account: lao-github-deployer@gen-lang-client-0422436907.iam.gserviceaccount.com

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: gen-lang-client-0422436907

      - name: Verify identity and existing Cloud Run revisions (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          echo 'Authenticated account:'
          gcloud auth list --filter='status:ACTIVE' --format='value(account)'
          echo 'Seoul latest ready revision:'
          gcloud run services describe lao-stt-relay \
            --project=gen-lang-client-0422436907 \
            --region=asia-northeast3 \
            --format='value(status.latestReadyRevisionName)'
          echo 'Bangkok latest ready revision:'
          gcloud run services describe lao-stt-relay-bkk \
            --project=gen-lang-client-0422436907 \
            --region=asia-southeast3 \
            --format='value(status.latestReadyRevisionName)'
          echo 'Inspect dedicated image repositories (READ ONLY):'
          gcloud artifacts repositories describe lao-translator-deploy \
            --project=gen-lang-client-0422436907 \
            --location=asia-northeast3 \
            --format='value(name)'
          gcloud artifacts repositories describe lao-translator-deploy \
            --project=gen-lang-client-0422436907 \
            --location=asia-southeast3 \
            --format='value(name)'
          echo 'PASS: OIDC, two Cloud Run services and two dedicated Artifact Registry repositories readable. Nothing deployed.'
      - name: Verify inactive candidates and anonymous access guard (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          for row in 'lao-stt-relay asia-northeast3 lao-stt-relay-00033-jin lao-stt-relay-00035-wov' 'lao-stt-relay-bkk asia-southeast3 lao-stt-relay-bkk-00032-woh lao-stt-relay-bkk-00034-zop'; do
            read -r svc region active candidate <<< "$row"
            jsonfile="$RUNNER_TEMP/$svc-status.json"
            gcloud run services describe "$svc" --project gen-lang-client-0422436907 --region "$region" --format=json > "$jsonfile"
            candidate_url="$(python3 - "$jsonfile" "$active" "$candidate" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          old,new=sys.argv[2:4]
          traffic=d.get('status',{}).get('traffic',[])
          active=[(t.get('revisionName'),int(t.get('percent') or 0)) for t in traffic if int(t.get('percent') or 0)>0]
          assert active==[(old,100)], f'Unexpected production traffic: {active}'
          matching=[t for t in traffic if t.get('revisionName')==new]
          assert len(matching)==1, f'Candidate revision missing: {new}'
          t=matching[0]
          assert int(t.get('percent') or 0)==0, f'Candidate unexpectedly serving live traffic: {t}'
          assert t.get('tag')=='audit-20261106', f'Candidate tag missing: {t}'
          url=t.get('url','').rstrip('/')
          assert url.startswith('https://'), 'Candidate tag URL absent'
          print(url)
          PY
            )"
            echo "PASS: $svc active 100%=$active; inactive 0%=$candidate"
            # An anonymous check verifies reachability and authentication guard,
            # not Firestore; no shared token, secrets or user records are requested.
            http_code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$candidate_url/health")"
            case "$http_code" in
              401) echo "PASS: $svc candidate rejects anonymous /health (HTTP 401)" ;;
              *) echo "BLOCKED: $svc candidate anonymous status HTTP $http_code (expected 401)"; exit 1 ;;
            esac
          done
          echo 'PASS: both candidates remain inactive and authentication-guarded. No writes.'
      - name: Verify private release archive and run offline backend tests (NO deployment)
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          gcloud storage cp 'gs://lao-translator-src-460077888071/releases/translator_cloudrun_engine_audit_deploy_20261106.zip' "$workdir/release.zip" --quiet
          echo '08696a3a58f0fc9663fd85196c37d7a1da9bbf22e4a4e298cc445026b9c8f882  '"$workdir"'/release.zip' | sha256sum --check --status
          unzip -q "$workdir/release.zip" -d "$workdir"
          cd "$workdir/translator_cloudrun_engine_audit_deploy_20261106"
          sha256sum -c SHA256SUMS.txt
          node --check source/server.js
          node test_engine_audit.cjs
          echo 'PASS: private release download, SHA-256 verification and backend tests. No image built; no service changed.'


  build-private-candidate-images:
    # Deliberately NOT automatic on workflow edits or normal pushes. Requires a
    # repository-owner main-branch commit with an explicit [build-relay] marker.
    if: github.event_name == 'push' && github.actor == 'martin830000-spec' && contains(github.event.head_commit.message, '[build-relay]')
    name: Build signed-source image for both dedicated registries (NO Cloud Run deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout minimal public workflow metadata
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without keys
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/github-actions
          service_account: lao-github-deployer@gen-lang-client-0422436907.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: gen-lang-client-0422436907

      - name: Download pinned private ZIP and verify offline tests
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/lao-private-build"
          mkdir -p "$workdir"
          gcloud storage cp 'gs://lao-translator-src-460077888071/releases/translator_cloudrun_engine_audit_deploy_20261106.zip' "$workdir/release.zip" --quiet
          echo '08696a3a58f0fc9663fd85196c37d7a1da9bbf22e4a4e298cc445026b9c8f882  '"$workdir"'/release.zip' | sha256sum --check --status
          unzip -q "$workdir/release.zip" -d "$workdir"
          cd "$workdir/translator_cloudrun_engine_audit_deploy_20261106"
          sha256sum -c SHA256SUMS.txt
          node --check source/server.js
          node test_engine_audit.cjs
          echo 'PASS: trusted private source and tests verified. No secrets or source uploaded to public GitHub.'

      - name: Docker build and push images (NO Cloud Run deployment)
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/lao-private-build/translator_cloudrun_engine_audit_deploy_20261106/source"
          dockerfile="$RUNNER_TEMP/lao-private-build/Dockerfile"
          cat > "$dockerfile" <<'DOCKERFILE'
          FROM node:20-bookworm-slim
          ENV NODE_ENV=production
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund && npm cache clean --force
          COPY server.js ./
          USER node
          EXPOSE 8080
          CMD ["node", "server.js"]
          DOCKERFILE
          tag="audit-20261106-$(echo "$GITHUB_SHA" | cut -c1-12)"
          seoul="asia-northeast3-docker.pkg.dev/gen-lang-client-0422436907/lao-translator-deploy/lao-relay:$tag"
          bangkok="asia-southeast3-docker.pkg.dev/gen-lang-client-0422436907/lao-translator-deploy/lao-relay:$tag"
          docker build --pull --file "$dockerfile" --tag "$seoul" "$source_dir"
          docker tag "$seoul" "$bangkok"
          for region in asia-northeast3 asia-southeast3; do
            gcloud auth print-access-token | docker login --username oauth2accesstoken --password-stdin "https://$region-docker.pkg.dev" >/dev/null
          done
          docker push "$seoul"
          docker push "$bangkok"
          echo "Seoul candidate image: $seoul"
          echo "Bangkok candidate image: $bangkok"
          echo 'PASS: images pushed only. Cloud Run revisions and traffic are unchanged.'


  deploy-zero-traffic-candidate:
    # Only a deliberate main-branch request commit by the repository owner.
    # No production traffic promotion is implemented anywhere in this workflow.
    if: github.event_name == 'push' && github.actor == 'martin830000-spec' && (contains(github.event.head_commit.message, '[candidate-seoul]') || contains(github.event.head_commit.message, '[candidate-bangkok]'))
    name: Prepare inactive 0%-traffic Cloud Run candidate (no promotion)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: gen-lang-client-0422436907
          workload_identity_provider: projects/460077888071/locations/global/workloadIdentityPools/lao-github-deploy/providers/github-actions
          service_account: lao-github-deployer@gen-lang-client-0422436907.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: gen-lang-client-0422436907

      - name: Verify pinned registry image in isolated local container (no paid API)
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          case "$COMMIT_MESSAGE" in
            *'[candidate-seoul]'*) region='asia-northeast3' ;;
            *'[candidate-bangkok]'*) region='asia-southeast3' ;;
            *) echo 'No approved candidate request marker'; exit 2 ;;
          esac
          image="$region-docker.pkg.dev/gen-lang-client-0422436907/lao-translator-deploy/lao-relay:audit-20261106-584e3014e1a9"
          gcloud auth print-access-token | docker login --username oauth2accesstoken --password-stdin "https://$region-docker.pkg.dev" >/dev/null
          docker pull "$image"
          docker run --rm -d --name lao-candidate-smoke -e STT_SHARED_TOKEN=github-local-smoke-only -p 127.0.0.1:18080:8080 "$image"
          trap 'docker rm -f lao-candidate-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          sleep 2
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 4 -H 'x-app-token: github-local-smoke-only' -o "$RUNNER_TEMP/lao-health.json" 'http://127.0.0.1:18080/health'; then
              if python3 -c "import json,sys; x=json.load(sys.stdin); assert x.get('ok') is True; assert x.get('version') == '3.7.18'; assert 'telemetry-engine-audit-v1' in x.get('capabilities',[])" < "$RUNNER_TEMP/lao-health.json"; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'FAIL: isolated container did not become healthy; no deployment attempted.'
            docker ps --all --filter name=lao-candidate-smoke
            docker logs --tail 40 lao-candidate-smoke || true
            exit 1
          fi
          echo 'PASS: isolated container health, patch capability and startup confirmed.'

      - name: Deploy 0%-traffic candidate only and verify live traffic has not changed
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          PROJECT='gen-lang-client-0422436907'
          case "$COMMIT_MESSAGE" in
            *'[candidate-seoul]'*) svc='lao-stt-relay'; region='asia-northeast3'; baseline='lao-stt-relay-00033-jin'; previous_digest='c1230d98be72974a5225f10d8686af8394f83f10fe3a8bba4e813ddca71c27d2' ;;
            *'[candidate-bangkok]'*) svc='lao-stt-relay-bkk'; region='asia-southeast3'; baseline='lao-stt-relay-bkk-00032-woh'; previous_digest='a32345fed97ffdc2589b465c0f39e372a1feb9553b5e5d8ece2b45a62c6cc491' ;;
            *) exit 2 ;;
          esac
          before="$RUNNER_TEMP/before.json"
          after="$RUNNER_TEMP/after.json"
          gcloud run services describe "$svc" --project "$PROJECT" --region "$region" --format=json > "$before"
          python3 - "$before" "$baseline" "$previous_digest" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']['latestReadyRevisionName']==sys.argv[2], 'Baseline revision changed: abort'
          current=d['spec']['template']['spec']['containers'][0]['image']
          assert current.endswith('@sha256:'+sys.argv[3]), 'Baseline image digest changed: abort'
          print('PASS: service baseline revision and image digest match')
          PY
          candidate_image="$region-docker.pkg.dev/$PROJECT/lao-translator-deploy/lao-relay:audit-20261106-584e3014e1a9"
          gcloud run deploy "$svc" --project "$PROJECT" --region "$region" \
            --image "$candidate_image" --no-traffic --tag audit-20261106 --quiet
          gcloud run services describe "$svc" --project "$PROJECT" --region "$region" --format=json > "$after"
          python3 - "$before" "$after" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          def active(s):
              return sorted((t.get('revisionName'),int(t.get('percent',0))) for t in s.get('status',{}).get('traffic',[]) if int(t.get('percent',0))>0)
          x,y=active(a),active(b)
          assert x==y,(x,y)
          assert b['status']['latestReadyRevisionName']!=a['status']['latestReadyRevisionName'], 'Candidate revision not created'
          assert b['spec']['template']['spec'].get('serviceAccountName')==a['spec']['template']['spec'].get('serviceAccountName'), 'Runtime identity changed'
          def envs(s):
              return s['spec']['template']['spec']['containers'][0].get('env',[])
          assert envs(a)==envs(b), 'Runtime env or secret references changed'
          print('PASS: 0% candidate created without changing active production traffic, runtime identity or environment.')
          print('Production revisions (unchanged):',x)
          print('New candidate revision:',b['status']['latestReadyRevisionName'])
          PY
          echo 'NO live traffic promotion, no Firestore writes or paid translation test were performed.'
