name: Luna app source read-only export
on:
  push:
    branches: [test/luna-base-app-20261112]
    paths: [.github/workflows/luna-app-source-readonly.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'martin830000-spec/laos-translator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package tracked public app sources only
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, hashlib, json
          selected=[]
          for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if p in ('index.html','index.test.html','version.json','manifest.json','package.json','sw.js','service-worker.js') or p.startswith(('.github/workflows/','js/','scripts/','assets/')):
                  f=pathlib.Path(p)
                  if f.is_file(): selected.append(p)
          manifest={p:{'bytes':pathlib.Path(p).stat().st_size,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p in selected}
          with zipfile.ZipFile('luna-app-source-readonly.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in selected: z.write(p,p)
              z.writestr('READONLY_MANIFEST.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Read-only source files:',len(selected),'generation API calls: 0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: luna-app-source-readonly
          path: luna-app-source-readonly.zip
          retention-days: 3
          if-no-files-found: error
