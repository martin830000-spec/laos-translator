name: Luna selector pinned source export (no model API)
on:
  push:
    branches: [test/luna-base-engine-selector-20261113]
    paths: [.github/workflows/luna-selector-source-readonly.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9dc4d36f6896dd8b4f6d59df61563202dc60d3c3
          persist-credentials: false
      - name: Verify and archive existing public app source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '90cd8cc5a71098616569128704e52da0304d6df5'
          mkdir -p "$RUNNER_TEMP/luna-selector-source"
          for f in index.html version.json prompt-config.json glossary-config.json; do
            if [ -f "$f" ]; then cp -- "$f" "$RUNNER_TEMP/luna-selector-source/$f"; fi
          done
          git rev-parse HEAD > "$RUNNER_TEMP/luna-selector-source/COMMIT.txt"
          cd "$RUNNER_TEMP/luna-selector-source"
          sha256sum *.html *.json COMMIT.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: luna-selector-pinned-app-source
          path: ${{ runner.temp }}/luna-selector-source/
          retention-days: 3
          if-no-files-found: error
