name: Crossed method audit bounded TEST
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: method-audit-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gemini:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.run_attempt == 1 && github.event.issue.title == 'METHOD_AUDIT_20261030' && github.event.issue.user.login == 'martin830000-spec' && fromJSON(github.event.issue.body).engine == 'gemini'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline guards no credentials
        run: |
          node --test experiments/four-engine-research/audit.test.mjs experiments/four-engine-research/lara.test.mjs experiments/four-engine-research/lara-style2.test.mjs experiments/four-engine-research/gemini-format.test.mjs experiments/four-engine-research/continue-r7.test.mjs experiments/four-engine-research/method-audit.test.mjs
          node experiments/four-engine-research/method-audit.mjs preflight "${{ fromJSON(github.event.issue.body).phase }}"
      - name: Permanent engine-specific one-shot lock
        uses: actions/github-script@v7
        with:
          script: |
            const p=JSON.parse(context.payload.issue.body).phase;
            const fs=require('fs'),plan=JSON.parse(fs.readFileSync('experiments/four-engine-research/method-audit-plan.json'));
            if(!plan[p]||plan[p].engine!==JSON.parse(context.payload.issue.body).engine)throw Error('Invalid phase');
            await github.rest.git.createRef({...context.repo, ref:'refs/tags/METHOD_AUDIT_20261030-'+p+'-consumed', sha:context.sha});
      - name: Bounded direct call no retries
        env:
          RESEARCH_PHASE: ${{ fromJSON(github.event.issue.body).phase }}
          RESEARCH_LOCK: METHOD_AUDIT_20261030-${{ fromJSON(github.event.issue.body).phase }}
          RESULT_PUBLIC_KEY_BASE64: ${{ fromJSON(github.event.issue.body).result_public_key_base64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/four-engine-research/method-audit.mjs execute
      - name: Encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-${{ fromJSON(github.event.issue.body).phase }}-encrypted-${{ github.run_id }}
          path: out/method-${{ fromJSON(github.event.issue.body).phase }}/sealed.json
          if-no-files-found: warn
          retention-days: 7
  google:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.run_attempt == 1 && github.event.issue.title == 'METHOD_AUDIT_20261030' && github.event.issue.user.login == 'martin830000-spec' && fromJSON(github.event.issue.body).engine == 'google'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline guards no credentials
        run: |
          node --test experiments/four-engine-research/audit.test.mjs experiments/four-engine-research/lara.test.mjs experiments/four-engine-research/lara-style2.test.mjs experiments/four-engine-research/gemini-format.test.mjs experiments/four-engine-research/continue-r7.test.mjs experiments/four-engine-research/method-audit.test.mjs
          node experiments/four-engine-research/method-audit.mjs preflight "${{ fromJSON(github.event.issue.body).phase }}"
      - name: Permanent engine-specific one-shot lock
        uses: actions/github-script@v7
        with:
          script: |
            const p=JSON.parse(context.payload.issue.body).phase;
            const fs=require('fs'),plan=JSON.parse(fs.readFileSync('experiments/four-engine-research/method-audit-plan.json'));
            if(!plan[p]||plan[p].engine!==JSON.parse(context.payload.issue.body).engine)throw Error('Invalid phase');
            await github.rest.git.createRef({...context.repo, ref:'refs/tags/METHOD_AUDIT_20261030-'+p+'-consumed', sha:context.sha});
      - name: Bounded direct call no retries
        env:
          RESEARCH_PHASE: ${{ fromJSON(github.event.issue.body).phase }}
          RESEARCH_LOCK: METHOD_AUDIT_20261030-${{ fromJSON(github.event.issue.body).phase }}
          RESULT_PUBLIC_KEY_BASE64: ${{ fromJSON(github.event.issue.body).result_public_key_base64 }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: node experiments/four-engine-research/method-audit.mjs execute
      - name: Encrypted evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-${{ fromJSON(github.event.issue.body).phase }}-encrypted-${{ github.run_id }}
          path: out/method-${{ fromJSON(github.event.issue.body).phase }}/sealed.json
          if-no-files-found: warn
          retention-days: 7

