name: Opus S1 private minimal approved24
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
  actions: read
concurrency:
  group: opus-s1-min24-20261030-once
  cancel-in-progress: false
jobs:
  approved24:
    if: github.event.issue.title == 'OPUS55_S1_MIN24_20261030_R1' && github.event.issue.user.login == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned encryption dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Offline guards; no model credentials
        run: python3 -m unittest discover -s experiments/opus-s1-min24 -p 'test_*.py' -v
      - name: Prepare ephemeral encrypted input channel
        run: python3 experiments/opus-s1-min24/run.py prepare --state "$RUNNER_TEMP/opus-s1-private24"
      - name: Publish public handshake only
        uses: actions/upload-artifact@v4
        with:
          name: opus-public-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/opus-s1-private24/handshake.json
          retention-days: 1
      - name: Execute only approved Opus S1; never log private data
        timeout-minutes: 27
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/opus-s1-min24/run.py execute --state "$RUNNER_TEMP/opus-s1-private24"
      - name: Preserve encrypted partial or complete result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus-encrypted-result-${{ github.run_id }}
          path: ${{ runner.temp }}/opus-s1-private24/sealed-result.json
          if-no-files-found: warn
          retention-days: 7
