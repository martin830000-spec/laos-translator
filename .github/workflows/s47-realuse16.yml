name: S47 private real-use approved16
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
  actions: read
concurrency:
  group: s47-realuse16-20261030-once
  cancel-in-progress: false
jobs:
  approved16:
    if: github.event.issue.title == 'S47_REALUSE16_20261030_NO_MONEY_LIMIT' && github.event.issue.user.login == 'martin830000-spec' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned encryption dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Offline guards; no model credentials
        run: python3 -m unittest discover -s experiments/s47-realuse16 -p 'test_*.py' -v
      - name: Prepare ephemeral encrypted input channel
        run: python3 experiments/s47-realuse16/run.py prepare --state "$RUNNER_TEMP/s47-private16"
      - name: Publish public handshake only
        uses: actions/upload-artifact@v4
        with:
          name: s47-public-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/s47-private16/handshake.json
          retention-days: 1
      - name: Execute only approved S47; never log private data
        timeout-minutes: 27
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/s47-realuse16/run.py execute --state "$RUNNER_TEMP/s47-private16"
      - name: Preserve encrypted partial or complete result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s47-encrypted-result-${{ github.run_id }}
          path: ${{ runner.temp }}/s47-private16/sealed-result.json
          if-no-files-found: warn
          retention-days: 7
