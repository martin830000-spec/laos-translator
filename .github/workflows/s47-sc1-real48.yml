name: Approved private S47 SC1 real12 maximum48
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: s47-sc1-real48-20261031-once-v1
  cancel-in-progress: false
jobs:
  approved48:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.event.issue.user.login == 'martin830000-spec' && github.event.issue.title == 'WORK_S47_SC1_REAL48_20261031_APPROVED_V1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Check new controller safety with mock responses
        run: python3 -m unittest discover -s experiments/s47-sc1-real48 -p 'test_*.py' -v
      - name: Prepare reused private input channel
        run: python3 experiments/s47-sc1-real48/run.py prepare "$RUNNER_TEMP/real48"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real48-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/real48/handshake.json
          retention-days: 1
      - name: Authenticate existing Secret and execute approved real48 without retries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/s47-sc1-real48/run.py execute "$RUNNER_TEMP/real48"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real48-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/real48/sealed-result.json
          if-no-files-found: warn
          retention-days: 7
