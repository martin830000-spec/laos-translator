name: Approved Claude Sonnet KI1 versus S1 new6 max24 encrypted TEST
on:
  push:
    branches: [research/claude-daily12-20261101]
    paths: ['experiments/sonnet-ki1-stage2-24/config.json']
permissions:
  contents: write
  issues: read
concurrency:
  group: sonnet-ki1-stage2-24-20261101-once-v1
  cancel-in-progress: false
jobs:
  approved32:
    if: github.repository == 'martin830000-spec/laos-translator' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Exact approval and frozen candidate check before credentials
        run: python3 -c "import runpy; d=runpy.run_path('experiments/sonnet-ki1-stage2-24/actions_bridge.py'); d['approval_guard']()"
      - name: New bounded campaign safety tests
        run: python3 -m unittest discover -s experiments/sonnet-ki1-stage2-24 -p 'test_*.py' -v
      - name: Localized full prompt and unchanged output tests
        run: python3 -m unittest discover -s experiments/sonnet-ki1 -p 'test_*.py' -v
      - name: Prepare private channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/sonnet-ki1-stage2-24/actions_bridge.py prepare "$RUNNER_TEMP/sonnet-ki1-stage2-24"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonnet-ki1-stage2-24-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/sonnet-ki1-stage2-24/handshake.json
          retention-days: 1
      - name: Only approved KI1 stage2 up to24 calls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/sonnet-ki1-stage2-24/actions_bridge.py execute "$RUNNER_TEMP/sonnet-ki1-stage2-24"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sonnet-ki1-stage2-24-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/sonnet-ki1-stage2-24/sealed-result.json
          retention-days: 7
          if-no-files-found: warn
