name: Approved Sonnet SA2 stage2 new normal6 AB24 encrypted TEST
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: sonnet-sa2-stage2-24-20261101-once-v1
  cancel-in-progress: false
jobs:
  approved32:
    if: github.repository == 'martin830000-spec/laos-translator' && github.actor == 'martin830000-spec' && github.event.issue.user.login == 'martin830000-spec' && github.event.issue.title == 'WORK_SONNET_SA2_STAGE2_24_20261101_APPROVED_V1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: dd70385b10c61392b57ac2758a9d747514623a6a
      - run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Exact approval and frozen candidate check before credentials
        run: python3 -c "import runpy; d=runpy.run_path('experiments/sonnet-sa2-stage2-24/actions_bridge.py'); d['approval_guard']()"
      - name: New bounded campaign safety tests
        run: python3 -m unittest discover -s experiments/sonnet-sa2-stage2-24 -p 'test_*.py' -v
      - name: Original SA2 frozen adapter tests
        run: python3 -m unittest discover -s experiments/sonnet-sa2-medium -p 'test_*.py' -v
      - name: Prepare private channel
        run: python3 experiments/sonnet-sa2-stage2-24/actions_bridge.py prepare "$RUNNER_TEMP/sonnet-sa2-stage2-24"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonnet-sa2-stage2-24-handshake-${{ github.run_id }}
          path: ${{ runner.temp }}/sonnet-sa2-stage2-24/handshake.json
          retention-days: 1
      - name: Only approved SA1 SA2 stage2 up to24 calls
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 experiments/sonnet-sa2-stage2-24/actions_bridge.py execute "$RUNNER_TEMP/sonnet-sa2-stage2-24"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sonnet-sa2-stage2-24-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/sonnet-sa2-stage2-24/sealed-result.json
          retention-days: 7
          if-no-files-found: warn

