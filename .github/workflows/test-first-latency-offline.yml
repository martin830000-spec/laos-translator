name: TEST-only FIRST latency diagnostics offline checks
on:
  push:
    branches:
      - research/first-latency-diagnostics-test-20261122
    paths:
      - index.html
      - test-latency-probe-r1.js
      - tests/test-latency-probe-r1.test.cjs
      - .github/workflows/test-first-latency-offline.yml
permissions:
  contents: read
concurrency:
  group: test-first-latency-offline
  cancel-in-progress: false
jobs:
  free-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dedicated TEST branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify only the intended opt-in script tag was added to the app
        run: |
          node --check test-latency-probe-r1.js
          node -e 'const fs=require("fs"),crypto=require("crypto");const s=fs.readFileSync("index.html","utf8");const tag="<!-- TEST-ONLY FIRST/BACK latency diagnostics; enable with ?latencyProbe=1 -->\n<script defer src=\"./test-latency-probe-r1.js\"></script>\n";if(s.split(tag).length!==2)process.exit(1);const old=s.replace(tag,"");const blob=crypto.createHash("sha1").update("blob "+Buffer.byteLength(old)+"\0").update(old).digest("hex");if(blob!=="4af4cbe48b6071f8d2bb7a08f5e1cf0429ce1b8d")process.exit(2);'
      - name: Zero-key synthetic probe tests; no Gemini calls
        run: node --test tests/test-latency-probe-r1.test.cjs
