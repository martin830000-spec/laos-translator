name: Couple Pages Voice Route R2 TEST Gate
on:
  push:
    branches:
      - test/text-direct-voice-route-ui-r2-20261014
      - test/rollback-r3-to-r2-20261015-r1
      - test/couple-r2-manual-auto-route-parity-r1-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-mocked-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

# Historical branch-only gate. Original main before Luna already failed 13/31 identical
# archived comparison + stale payload-pin tests (run 43323358324).
# Current main integration is protected by current-test-luna-gate.yml instead.
